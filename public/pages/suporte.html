<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Expires" content="0">
<title>Suporte &amp; Melhorias</title>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<script src="/assets/mobile-app.js"></script>
<link rel="stylesheet" href="/assets/mobile-app.css">
<style>
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:var(--font);background:var(--content-bg);color:var(--content-text);min-height:100vh; }

/* ── TOOLBAR ─────────────────────────────────────────────────────────────── */
.toolbar-bar {
  background:var(--card-bg);border-bottom:1px solid var(--card-border);
  padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.04);
}
.toolbar-title { font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px; }
.toolbar-title i { color:var(--accent); }

/* ── TABS ─────────────────────────────────────────────────────────────────── */
.tabs { display:flex;gap:4px;background:var(--card-bg);border-bottom:1px solid var(--card-border);padding:0 24px; }
.tab-btn {
  padding:12px 20px;font-size:.88rem;font-weight:600;cursor:pointer;border:none;
  background:none;color:var(--text2);border-bottom:2px solid transparent;transition:.2s;
}
.tab-btn.active { color:var(--accent);border-bottom-color:var(--accent); }
.tab-pane { display:none; }
.tab-pane.active { display:block; }

/* ── FORM ─────────────────────────────────────────────────────────────────── */
.form-wrap { padding:20px;padding-bottom:4px; }
.form-card { background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:24px; }
.form-card h3 { font-size:1rem;font-weight:700;margin-bottom:4px; }
.form-card p  { font-size:.85rem;color:var(--text2);margin-bottom:20px; }
.field-group { display:grid;gap:16px; }
.field-group.cols2 { grid-template-columns:1fr 1fr; }
label { display:block;font-size:.82rem;font-weight:600;color:var(--text2);margin-bottom:5px; }
input[type=text], textarea, select {
  width:100%;padding:9px 12px;border:1px solid var(--card-border);border-radius:8px;
  font-size:.9rem;background:var(--content-bg);color:var(--content-text);font-family:var(--font);
  transition:border-color .2s;outline:none;
}
input[type=text]:focus, textarea:focus, select:focus { border-color:var(--accent); }
select option { background:var(--card-bg);color:var(--content-text); }
textarea { resize:vertical;min-height:120px; }

/* origem pills */
.origem-pills { display:flex;gap:8px; }
.origem-pill {
  flex:1;padding:10px;border:1px solid var(--card-border);border-radius:10px;cursor:pointer;
  text-align:center;font-size:.85rem;font-weight:600;transition:.2s;background:var(--content-bg);
  color:var(--text2);
}
.origem-pill.active { border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent); }
.origem-pill i { display:block;font-size:1.3rem;margin-bottom:4px; }

/* upload */
.upload-zone {
  border:2px dashed var(--card-border);border-radius:10px;padding:20px;text-align:center;
  cursor:pointer;transition:.2s;color:var(--text2);font-size:.85rem;
}
.upload-zone:hover { border-color:var(--accent);color:var(--accent); }
.upload-zone input { display:none; }
.file-list { margin-top:10px;display:flex;flex-wrap:wrap;gap:6px; }
.file-chip {
  background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid var(--card-border);
  border-radius:6px;padding:4px 8px;font-size:.75rem;display:flex;align-items:center;gap:6px;
}
.file-chip button { background:none;border:none;cursor:pointer;color:#ef4444;padding:0;line-height:1; }

/* progress bar */
#upload-progress { height:4px;background:var(--card-border);border-radius:4px;margin-top:12px;overflow:hidden;display:none; }
#upload-progress-bar { height:100%;background:var(--accent);transition:width .3s; }

/* sticky footer */
.sticky-footer {
  position:sticky;bottom:0;z-index:50;
  background:var(--card-bg);border-top:1px solid var(--card-border);
  padding:12px 20px;display:flex;justify-content:flex-end;align-items:center;gap:12px;
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}

/* btn */
.btn-primary {
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:11px 28px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s;
}
.btn-primary:hover { opacity:.9; }
.btn-primary:disabled { opacity:.5;cursor:default; }

/* ── LIST ─────────────────────────────────────────────────────────────────── */
.list-wrap { padding:20px; }
.list-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px; }
.sol-card {
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;
  padding:16px;margin-bottom:10px;cursor:pointer;transition:.15s;
}
.sol-card:hover { border-color:var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.06); }
.sol-card-header { display:flex;justify-content:space-between;align-items:flex-start;gap:8px; }
.sol-titulo { font-size:.95rem;font-weight:600; }
.sol-meta { display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:.75rem;color:var(--text2); }
.sol-meta span { display:flex;align-items:center;gap:4px; }

/* status badges */
.badge {
  padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;
}
.badge-pendente        { background:rgba(100,116,139,.15);color:#64748b; }
.badge-em_analise      { background:rgba(59,130,246,.15);color:#3b82f6; }
.badge-em_desenvolvimento { background:rgba(245,158,11,.15);color:#f59e0b; }
.badge-concluido       { background:rgba(34,197,94,.15);color:#22c55e; }
.badge-recusado        { background:rgba(239,68,68,.15);color:#ef4444; }

/* tipo badges */
.tipo-pill { padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600;background:var(--card-border); }

/* resposta dev */
.resposta-box {
  background:color-mix(in srgb,var(--accent) 8%,transparent);
  border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:12px;font-size:.85rem;margin-top:12px;
}

/* ── MODAL ─────────────────────────────────────────────────────────────────── */
.modal-overlay {
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;
  align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;
}
.modal-overlay.open { display:flex; }
.modal-box {
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;
  width:100%;max-width:680px;margin:auto;
}
.modal-header {
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 24px;border-bottom:1px solid var(--card-border);
}
.modal-header h3 { font-size:1rem;font-weight:700; }
.modal-close { background:none;border:none;cursor:pointer;color:var(--text2);font-size:1.2rem;padding:4px; }
.modal-body { padding:24px; }
.modal-field { margin-bottom:14px; }
.modal-field label { font-size:.75rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em; }
.modal-field p { font-size:.88rem;margin-top:4px;white-space:pre-wrap; }

/* anexos */
.anexo-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px; }
.anexo-item {
  border:1px solid var(--card-border);border-radius:8px;overflow:hidden;cursor:pointer;
  font-size:.72rem;text-align:center;aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:8px;
  transition:.2s;background:var(--content-bg);color:var(--text2);
  text-decoration:none;
}
.anexo-item:hover { border-color:var(--accent);color:var(--accent); }
.anexo-item img { width:100%;height:70%;object-fit:cover;border-radius:4px; }
.anexo-item i { font-size:1.8rem; }

/* empty */
.empty-state { text-align:center;padding:48px 24px;color:var(--text2); }
.empty-state i { font-size:2.5rem;margin-bottom:12px;display:block;opacity:.4; }
.empty-state p { font-size:.88rem; }

/* toast */
#toast {
  position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 20px;
  border-radius:10px;font-size:.88rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);
  transform:translateY(80px);opacity:0;transition:.25s;pointer-events:none;
}
#toast.show { transform:none;opacity:1; }
#toast.ok  { background:#22c55e;color:#fff; }
#toast.err { background:#ef4444;color:#fff; }

@media (max-width:600px) {
  .field-group.cols2 { grid-template-columns:1fr; }
  .form-wrap,.list-wrap { padding:16px; }
  .form-card { padding:16px; }
}
</style>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- Toolbar -->
<div class="toolbar-bar">
  <span class="toolbar-title"><i class="fa-solid fa-headset"></i>Suporte &amp; Melhorias</span>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn active" data-tab="nova" onclick="Tab.show('nova')">
    <i class="fa-solid fa-plus me-1"></i> Nova Solicitação
  </button>
  <button class="tab-btn" data-tab="minhas" onclick="Tab.show('minhas')">
    <i class="fa-solid fa-list-check me-1"></i> Minhas Solicitações
    <span id="badge-total" style="display:none;background:var(--accent);color:#fff;border-radius:20px;padding:0 7px;font-size:.7rem;margin-left:6px">0</span>
  </button>
</div>

<!-- ─── ABA: NOVA SOLICITAÇÃO ─────────────────────────────────────────────── -->
<div id="tab-nova" class="tab-pane active">
  <div class="form-wrap">
    <div class="form-card">
      <h3><i class="fa-solid fa-lightbulb" style="color:var(--accent)"></i> Enviar Solicitação</h3>
      <p>Descreva sua ideia, melhoria, dúvida ou bug. Você pode anexar prints, vídeos e áudios.</p>

      <form id="form-solicitacao" onsubmit="Form.submit(event)">
        <div class="field-group">

          <!-- Título -->
          <div>
            <label>Título <span style="color:#ef4444">*</span></label>
            <input type="text" id="f-titulo" placeholder="Resuma em poucas palavras..." autocomplete="off" required maxlength="200">
          </div>

          <!-- Tipo + Origem -->
          <div class="field-group cols2">
            <div>
              <label>Tipo</label>
              <select id="f-tipo">
                <option value="melhoria">💡 Melhoria / Ideia</option>
                <option value="bug">🐛 Bug / Erro</option>
                <option value="duvida">❓ Dúvida</option>
                <option value="ideia">✨ Nova Funcionalidade</option>
              </select>
            </div>
            <div>
              <label>Estou usando o sistema no... <span style="color:#ef4444">*</span></label>
              <div class="origem-pills">
                <div class="origem-pill active" data-origem="desktop" onclick="Form.setOrigem('desktop')">
                  <i class="fa-solid fa-desktop"></i> Desktop
                </div>
                <div class="origem-pill" data-origem="mobile" onclick="Form.setOrigem('mobile')">
                  <i class="fa-solid fa-mobile-screen-button"></i> Mobile
                </div>
              </div>
            </div>
          </div>

          <!-- Descrição -->
          <div>
            <label>Descrição detalhada <span style="color:#ef4444">*</span></label>
            <textarea id="f-descricao" placeholder="Descreva com detalhes. O que você quer? Como funciona hoje? Como deveria funcionar?" required></textarea>
          </div>

          <!-- Anexos -->
          <div>
            <label>Anexos (prints, vídeos, áudios — máx. 10 arquivos)</label>
            <div class="upload-zone" onclick="document.getElementById('f-files').click()">
              <i class="fa-solid fa-paperclip" style="font-size:1.4rem;margin-bottom:6px"></i>
              <div>Clique para adicionar arquivos</div>
              <div style="font-size:.75rem;margin-top:4px;opacity:.7">Imagens, vídeos (mp4, webm) e áudios (mp3, m4a, ogg)</div>
              <input type="file" id="f-files" multiple accept="image/*,video/mp4,video/webm,video/quicktime,audio/*" onchange="Form.addFiles(this.files)">
            </div>
            <div id="file-list" class="file-list"></div>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>

<!-- rodapé sticky — visível apenas na aba Nova Solicitação -->
<div class="sticky-footer" id="footer-nova">
  <span id="footer-status" style="font-size:.82rem;color:var(--text2)"></span>
  <button type="button" class="btn-primary" id="btn-enviar" onclick="Form.submit(event)">
    <i class="fa-solid fa-paper-plane" style="margin-right:6px"></i> Enviar Solicitação
  </button>
</div>

<!-- ─── ABA: MINHAS SOLICITAÇÕES ─────────────────────────────────────────── -->
<div id="tab-minhas" class="tab-pane">
  <div class="list-wrap">
    <div class="list-header">
      <span style="font-size:1rem;font-weight:700">Minhas Solicitações</span>
      <button onclick="List.load()" style="background:none;border:1px solid var(--card-border);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.82rem;color:var(--text2)">
        <i class="fa-solid fa-rotate-right me-1"></i>Atualizar
      </button>
    </div>
    <div id="lista-solicitacoes"><div class="empty-state"><i class="fa-solid fa-inbox"></i><p>Carregando...</p></div></div>
  </div>
</div>

<!-- ─── MODAL DETALHE ────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-detalhe">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-titulo">Solicitação #0</h3>
      <button class="modal-close" onclick="Modal.close()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const API = '/api/suporte';
let _origem = 'desktop';
let _files  = [];

// ── helpers ──────────────────────────────────────────────────────────────────
function token() { return localStorage.getItem('token') || sessionStorage.getItem('token') || ''; }
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function apiFetch(url, opts = {}) {
  const r = await fetch(url, {
    headers: { Authorization: `Bearer ${token()}`, ...(opts.headers || {}) },
    credentials: 'include',
    ...opts,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Erro ${r.status}`);
  return data;
}

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${ok ? 'ok' : 'err'}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3500);
}

function badgeHtml(status) {
  const labels = {
    pendente: 'Pendente', em_analise: 'Em Análise',
    em_desenvolvimento: 'Em Desenvolvimento', concluido: 'Concluído', recusado: 'Recusado',
  };
  return `<span class="badge badge-${status}">${labels[status] || status}</span>`;
}

function tipoHtml(tipo) {
  const icons = { melhoria:'💡', bug:'🐛', duvida:'❓', ideia:'✨' };
  return `<span class="tipo-pill">${icons[tipo] || ''} ${tipo}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

function fmtSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

// ── Tab ──────────────────────────────────────────────────────────────────────
const Tab = {
  show(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    document.getElementById('footer-nova').style.display = name === 'nova' ? 'flex' : 'none';
    if (name === 'minhas') List.load();
  }
};

// ── Form ──────────────────────────────────────────────────────────────────────
const Form = {
  setOrigem(v) {
    _origem = v;
    document.querySelectorAll('.origem-pill').forEach(p => p.classList.toggle('active', p.dataset.origem === v));
  },

  addFiles(newFiles) {
    for (const f of newFiles) {
      if (_files.length >= 10) { toast('Máximo de 10 arquivos por solicitação', false); break; }
      _files.push(f);
    }
    this.renderFiles();
    document.getElementById('f-files').value = '';
  },

  removeFile(idx) {
    _files.splice(idx, 1);
    this.renderFiles();
  },

  renderFiles() {
    const el = document.getElementById('file-list');
    el.innerHTML = _files.map((f, i) => `
      <div class="file-chip">
        <i class="fa-solid ${f.type.startsWith('image') ? 'fa-image' : f.type.startsWith('video') ? 'fa-video' : 'fa-music'}" style="color:var(--accent)"></i>
        <span title="${f.name}">${f.name.length > 22 ? f.name.slice(0,20)+'…' : f.name}</span>
        <span style="opacity:.6">(${fmtSize(f.size)})</span>
        <button onclick="Form.removeFile(${i})" title="Remover"><i class="fa-solid fa-xmark"></i></button>
      </div>`).join('');
  },

  async submit(e) {
    e.preventDefault();
    const titulo   = document.getElementById('f-titulo').value.trim();
    const descricao= document.getElementById('f-descricao').value.trim();
    const tipo     = document.getElementById('f-tipo').value;

    if (!titulo || !descricao) return toast('Preencha título e descrição', false);

    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Enviando...';

    const fd = new FormData();
    fd.append('titulo', titulo);
    fd.append('descricao', descricao);
    fd.append('tipo', tipo);
    fd.append('origem', _origem);
    _files.forEach(f => fd.append('anexos', f));

    const footerStatus = document.getElementById('footer-status');
    footerStatus.textContent = 'Enviando...';

    try {
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `${API}/solicitar`);
        xhr.setRequestHeader('Authorization', `Bearer ${token()}`);
        xhr.upload.onprogress = ev => {
          if (ev.lengthComputable) footerStatus.textContent = `Enviando... ${Math.round(ev.loaded/ev.total*100)}%`;
        };
        xhr.onload = () => {
          const res = JSON.parse(xhr.responseText);
          if (xhr.status >= 200 && xhr.status < 300) resolve(res);
          else reject(new Error(res.error || 'Erro ao enviar'));
        };
        xhr.onerror = () => reject(new Error('Falha na conexão'));
        xhr.send(fd);
      });

      toast('Solicitação enviada com sucesso!');
      document.getElementById('form-solicitacao').reset();
      _files = [];
      Form.renderFiles();
      Form.setOrigem('desktop');
      footerStatus.textContent = '';
      setTimeout(() => Tab.show('minhas'), 1200);
    } catch (err) {
      toast(err.message, false);
      footerStatus.textContent = '';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right:6px"></i> Enviar Solicitação';
    }
  }
};

// ── List ──────────────────────────────────────────────────────────────────────
const List = {
  async load() {
    const el = document.getElementById('lista-solicitacoes');
    el.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Carregando...</p></div>';
    try {
      const rows = await apiFetch(`${API}/minhas`);
      const badge = document.getElementById('badge-total');
      if (rows.length) { badge.style.display='inline'; badge.textContent = rows.length; }
      else badge.style.display = 'none';

      if (!rows.length) {
        el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>Nenhuma solicitação ainda.<br>Clique em "Nova Solicitação" para enviar.</p></div>`;
        return;
      }
      el.innerHTML = rows.map(s => `
        <div class="sol-card" onclick="Modal.open(${s.id})">
          <div class="sol-card-header">
            <span class="sol-titulo">#${s.id} — ${esc(s.titulo)}</span>
            ${badgeHtml(s.status)}
          </div>
          <div class="sol-meta">
            ${tipoHtml(s.tipo)}
            <span><i class="fa-solid fa-${s.origem==='mobile'?'mobile-screen-button':'desktop'}"></i> ${esc(s.origem)}</span>
            <span><i class="fa-solid fa-calendar"></i> ${fmtDate(s.data_criacao)}</span>
            ${s.qtd_anexos > 0 ? `<span><i class="fa-solid fa-paperclip"></i> ${s.qtd_anexos} anexo(s)</span>` : ''}
            ${s.data_atualizacao !== s.data_criacao ? `<span style="color:var(--accent)"><i class="fa-solid fa-rotate-right"></i> Atualizado ${fmtDate(s.data_atualizacao)}</span>` : ''}
          </div>
          ${s.resposta_dev ? `<div class="resposta-box"><i class="fa-solid fa-reply" style="color:var(--accent);margin-right:6px"></i><strong>Resposta do desenvolvedor:</strong><br>${esc(s.resposta_dev)}</div>` : ''}
        </div>`).join('');
    } catch (err) {
      el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-exclamation" style="color:#ef4444"></i><p>${err.message}</p></div>`;
    }
  }
};

// ── Modal ─────────────────────────────────────────────────────────────────────
const Modal = {
  async open(id) {
    const overlay = document.getElementById('modal-detalhe');
    overlay.classList.add('open');
    document.getElementById('modal-titulo').textContent = `Solicitação #${id}`;
    document.getElementById('modal-body').innerHTML = '<div style="text-align:center;padding:32px;color:var(--text2)"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>';

    try {
      const s = await apiFetch(`${API}/${id}`);
      const statusLabels = { pendente:'Pendente', em_analise:'Em Análise', em_desenvolvimento:'Em Desenvolvimento', concluido:'Concluído', recusado:'Recusado' };
      const tipoLabels   = { melhoria:'Melhoria/Ideia', bug:'Bug', duvida:'Dúvida', ideia:'Nova Funcionalidade' };

      let anexosHtml = '';
      if (s.anexos?.length) {
        anexosHtml = `
          <div class="modal-field">
            <label>Anexos</label>
            <div class="anexo-grid">
              ${s.anexos.map(a => {
                if (a.tipo === 'imagem') return `<a href="${esc(a.caminho)}" target="_blank" class="anexo-item" title="${esc(a.nome_original)}"><img src="${esc(a.caminho)}" alt="${esc(a.nome_original)}" onerror="this.style.display='none'"><span style="font-size:.65rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;width:100%">${esc(a.nome_original)}</span></a>`;
                if (a.tipo === 'video') return `<a href="${esc(a.caminho)}" target="_blank" class="anexo-item" title="${esc(a.nome_original)}"><i class="fa-solid fa-video"></i><span>${esc(a.nome_original)}</span></a>`;
                return `<a href="${esc(a.caminho)}" target="_blank" class="anexo-item" title="${esc(a.nome_original)}"><i class="fa-solid fa-music"></i><span>${esc(a.nome_original)}</span></a>`;
              }).join('')}
            </div>
          </div>`;
      }

      document.getElementById('modal-titulo').innerHTML = `Solicitação #${s.id} &nbsp; ${badgeHtml(s.status)}`;
      document.getElementById('modal-body').innerHTML = `
        <div class="modal-field">
          <label>Título</label>
          <p style="font-weight:600">${esc(s.titulo)}</p>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
          ${tipoHtml(s.tipo)}
          <span style="font-size:.78rem;color:var(--text2)"><i class="fa-solid fa-${s.origem==='mobile'?'mobile-screen-button':'desktop'}"></i> ${esc(s.origem)}</span>
          <span style="font-size:.78rem;color:var(--text2)"><i class="fa-solid fa-calendar"></i> ${fmtDate(s.data_criacao)}</span>
        </div>
        <div class="modal-field">
          <label>Descrição</label>
          <p style="background:var(--content-bg);padding:12px;border-radius:8px;border:1px solid var(--card-border);white-space:pre-wrap">${esc(s.descricao)}</p>
        </div>
        ${anexosHtml}
        ${s.resposta_dev ? `
          <div class="modal-field">
            <label><i class="fa-solid fa-reply" style="color:var(--accent);margin-right:4px"></i> Resposta do Desenvolvedor</label>
            <div class="resposta-box" style="margin-top:6px;white-space:pre-wrap">${esc(s.resposta_dev)}</div>
          </div>
        ` : ''}
        ${s.data_atualizacao !== s.data_criacao ? `<p style="font-size:.75rem;color:var(--text2);margin-top:12px"><i class="fa-solid fa-rotate-right"></i> Última atualização: ${fmtDate(s.data_atualizacao)}</p>` : ''}
      `;
    } catch (err) {
      document.getElementById('modal-body').innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-exclamation" style="color:#ef4444"></i><p>${err.message}</p></div>`;
    }
  },
  close() {
    document.getElementById('modal-detalhe').classList.remove('open');
  }
};

// fechar modal clicando fora
document.getElementById('modal-detalhe').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-detalhe')) Modal.close();
});

// drag & drop na zona de upload
const zone = document.querySelector('.upload-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = 'var(--accent)'; });
zone.addEventListener('dragleave', () => { zone.style.borderColor = ''; });
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.style.borderColor = '';
  Form.addFiles(e.dataTransfer.files);
});
</script>
</body>
</html>
