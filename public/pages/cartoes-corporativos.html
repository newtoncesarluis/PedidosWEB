<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cartões Corporativos | SysRepWeb</title>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<script src="/assets/sysrep-api.js"></script>
<style>
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0}
.bar{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:7px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.btn-p{background:var(--accent);color:#fff}.btn-g{background:var(--card);border:1.5px solid var(--border);color:var(--text2)}
.content{padding:14px 16px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;padding:8px 12px;text-align:left;color:var(--text2);border-bottom:1px solid var(--border)}
td{padding:8px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text)}
tr{cursor:pointer}tr:hover{background:var(--accent-soft)}
.form{display:none;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px}
input,select{width:100%;padding:8px;border:1.5px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);box-sizing:border-box}
select option{background:var(--card);color:var(--text)}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}.a{background:#dcfce7;color:#15803d}.i{background:#f3f4f6;color:#6b7280}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 14px;border-radius:8px;background:#111;color:#fff;font-size:13px;display:none;z-index:99}
.confirm-backdrop{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.confirm-box{background:var(--card,#fff);color:var(--text);border:1px solid var(--border,#e5e7eb);border-radius:14px;padding:26px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.18);animation:slideUp .18s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.confirm-box h3{font-size:16px;font-weight:700;margin:0 0 9px;color:var(--text)}
.confirm-box p{font-size:13px;color:var(--text2);line-height:1.5;margin:0}
.confirm-btns{display:flex;gap:10px;justify-content:center;margin-top:18px}
.confirm-btns .btn{min-width:100px}
.btn-ok{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="bar">
  <strong style="margin-right:auto">Cartões Corporativos</strong>
  <button class="btn btn-g" onclick="voltarLista()" id="btnVoltar" style="display:none">← Lista</button>
  <button class="btn btn-p" onclick="novo()">+ Novo cartão</button>
</div>
<div class="content">
  <div class="card" id="lista">
    <table><thead><tr><th>Descrição</th><th>Bandeira</th><th>Final</th><th>Fech.</th><th>Venc.</th><th>Status</th></tr></thead>
    <tbody id="tb"><tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text2)">Carregando…</td></tr></tbody></table>
  </div>
  <div class="card form" id="form">
    <div class="grid">
      <div><label>Descrição *</label><input id="f_desc" autocomplete="off"></div>
      <div><label>Bandeira</label><input id="f_band" autocomplete="off" placeholder="Visa, Master…"></div>
      <div><label>Últimos 4 dígitos</label><input id="f_ult" maxlength="4" autocomplete="off"></div>
      <div><label>Status</label><select id="f_status"><option value="A">Ativo</option><option value="I">Inativo</option></select></div>
      <div><label>Dia fechamento fatura *</label><input type="number" id="f_fech" min="1" max="28" value="1"></div>
      <div><label>Dia vencimento *</label><input type="number" id="f_venc" min="1" max="28" value="10"></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-p" onclick="salvar()">Salvar cartão</button>
      <button class="btn btn-g" onclick="abrirFatura()" id="btnFat" style="display:none">Abrir fatura do mês</button>
      <button class="btn btn-g" onclick="gerarPagar()" id="btnGerar" style="display:none">Gerar no Contas a Pagar</button>
    </div>
    <div id="boxFat" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:12px">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">Fatura <span id="fatComp"></span> · Venc. <span id="fatVenc"></span> · Total R$ <span id="fatTot">0</span></div>
      <div class="grid" style="margin-bottom:8px">
        <div><label>Data compra</label><input type="date" id="l_data"></div>
        <div><label>Valor</label><input type="number" step="0.01" id="l_vlr"></div>
        <div style="grid-column:1/-1"><label>Descrição</label><input id="l_desc" autocomplete="off"></div>
      </div>
      <button class="btn btn-p" onclick="addLanc()">+ Lançamento</button>
      <table style="margin-top:10px"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th></th></tr></thead>
      <tbody id="tbLanc"></tbody></table>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let idAtual=null, faturaAtual=null;
const api=(u,o)=>SysRepApi.fetch(u,o);
function toast(m,ok=true){const t=document.getElementById('toast');t.textContent=m;t.style.background=ok?'#111':'#ef4444';t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
function hoje(){const d=new Date();return d.toISOString().slice(0,10)}
async function carregar(){
  try{
    const d=await api('/api/cartoes');
    const rows=d.cartoes||[];
    document.getElementById('tb').innerHTML=rows.length?rows.map(c=>`<tr onclick="editar(${c.id})">
      <td style="font-weight:700">${c.descricao||''}</td><td>${c.bandeira||'—'}</td><td>${c.ultimos4?('****'+c.ultimos4):'—'}</td>
      <td>dia ${c.dia_fechamento}</td><td>dia ${c.dia_vencimento}</td>
      <td><span class="badge ${c.status==='I'?'i':'a'}">${c.status==='I'?'Inativo':'Ativo'}</span></td></tr>`).join('')
      :'<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text2)">Nenhum cartão</td></tr>';
  }catch(e){toast(e.message,false)}
}
function mostrarForm(s){document.getElementById('lista').style.display=s?'none':'';document.getElementById('form').style.display=s?'block':'none';document.getElementById('btnVoltar').style.display=s?'':'none'}
function voltarLista(){mostrarForm(false);carregar()}
function novo(){idAtual=null;faturaAtual=null;['f_desc','f_band','f_ult'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('f_fech').value=1;document.getElementById('f_venc').value=10;document.getElementById('f_status').value='A';
  document.getElementById('btnFat').style.display='none';document.getElementById('btnGerar').style.display='none';document.getElementById('boxFat').style.display='none';
  mostrarForm(true)}
async function editar(id){
  try{
    const c=await api('/api/cartoes/'+id);idAtual=c.id;
    document.getElementById('f_desc').value=c.descricao||'';document.getElementById('f_band').value=c.bandeira||'';
    document.getElementById('f_ult').value=c.ultimos4||'';document.getElementById('f_fech').value=c.dia_fechamento||1;
    document.getElementById('f_venc').value=c.dia_vencimento||10;document.getElementById('f_status').value=c.status||'A';
    document.getElementById('btnFat').style.display='';document.getElementById('btnGerar').style.display='';
    document.getElementById('boxFat').style.display='none';faturaAtual=null;mostrarForm(true);
  }catch(e){toast(e.message,false)}
}
async function salvar(){
  const body={descricao:document.getElementById('f_desc').value,bandeira:document.getElementById('f_band').value,
    ultimos4:document.getElementById('f_ult').value,dia_fechamento:document.getElementById('f_fech').value,
    dia_vencimento:document.getElementById('f_venc').value,status:document.getElementById('f_status').value};
  try{
    if(idAtual) await api('/api/cartoes/'+idAtual,{method:'PUT',body:JSON.stringify(body)});
    else{const r=await api('/api/cartoes',{method:'POST',body:JSON.stringify(body)});idAtual=r.id;document.getElementById('btnFat').style.display='';document.getElementById('btnGerar').style.display=''}
    toast('Salvo');carregar();
  }catch(e){toast(e.message,false)}
}
async function abrirFatura(){
  if(!idAtual)return;
  try{
    const r=await api('/api/cartoes/'+idAtual+'/faturas',{method:'POST',body:JSON.stringify({})});
    faturaAtual=r.fatura;document.getElementById('fatComp').textContent=faturaAtual.competencia;
    document.getElementById('fatVenc').textContent=String(faturaAtual.data_vencimento).slice(0,10);
    document.getElementById('fatTot').textContent=(parseFloat(faturaAtual.valor_total)||0).toFixed(2);
    document.getElementById('l_data').value=hoje();document.getElementById('boxFat').style.display='block';
    await loadLanc();
  }catch(e){toast(e.message,false)}
}
async function loadLanc(){
  if(!faturaAtual)return;
  const d=await api(`/api/cartoes/${idAtual}/faturas/${faturaAtual.id}/lancamentos`);
  const rows=d.lancamentos||[];
  document.getElementById('tbLanc').innerHTML=rows.map(l=>`<tr>
    <td>${String(l.data_compra).slice(0,10)}</td><td>${l.descricao}</td><td>R$ ${parseFloat(l.valor).toFixed(2)}</td>
    <td><button class="btn btn-g" onclick="delLanc(${l.id})">Excluir</button></td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--text2)">Sem lançamentos</td></tr>';
}
async function addLanc(){
  if(!faturaAtual)return;
  try{
    await api(`/api/cartoes/${idAtual}/faturas/${faturaAtual.id}/lancamentos`,{method:'POST',body:JSON.stringify({
      data_compra:document.getElementById('l_data').value,descricao:document.getElementById('l_desc').value,valor:document.getElementById('l_vlr').value})});
    document.getElementById('l_desc').value='';document.getElementById('l_vlr').value='';
    await abrirFatura();toast('Lançamento ok');
  }catch(e){toast(e.message,false)}
}
async function delLanc(lid){
  try{await api(`/api/cartoes/${idAtual}/faturas/${faturaAtual.id}/lancamentos/${lid}`,{method:'DELETE'});await abrirFatura()}catch(e){toast(e.message,false)}
}
async function gerarPagar(){
  if(!idAtual)return;
  if(!faturaAtual) await abrirFatura();
  if(!faturaAtual)return;
  const tot = (parseFloat(faturaAtual.valor_total)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const comp = faturaAtual.competencia || '';
  const venc = String(faturaAtual.data_vencimento||'').slice(0,10);
  confirmar(
    'Gerar no Contas a Pagar?',
    `Será criado um título aberto com o valor desta fatura (${comp || 'mês atual'}${venc ? ' · venc. '+venc : ''} · ${tot}).`,
    async () => {
      try{
        const r=await api(`/api/cartoes/${idAtual}/faturas/${faturaAtual.id}/gerar-pagar`,{method:'POST',body:'{}'});
        toast('Título gerado: '+r.doc);await abrirFatura();
      }catch(e){toast(e.message,false)}
    }
  );
}
function confirmar(titulo, msg, onOk){
  const bd=document.createElement('div');
  bd.className='confirm-backdrop';
  bd.innerHTML=`<div class="confirm-box" role="dialog" aria-modal="true">
    <h3>${titulo}</h3>
    <p>${msg}</p>
    <div class="confirm-btns">
      <button type="button" class="btn btn-g" id="_no">Cancelar</button>
      <button type="button" class="btn btn-ok" id="_ok">Confirmar</button>
    </div>
  </div>`;
  document.body.appendChild(bd);
  bd.querySelector('#_no').onclick=()=>bd.remove();
  bd.querySelector('#_ok').onclick=()=>{bd.remove();onOk&&onOk();};
  bd.onclick=e=>{if(e.target===bd)bd.remove();};
  bd.querySelector('#_ok').focus();
}
carregar();
</script>
</body>
</html>
