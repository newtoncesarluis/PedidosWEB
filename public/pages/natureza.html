<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Natureza de Operação | SysRepWeb</title>
<style>
* { margin:0;padding:0;box-sizing:border-box; }
:root {
  --bg:#f0f2f5; --card:#fff; --border:#e5e7eb;
  --text:#111827; --text2:#6b7280;
  --accent:var(--accent); --accent-hover:var(--accent-hover);
  --danger:#ef4444; --warn:#f59e0b; --success:#22c55e;
}
body { font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh; }

.toolbar-bar {
  background:#fff;border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;
}
.btn {
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
  border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;
  transition:.15s;font-family:inherit;white-space:nowrap;
}
.btn svg { width:14px;height:14px;flex-shrink:0; }
.btn:disabled { opacity:.5;cursor:not-allowed; }
.btn-primary { background:var(--accent);color:#fff;border:1.5px solid var(--accent); }
.btn-primary:hover:not(:disabled) { background:var(--accent-hover); }
.btn-outline { background:#fff;color:var(--accent);border:1.5px solid var(--accent); }
.btn-outline:hover { background:var(--accent-soft); }
.btn-ghost   { background:#fff;color:var(--text2);border:1.5px solid var(--border); }
.btn-ghost:hover { background:#f9fafb;color:var(--text); }
.btn-save { background:var(--accent);color:#fff;border:1.5px solid var(--accent);font-size:13px;padding:8px 18px; }
.btn-save:hover:not(:disabled) { background:var(--accent-hover); }

.ins-card { display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:4px 9px;border-radius:7px;border:1.5px solid var(--border);background:#fafafa;transition:.15s;user-select:none;flex-shrink:0;white-space:nowrap; }
.ins-card:hover { border-color:var(--accent);background:var(--accent-soft); }
.ins-card.active { border-color:var(--accent);background:var(--accent);color:#fff; }
.ins-card.active .ins-label,.ins-card.active .ins-val { color:#fff; }
.ins-label { font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2); }
.ins-val   { font-size:12px;font-weight:800;color:var(--text);line-height:1; }

.subbar { background:#f9fafb;border-bottom:1px solid var(--border);padding:5px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;z-index:99; }
.icon-btn { display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1.5px solid var(--border);border-radius:7px;background:#fff;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap; }
.icon-btn svg { width:13px;height:13px;flex-shrink:0; }
.icon-btn:hover { background:var(--accent-soft);color:var(--accent);border-color:var(--accent); }

.content-area { padding:14px 16px; }

.table-card { background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden; }
.table-wrap { overflow-x:auto; }
table { width:100%;border-collapse:collapse; }
thead th { background:#f9fafb;padding:7px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap; }
tbody tr { transition:background .1s;cursor:pointer; }
tbody tr:hover { background:var(--accent-soft); }
tbody td { padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px; }
tbody tr:last-child td { border-bottom:none; }

.badge { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap; }
.badge::before { content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0; }
.badge-A { background:#dcfce7;color:#15803d; }
.badge-A::before { background:#22c55e; }
.badge-I { background:#f3f4f6;color:#6b7280; }
.badge-I::before { background:#9ca3af; }
.badge-tipo { background:#eff6ff;color:#1d4ed8;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600; }

.bool-yes { color:#22c55e;font-size:14px; }
.bool-no  { color:#d1d5db;font-size:14px; }

.btn-acoes { background:#f3f4f6;color:var(--text2);border:1px solid var(--border);padding:4px 7px;border-radius:6px;cursor:pointer; }
.btn-acoes:hover { background:#e5e7eb;color:var(--text); }
.btn-acoes svg { width:16px;height:16px; }
.dropdown-menu { position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:6500;min-width:160px;animation:fadeIn .12s ease;padding:4px; }
.dropdown-item { display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--text);transition:.1s;border:none;background:none;width:100%;font-family:inherit;text-align:left;font-weight:500; }
.dropdown-item:hover { background:var(--accent-soft);color:var(--accent); }
.dropdown-item.danger { color:var(--danger); }
.dropdown-item.danger:hover { background:#fef2f2; }

.empty { text-align:center;padding:56px 24px;color:var(--text2); }

#formSection { display:none; }
.form-card { background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden; }
.form-card-head { padding:12px 18px;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:space-between; }
.form-card-head-title { font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px; }
.form-card-head-sub   { font-size:11px;color:var(--text2);margin-top:2px; }
.form-body { padding:20px 18px; }
.form-footer { padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:#f9fafb; }

.form-grid { display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px; }
@media(max-width:700px) { .form-grid { grid-template-columns:1fr; } }
.form-group { display:flex;flex-direction:column;gap:4px; }
.form-group.full { grid-column:1/-1; }
label { font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.3px; }
.req { color:var(--danger); }
input[type="text"], select {
  padding:8px 10px;border:1.5px solid #d1d5db;border-radius:6px;
  font-size:13px;color:var(--text);background:#fff;
  transition:.12s;outline:none;font-family:inherit;width:100%;
}
input:focus,select:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.08); }

.toggle-row { display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:6px;cursor:pointer;user-select:none; }
.toggle-row:hover { border-color:var(--accent); }
.toggle-switch { width:36px;height:20px;border-radius:10px;background:#d1d5db;position:relative;flex-shrink:0;transition:.2s; }
.toggle-switch.on { background:var(--accent); }
.toggle-switch::after { content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2); }
.toggle-switch.on::after { left:19px; }
.toggle-label { font-size:12px;font-weight:600;color:var(--text); }
.toggle-sub { font-size:11px;color:var(--text2); }

#toast-container { position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none; }
.toast { display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.14);animation:toastIn .22s ease-out;pointer-events:auto; }
@keyframes toastIn { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)} }
.toast-ok   { background:#1a1a2e;color:#fff; }
.toast-err  { background:#ef4444;color:#fff; }
.toast-warn { background:#f59e0b;color:#fff; }

@keyframes fadeIn { from{opacity:0}to{opacity:1} }
</style>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<link rel="stylesheet" href="/assets/card-view.css">
<script src="/assets/card-view.js"></script>
</head>
<body>

<div class="toolbar-bar">
  <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
    <div class="ins-card active" id="ins-total" onclick="toggleFiltroStatus('T')">
      <span class="ins-label">Total</span><span class="ins-val" id="val-total">—</span>
    </div>
    <div class="ins-card" id="ins-ativos" onclick="toggleFiltroStatus('A')">
      <span class="ins-label">Ativos</span><span class="ins-val" id="val-ativos">—</span>
    </div>
    <div class="ins-card" id="ins-inativos" onclick="toggleFiltroStatus('I')">
      <span class="ins-label">Inativos</span><span class="ins-val" id="val-inativos">—</span>
    </div>
  </div>
  <button class="btn btn-outline" onclick="abrirNovo()">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
    Nova Natureza
  </button>
</div>

<div class="subbar">
  <div style="display:flex;gap:6px;align-items:center">
    <button class="icon-btn" onclick="buscar()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Atualizar
    </button>
  </div>
  <div style="display:flex;align-items:center;gap:5px">
    <input type="text" id="inputBusca" placeholder="Buscar natureza de operação…" oninput="buscar()"
           style="padding:5px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;width:280px;outline:none;">
    <button class="icon-btn" onclick="buscar()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </button>
  </div>
</div>

<div class="content-area">
  <div id="listSection">
    <div class="table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:50px">ID</th>
              <th>Descrição</th>
              <th>Tipo</th>
              <th>Plano de Contas</th>
              <th style="text-align:center">Mov. Estoque</th>
              <th>Status</th>
              <th style="width:60px"></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7" class="empty">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="formSection">
    <div class="form-card">
      <div class="form-card-head">
        <div>
          <div class="form-card-head-title">Natureza de Operação</div>
          <div class="form-card-head-sub" id="formTitle">Nova Natureza</div>
        </div>
      </div>
      <div class="form-body">
        <form id="mainForm" onsubmit="return false">
          <input type="hidden" id="f_id">
          <div class="form-grid">
            <div class="form-group full">
              <label>Descrição <span class="req">*</span></label>
              <input type="text" id="f_descricao" placeholder="Ex: Venda de Mercadoria" required>
            </div>
            <div class="form-group">
              <label>Tipo</label>
              <select id="f_tipo">
                <option value="">— Selecione —</option>
                <option value="ENTRADA">ENTRADA</option>
                <option value="SAIDA">SAÍDA</option>
                <option value="OUTROS">OUTROS</option>
              </select>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="f_status">
                <option value="A">Ativo</option>
                <option value="I">Inativo</option>
              </select>
            </div>
            <div class="form-group">
              <label>Movimenta Estoque</label>
              <div class="toggle-row" onclick="toggleEstoque()">
                <div class="toggle-switch" id="toggleEst"></div>
                <div>
                  <div class="toggle-label" id="toggleEstLabel">Não movimenta</div>
                  <div class="toggle-sub">Clique para alternar</div>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label>Plano de Contas</label>
              <select id="f_id_planoconta">
                <option value="">Nenhum</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="form-footer">
        <button class="btn btn-ghost" onclick="voltarLista()">Cancelar</button>
        <button class="btn btn-save" onclick="salvar()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<div class="dropdown-menu" id="dropMenu" style="display:none"></div>

<script>
let S = { filtroStatus: 'T', registroId: null, dados: [], movEstoque: false };

function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  try {
    const t = localStorage.getItem('token') || sessionStorage.getItem('token');
    if (t) h.Authorization = 'Bearer ' + t;
  } catch (_) {}
  return h;
}

function toggleEstoque() {
  S.movEstoque = !S.movEstoque;
  document.getElementById('toggleEst').classList.toggle('on', S.movEstoque);
  document.getElementById('toggleEstLabel').textContent = S.movEstoque ? 'Movimenta estoque' : 'Não movimenta';
}

function setEstoque(val) {
  S.movEstoque = val === 'S';
  document.getElementById('toggleEst').classList.toggle('on', S.movEstoque);
  document.getElementById('toggleEstLabel').textContent = S.movEstoque ? 'Movimenta estoque' : 'Não movimenta';
}

async function buscar() {
  const q = document.getElementById('inputBusca').value.trim().toLowerCase();
  try {
    const r = await fetch('/api/natureza', { headers: authHeaders(), credentials: 'include', cache: 'no-store' });
    const d = await r.json();
    S.dados = d.natureza || [];
    let lista = S.dados;
    if (S.filtroStatus !== 'T') lista = lista.filter(x => x.status === S.filtroStatus);
    if (q) lista = lista.filter(x => (x.descricao||'').toLowerCase().includes(q));
    document.getElementById('val-total').textContent = S.dados.length;
    document.getElementById('val-ativos').textContent = S.dados.filter(x=>x.status==='A').length;
    document.getElementById('val-inativos').textContent = S.dados.filter(x=>x.status!=='A').length;
    renderLista(lista);
  } catch(e) { toast('Erro ao carregar','err'); }
}

function renderLista(rows) {
  const tbody = document.getElementById('tbody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">Nenhum registro encontrado</td></tr>'; return; }
  tbody.innerHTML = rows.map(f => `
    <tr onclick="abrirEditar(${f.id})">
      <td>${f.id}</td>
      <td style="font-weight:600">${f.descricao}</td>
      <td>${f.tipo ? `<span class="badge-tipo">${f.tipo}</span>` : '—'}</td>
      <td>${f.planoconta_nome ? `${f.planoconta_numero ? f.planoconta_numero + ' — ' : ''}${f.planoconta_nome}` : '<span style="color:#94a3b8">Não vinculado</span>'}</td>
      <td style="text-align:center">${f.movimenta_estoque==='S' ? '<span class="bool-yes">✓</span>' : '<span class="bool-no">—</span>'}</td>
      <td><span class="badge badge-${f.status==='A'?'A':'I'}">${f.status==='A'?'Ativo':'Inativo'}</span></td>
      <td onclick="event.stopPropagation()">
        <button class="btn-acoes" onclick="abrirDrop(event,${f.id})">⋮</button>
      </td>
    </tr>
  `).join('');
}

async function loadPlanoContas() {
  try {
    const r = await fetch('/api/plano-contas?analiticas=1', { headers: authHeaders(), credentials: 'include' });
    const d = await r.json();
    const sel = document.getElementById('f_id_planoconta');
    if (!sel) return;
    sel.innerHTML = '<option value="">Nenhum</option>' + (d.plano_contas || []).map(p =>
      `<option value="${p.id}">${p.numero ? p.numero + ' — ' : ''}${p.descricao}</option>`
    ).join('');
  } catch (_) {}
}

function toggleFiltroStatus(st) {
  S.filtroStatus = st;
  ['total','ativos','inativos'].forEach(k => {
    document.getElementById('ins-'+k).classList.toggle('active',
      (st==='T'&&k==='total')||(st==='A'&&k==='ativos')||(st==='I'&&k==='inativos'));
  });
  buscar();
}

function abrirNovo() {
  if (!guardCadIncluir('Sem permissão para incluir naturezas')) return;
  S.registroId = null;
  document.getElementById('f_id').value = '';
  document.getElementById('f_descricao').value = '';
  document.getElementById('f_tipo').value = '';
  document.getElementById('f_status').value = 'A';
  document.getElementById('f_id_planoconta').value = '';
  setEstoque('N');
  document.getElementById('formTitle').textContent = 'Nova Natureza de Operação';
  document.getElementById('listSection').style.display = 'none';
  document.getElementById('formSection').style.display = 'block';
}

function abrirEditar(id) {
  const f = S.dados.find(x => x.id === id);
  if (!f) return;
  S.registroId = id;
  document.getElementById('f_id').value = f.id;
  document.getElementById('f_descricao').value = f.descricao;
  document.getElementById('f_tipo').value = f.tipo || '';
  document.getElementById('f_status').value = f.status || 'A';
  document.getElementById('f_id_planoconta').value = f.id_planoconta || '';
  setEstoque(f.movimenta_estoque);
  document.getElementById('formTitle').textContent = 'Editar: ' + f.descricao;
  document.getElementById('listSection').style.display = 'none';
  document.getElementById('formSection').style.display = 'block';
  if (!podeAlterarCad()) aplicarFormSomenteLeituraCad();
}

function voltarLista() {
  document.getElementById('formSection').style.display = 'none';
  document.getElementById('listSection').style.display = 'block';
  buscar();
}

async function salvar() {
  if (!guardCadSalvar(!!S.registroId, 'Sem permissão para incluir naturezas', 'Sem permissão para alterar naturezas')) return;
  const payload = {
    descricao: document.getElementById('f_descricao').value.trim(),
    tipo: document.getElementById('f_tipo').value,
    movimenta_estoque: S.movEstoque ? 'S' : 'N',
    status: document.getElementById('f_status').value,
    id_planoconta: document.getElementById('f_id_planoconta').value || null
  };
  if (!payload.descricao) return toast('Preencha a descrição','warn');
  try {
    const id = S.registroId;
    const r = await fetch(id ? `/api/natureza/${id}` : '/api/natureza', {
      method: id ? 'PUT' : 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      credentials: 'include',
      body: JSON.stringify(payload)
    });
    if (r.ok) { toast('Salvo com sucesso!','ok'); voltarLista(); }
    else { const d = await r.json(); toast(d.error||'Erro ao salvar','err'); }
  } catch(e) { toast('Erro na comunicação','err'); }
}

function abrirDrop(e, id) {
  e.stopPropagation();
  const m = document.getElementById('dropMenu');
  m.innerHTML = podeExcluirCad() ? `<button class="dropdown-item danger" onclick="excluir(${id})">Excluir</button>` : '';
  if (!m.innerHTML.trim()) return;
  m.style.display = 'block';
  const rect = e.currentTarget.getBoundingClientRect();
  m.style.top = (rect.bottom + 5) + 'px';
  m.style.left = (rect.left - 120) + 'px';
  window.onclick = () => { m.style.display='none'; };
}

async function excluir(id) {
  if (!guardCadExcluir('Sem permissão para excluir naturezas')) return;
  if (!confirm('Excluir esta natureza de operação?')) return;
  try {
    const r = await fetch(`/api/natureza/${id}`, { method: 'DELETE', headers: authHeaders(), credentials: 'include' });
    if (r.ok) { toast('Excluído!','ok'); buscar(); }
  } catch(e) { toast('Erro ao excluir','err'); }
}

function toast(msg, tipo='ok') {
  const t = document.createElement('div');
  t.className = `toast toast-${tipo}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

document.addEventListener('cad-perm-ready', () => {
  loadPlanoContas();
  if (typeof aplicarUiPermissoesCad === 'function') aplicarUiPermissoesCad();
});

CardView.attach({
  toolbar:   '.toolbar-bar',
  tableWrap: '.table-wrap',
  container: '.table-card',
  wrap:      'renderLista',
  card: (f) => ({
    title:    f.descricao,
    subtitle: f.tipo || null,
    avatar:   f.descricao,
    badge:    f.status === 'A' ? { label:'Ativo', tone:'success' } : { label:'Inativo', tone:'neutral' },
    rows: [
      f.movimenta_estoque === 'S' ? { icon:'check', text:'Movimenta estoque' } : null
    ].filter(Boolean),
    onClick: () => abrirEditar(f.id),
    actions: [{ label:'Editar', icon:'edit', onClick: () => abrirEditar(f.id) }]
  })
});

buscar();
</script>
<script src="/assets/cadastros-permissao.js"></script>
</body>
</html>
