<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natureza de Operação | Administrativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/index.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --success-color: #2ec4b6;
      --bg-light: #f8f9fa;
    }
    body { background-color: var(--bg-light); font-family: 'Inter', sans-serif; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .btn-primary { background-color: var(--primary-color); border: none; padding: 10px 20px; border-radius: 8px; }
    .btn-success { background-color: var(--success-color); border: none; }
    .badge-active { background-color: rgba(46, 196, 182, 0.1); color: var(--success-color); border: 1px solid var(--success-color); }
    .badge-inactive { background-color: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid #e74c3c; }
    .action-btn { cursor: pointer; transition: transform 0.2s; }
    .action-btn:hover { transform: scale(1.1); }
    .form-check-input:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
  </style>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
</head>
<body>
  <div class="container-fluid py-4">
    <div class="row mb-4 align-items-center">
      <div class="col-6">
        <h1 class="h3 mb-0 text-gray-800 fw-bold">Natureza de Operação</h1>
        <p class="text-muted mb-0">Gerencie os tipos de operações fiscais e de estoque do sistema.</p>
      </div>
      <div class="col-6 text-end">
        <button id="btnNovo" class="btn btn-primary shadow-sm" style="display:none;">
          <i class="bi bi-plus-lg me-2"></i> Nova Natureza
        </button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="table-responsive">
          <table id="tabelaNatureza" class="table table-hover align-middle" style="width:100%">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Tipo</th>
                <th class="text-center">Mov. Estoque</th>
                <th>Status</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Cadastro -->
  <div class="modal fade" id="modalNatureza" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-light p-4">
          <h5 class="modal-title fw-bold" id="modalTitulo">Nova Natureza de Operação</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formNatureza">
          <div class="modal-body p-4">
            <input type="hidden" id="idNatureza">
            
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Descrição <span class="text-danger">*</span></label>
                <input type="text" id="descricao" class="form-control" required placeholder="Ex: Venda de Mercadoria">
              </div>
              
              <div class="col-md-6">
                <label class="form-label fw-semibold">Tipo</label>
                <select id="tipo" class="form-select">
                  <option value="ENTRADA">ENTRADA</option>
                  <option value="SAIDA">SAÍDA</option>
                  <option value="OUTROS">OUTROS</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Status</label>
                <select id="status" class="form-select">
                  <option value="A">ATIVO</option>
                  <option value="I">INATIVO</option>
                </select>
              </div>

              <div class="col-12">
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="movimenta_estoque">
                  <label class="form-check-label fw-semibold" for="movimenta_estoque">Movimentar Estoque</label>
                  <div class="form-text">Ative se esta operação deve impactar o saldo de estoque.</div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer bg-light p-3">
            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 shadow-sm">Salvar Registro</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    let tabela;
    let permissoes = {};

    $(document).ready(async function() {
      await carregarPermissoes();
      inicializarTabela();
      
      $('#btnNovo').click(() => {
        $('#formNatureza')[0].reset();
        $('#idNatureza').val('');
        $('#modalTitulo').text('Nova Natureza de Operação');
        new bootstrap.Modal('#modalNatureza').show();
      });

      $('#formNatureza').submit(salvarNatureza);
    });

    async function carregarPermissoes() {
      try {
        const res = await fetch('/api/check-permissions?modulo=natureza');
        permissoes = await res.json();
        if (permissoes.incluir === 'S') $('#btnNovo').show();
      } catch (err) { console.error('Erro ao carregar permissões', err); }
    }

    function inicializarTabela() {
      tabela = $('#tabelaNatureza').DataTable({
        ajax: { url: '/api/natureza', dataSrc: 'natureza' },
        columns: [
          { data: 'id' },
          { data: 'descricao' },
          { data: 'tipo', render: v => `<span class="badge bg-light text-dark border">${v || 'N/A'}</span>` },
          { 
            data: 'movimenta_estoque', 
            className: 'text-center',
            render: v => v === 'S' 
              ? '<i class="bi bi-check-circle-fill text-success fs-5"></i>' 
              : '<i class="bi bi-x-circle text-muted fs-5"></i>' 
          },
          { data: 'status', render: v => `<span class="badge ${v === 'A' ? 'badge-active' : 'badge-inactive'}">${v === 'A' ? 'ATIVO' : 'INATIVO'}</span>` },
          { 
            data: null, 
            className: 'text-center',
            render: row => {
              let btns = '';
              if (permissoes.alterar === 'S') {
                btns += `<i class="bi bi-pencil-square text-primary action-btn me-3" onclick="editarNatureza(${row.id})" title="Editar"></i>`;
              }
              if (permissoes.excluir === 'S') {
                btns += `<i class="bi bi-trash text-danger action-btn" onclick="excluirNatureza(${row.id})" title="Excluir"></i>`;
              }
              return btns || '<span class="text-muted">-</span>';
            }
          }
        ],
        language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json' },
        order: [[1, 'asc']]
      });
    }

    async function salvarNatureza(e) {
      e.preventDefault();
      const id = $('#idNatureza').val();
      const dados = {
        descricao: $('#descricao').val(),
        tipo: $('#tipo').val(),
        movimenta_estoque: $('#movimenta_estoque').is(':checked') ? 'S' : 'N',
        status: $('#status').val()
      };

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/natureza/${id}` : '/api/natureza';
        
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        if (res.ok) {
          bootstrap.Modal.getInstance('#modalNatureza').hide();
          tabela.ajax.reload();
          Swal.fire('Sucesso!', `Natureza de operação ${id ? 'atualizada' : 'cadastrada'} com sucesso.`, 'success');
        }
      } catch (err) { Swal.fire('Erro', 'Não foi possível salvar os dados.', 'error'); }
    }

    async function editarNatureza(id) {
      const nat = tabela.rows().data().toArray().find(n => n.id === id);
      if (nat) {
        $('#idNatureza').val(nat.id);
        $('#descricao').val(nat.descricao);
        $('#tipo').val(nat.tipo);
        $('#movimenta_estoque').prop('checked', nat.movimenta_estoque === 'S');
        $('#status').val(nat.status);
        $('#modalTitulo').text('Editar Natureza de Operação');
        new bootstrap.Modal('#modalNatureza').show();
      }
    }

    function excluirNatureza(id) {
      Swal.fire({
        title: 'Tem certeza?',
        text: "Este registro será marcado como excluído!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
      }).then(async (result) => {
        if (result.isConfirmed) {
          const res = await fetch(`/api/natureza/${id}`, { method: 'DELETE' });
          if (res.ok) {
            tabela.ajax.reload();
            Swal.fire('Excluído!', 'O registro foi removido.', 'success');
          }
        }
      });
    }
  </script>
</body>
</html>
