<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marca da instalação — SysRepWeb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f5f7; --card:#fff; --border:#e8eaed; --text:#1e2433; --text2:#6b7280;
    --accent:#4361ee; --danger:#ef4444;
  }
  * { margin:0; box-sizing:border-box; }
  body {
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px;
  }
  .page-header { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .page-icon {
    width:44px; height:44px; border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#4361ee);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(124,58,237,.35);
  }
  .page-icon svg { width:24px; height:24px; color:#fff; }
  .page-title h1 { font-size:20px; font-weight:700; }
  .page-title p { font-size:13px; color:var(--text2); margin-top:4px; max-width:560px; line-height:1.45; }

  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    max-width:720px;
    box-shadow:0 1px 4px rgba(0,0,0,.04);
  }
  .hint { font-size:12px; color:var(--text2); margin-bottom:18px; line-height:1.5; }

  .logo-row { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .preview {
    width:200px; min-height:100px; border:1.5px dashed var(--border); border-radius:12px;
    display:flex; align-items:center; justify-content:center; background:#fafbfc;
  }
  .preview img { max-width:180px; max-height:88px; object-fit:contain; display:none; }
  .preview img.show { display:block; }
  .preview .ph { font-size:12px; color:var(--text2); }

  .form-group { margin-bottom:14px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; }
  input[type="text"], select {
    width:100%; max-width:420px;
    padding:9px 11px; border:1.5px solid var(--border); border-radius:8px;
    font-size:13px; font-family:inherit;
  }
  input:focus, select:focus { outline:none; border-color:var(--accent); }

  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:center; }
  .btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 18px; border:none; border-radius:10px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:disabled { opacity:.55; cursor:not-allowed; }
  .btn-ghost { background:var(--border); color:var(--text2); }
  .btn-danger { background:var(--danger); color:#fff; }

  input[type="file"] { font-size:12px; max-width:100%; }
  .msg { margin-top:14px; font-size:13px; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:#16a34a; }
</style>
</head>
<body>
<div class="page-header">
  <div class="page-icon" aria-hidden="true">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
  </div>
  <div class="page-title">
    <h1>Marca da instalação</h1>
    <p>Logo e fonte padrão quando a empresa não tiver logo cadastrada (login, pedidos em PDF/impressão, contas). A logo da empresa continua tendo prioridade.</p>
  </div>
</div>

<div class="card">
  <p class="hint">Arquivos ficam em <code>public/uploads/parametro_locais/</code>. PNG, JPG, GIF, WebP ou SVG · até 5 MB.</p>

  <div class="logo-row">
    <div class="preview" id="wrap_prev">
      <span class="ph" id="ph_prev">Sem logo</span>
      <img id="img_prev" alt="">
    </div>
    <div style="flex:1; min-width:220px">
      <div class="form-group">
        <label for="f_file">Enviar imagem</label>
        <input type="file" id="f_file" accept="image/jpeg,image/png,image/gif,image/webp,image/svg+xml" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="f_tam">Tamanho da logo (relatórios)</label>
        <select id="f_tam" autocomplete="off">
          <option value="P">Pequeno</option>
          <option value="M" selected>Médio</option>
          <option value="G">Grande</option>
        </select>
      </div>
      <div class="form-group">
        <label for="f_fonte">Fonte padrão (CSS)</label>
        <input type="text" id="f_fonte" placeholder='Ex.: &quot;Segoe UI&quot;, Roboto' autocomplete="off" maxlength="200">
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn_salvar">Salvar texto</button>
        <button type="button" class="btn btn-danger" id="btn_remover">Remover logo</button>
      </div>
    </div>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
const token = sessionStorage.getItem('token') || localStorage.getItem('token');
if (!token) {
  (window.top || window).location.href = '/login.html';
}

function absUrl(p) {
  if (!p || !String(p).trim()) return '';
  const u = String(p).trim();
  if (/^https?:\/\//i.test(u)) return u;
  return window.location.origin + (u.startsWith('/') ? u : '/' + u);
}

function setPreview(pathOrNull) {
  const img = document.getElementById('img_prev');
  const ph = document.getElementById('ph_prev');
  if (pathOrNull) {
    img.src = absUrl(pathOrNull);
    img.classList.add('show');
    ph.style.display = 'none';
  } else {
    img.removeAttribute('src');
    img.classList.remove('show');
    ph.style.display = '';
  }
}

function showMsg(text, isErr) {
  const el = document.getElementById('msg');
  el.textContent = text || '';
  el.className = 'msg' + (isErr ? ' err' : text ? ' ok' : '');
}

async function carregar() {
  showMsg('');
  try {
    const r = await fetch('/api/parametro-locais', { headers: { Authorization: 'Bearer ' + token } });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    setPreview(d.logo_relatorio || null);
    document.getElementById('f_tam').value = String(d.logo_tamanho_relatorio || 'M').toUpperCase().slice(0, 1) || 'M';
    document.getElementById('f_fonte').value = d.fonte_padrao || '';
  } catch (e) {
    showMsg('Erro ao carregar: ' + e.message, true);
  }
}

async function salvarTexto() {
  showMsg('');
  const btn = document.getElementById('btn_salvar');
  btn.disabled = true;
  try {
    const body = {
      logo_tamanho_relatorio: document.getElementById('f_tam').value,
      fonte_padrao: document.getElementById('f_fonte').value.trim() || null
    };
    const r = await fetch('/api/parametro-locais', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    try {
      sessionStorage.setItem('parametros_locais', JSON.stringify({
        logo_relatorio: d.logo_relatorio,
        logo_tamanho_relatorio: d.logo_tamanho_relatorio,
        fonte_padrao: d.fonte_padrao
      }));
    } catch (_) {}
    showMsg('Salvo.');
    setPreview(d.logo_relatorio || null);
  } catch (e) {
    showMsg(e.message, true);
  }
  btn.disabled = false;
}

document.getElementById('btn_salvar').addEventListener('click', salvarTexto);

document.getElementById('f_file').addEventListener('change', async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  showMsg('');
  const fd = new FormData();
  fd.append('logo', f);
  try {
    const r = await fetch('/api/parametro-locais/logo', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token },
      body: fd
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    setPreview(d.logo_relatorio);
    try {
      const cur = JSON.parse(sessionStorage.getItem('parametros_locais') || '{}');
      cur.logo_relatorio = d.logo_relatorio;
      sessionStorage.setItem('parametros_locais', JSON.stringify(cur));
    } catch (_) {
      sessionStorage.setItem('parametros_locais', JSON.stringify({ logo_relatorio: d.logo_relatorio }));
    }
    showMsg('Logo enviada.');
    await carregar();
  } catch (e) {
    showMsg(e.message, true);
  }
});

document.getElementById('btn_remover').addEventListener('click', async () => {
  if (!confirm('Remover a logo padrão da instalação?')) return;
  showMsg('');
  try {
    const r = await fetch('/api/parametro-locais/logo', { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.statusText);
    setPreview(null);
    try {
      const cur = JSON.parse(sessionStorage.getItem('parametros_locais') || '{}');
      cur.logo_relatorio = null;
      sessionStorage.setItem('parametros_locais', JSON.stringify(cur));
    } catch (_) {}
    showMsg('Logo removida.');
    await carregar();
  } catch (e) {
    showMsg(e.message, true);
  }
});

carregar();
</script>
</body>
</html>
