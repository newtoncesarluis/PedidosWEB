<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Catálogo — Apresentação</title>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<style>
  :root {
    --cat-blue: #0c4a8a;
    --cat-blue-light: #e0f2fe;
    --cat-blue-mid: #0284c7;
    --cat-bg: #f0f7ff;
    --cat-card: var(--card, #fff);
    --cat-text: var(--content-text, #0f172a);
    --cat-muted: var(--text2, #64748b);
    --cat-border: var(--card-border, #cbd5e1);
    --cat-shadow: 0 8px 32px rgba(12, 74, 138, .12);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="dark"], html[data-theme="charcoal"] {
    --cat-bg: var(--content-bg, #0f172a);
    --cat-blue-light: rgba(14, 165, 233, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font, system-ui, -apple-system, Segoe UI, sans-serif);
    background: var(--cat-bg);
    color: var(--cat-text);
    -webkit-tap-highlight-color: transparent;
  }
  .hidden { display: none !important; }

  /* ── Capa / índice ── */
  .cover {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(20px + var(--safe-top)) 20px calc(24px + var(--safe-bot));
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(14,165,233,.25), transparent),
      linear-gradient(165deg, #0c4a8a 0%, #0369a1 45%, #0ea5e9 100%);
    color: #fff;
  }
  .cover-brand {
    display: flex; align-items: center; gap: 10px; margin-bottom: auto;
    font-size: 13px; font-weight: 700; opacity: .9;
  }
  .cover-brand img { width: 28px; height: 28px; border-radius: 6px; }
  .cover-main { margin: auto 0; text-align: center; padding: 24px 0; }
  .cover-main h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.1;
  }
  .cover-main p { margin: 0; font-size: 15px; opacity: .88; max-width: 420px; margin-inline: auto; }
  .cover-list { margin-top: 32px; display: flex; flex-direction: column; gap: 10px; max-width: 480px; width: 100%; margin-inline: auto; }
  .cover-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(8px);
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    transition: transform .15s, background .15s;
  }
  .cover-item:active { transform: scale(.98); background: rgba(255,255,255,.2); }
  .cover-item-num {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; flex-shrink: 0;
  }
  .cover-item-body { flex: 1; min-width: 0; }
  .cover-item-title { font-weight: 800; font-size: 15px; }
  .cover-item-sub { font-size: 12px; opacity: .8; margin-top: 2px; }

  /* ── Shell catálogo ── */
  .shell { min-height: 100dvh; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: var(--cat-card);
    border-bottom: 1px solid var(--cat-border);
    padding: calc(8px + var(--safe-top)) 12px 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .topbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .topbar-row + .topbar-row { margin-top: 8px; }
  .btn-icon {
    width: 40px; height: 40px; border-radius: 10px;
    border: 1.5px solid var(--cat-border);
    background: var(--cat-card); color: var(--cat-text);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; font-size: 18px;
  }
  .btn-icon:active { background: var(--cat-blue-light); }
  .top-title { flex: 1; min-width: 0; }
  .top-title h2 { margin: 0; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-title span { font-size: 11px; color: var(--cat-muted); }
  .search-wrap { flex: 1; min-width: 140px; position: relative; }
  .search-wrap input {
    width: 100%; height: 40px; border-radius: 10px;
    border: 1.5px solid var(--cat-border);
    padding: 0 12px 0 36px;
    background: var(--cat-bg); color: var(--cat-text);
    font: inherit; font-size: 14px;
  }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .45; }
  .pill-bar {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  }
  .pill-bar::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; height: 34px; padding: 0 14px;
    border-radius: 999px; border: 1.5px solid var(--cat-border);
    background: var(--cat-card); color: var(--cat-text);
    font: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; scroll-snap-align: start;
    white-space: nowrap;
  }
  .pill.active { background: var(--cat-blue); border-color: var(--cat-blue); color: #fff; }
  .toggle-visita {
    height: 34px; padding: 0 12px; border-radius: 999px;
    border: 1.5px solid #bbf7d0; background: #f0fdf4;
    color: #15803d; font: inherit; font-size: 11px; font-weight: 800;
    cursor: pointer; white-space: nowrap;
  }
  .toggle-visita.off { border-color: var(--cat-border); background: var(--cat-bg); color: var(--cat-muted); }
  html[data-theme="dark"] .toggle-visita,
  html[data-theme="charcoal"] .toggle-visita { background: rgba(34,197,94,.12); }

  .foto-alert {
    margin: 0 12px 8px; padding: 10px 14px; border-radius: 10px;
    background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    font-size: 12px; line-height: 1.45; display: none;
  }
  .foto-alert a { color: #0284c7; font-weight: 800; }
  .sheet-thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 18px 0; }
  .sheet-thumbs img {
    width: 56px; height: 56px; object-fit: contain; border-radius: 8px;
    border: 2px solid transparent; background: #fff; cursor: pointer; flex-shrink: 0;
  }
  .sheet-thumbs img.active { border-color: var(--cat-blue-mid); }

  .content { flex: 1; padding: 12px 8px calc(16px + var(--safe-bot)); max-width: 1200px; width: 100%; margin: 0 auto; }

  /* ── Página estilo catálogo Fort-Lar (impresso) ── */
  .cat-page {
    background: #fff;
    border: 1px solid #94a3b8;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(12, 74, 138, .08);
    content-visibility: auto;
    contain-intrinsic-size: auto 240px;
  }
  html[data-theme="dark"] .cat-page,
  html[data-theme="charcoal"] .cat-page {
    background: var(--cat-card);
    border-color: var(--cat-border);
  }
  .cat-line-bar {
    background: linear-gradient(90deg, #0c4a8a, #1e5a9e);
    color: #fff;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .02em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .cat-line-bar small { font-size: 11px; font-weight: 600; opacity: .85; }
  .cat-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cat-tbl {
    width: 100%;
    min-width: 640px;
    border-collapse: collapse;
    font-size: 12px;
    color: #0f172a;
  }
  html[data-theme="dark"] .cat-tbl,
  html[data-theme="charcoal"] .cat-tbl { color: var(--cat-text); }
  .cat-tbl thead th {
    background: #b8d9f0;
    color: #0c4a8a;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 8px 10px;
    border: 1px solid #94b8d4;
    text-align: center;
    white-space: nowrap;
  }
  .cat-tbl thead th:first-child { text-align: left; min-width: 140px; }
  .cat-tbl .cat-subsec td {
    background: #0c4a8a;
    color: #fff;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 7px 12px;
    border: 1px solid #0c4a8a;
  }
  .cat-tbl .cat-var-head td {
    background: #0c4a8a;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    padding: 7px 10px;
    border: 1px solid #0c4a8a;
  }
  .cat-tbl .cat-var-head td:not(.cat-photo-cell) { text-align: left; }
  .cat-tbl tbody td {
    border: 1px solid #cbd5e1;
    padding: 8px 10px;
    vertical-align: middle;
    text-align: center;
    background: #fff;
  }
  html[data-theme="dark"] .cat-tbl tbody td,
  html[data-theme="charcoal"] .cat-tbl tbody td {
    background: var(--cat-card);
    border-color: var(--cat-border);
  }
  .cat-tbl tbody tr.cat-data-row { cursor: pointer; }
  .cat-tbl tbody tr.cat-data-row:active td { background: #e0f2fe; }
  .cat-tbl .cat-photo-cell {
    width: 130px;
    min-width: 130px;
    text-align: center;
    vertical-align: middle;
    background: #fff;
    padding: 10px;
    border-right: 1px solid #cbd5e1;
  }
  .cat-tbl .cat-photo-cell img {
    max-width: 110px;
    max-height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }
  .cat-tbl .cat-photo-placeholder {
    width: 90px; height: 90px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; color: #94a3b8; font-size: 10px; font-weight: 700;
    border: 1px dashed #cbd5e1;
  }
  .cat-tbl .col-cod { font-weight: 800; font-variant-numeric: tabular-nums; }
  .cat-tbl .col-dash { color: #94a3b8; }
  .cat-tbl .col-preco { font-weight: 800; color: #0284c7; }
  .cat-ean-cell { min-width: 100px; }
  .cat-ean-cell svg { max-width: 90px; height: 36px; display: block; margin: 0 auto; }
  .cat-ean-num { font-size: 9px; color: #64748b; margin-top: 2px; letter-spacing: .04em; }

  .sec-head { display: none; }

  /* ── Detalhe (sheet) ── */
  .sheet-back {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-back.open { display: flex; }
  .sheet {
    width: 100%; max-width: 520px; max-height: 92dvh;
    background: var(--cat-card);
    border-radius: 18px 18px 0 0;
    overflow: auto;
    padding-bottom: var(--safe-bot);
    animation: sheetUp .25s ease;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet-img {
    width: 100%; aspect-ratio: 1; max-height: 320px;
    object-fit: contain; background: #fff; display: block;
  }
  html[data-theme="dark"] .sheet-img,
  html[data-theme="charcoal"] .sheet-img { background: #1e293b; }
  .sheet-body { padding: 16px 18px 24px; }
  .sheet-body h3 { margin: 0 0 6px; font-size: 18px; }
  .sheet-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;
  }
  .sheet-kv {
    background: var(--cat-bg); border-radius: 10px; padding: 10px 12px;
  }
  .sheet-kv label { display: block; font-size: 10px; text-transform: uppercase; color: var(--cat-muted); font-weight: 800; }
  .sheet-kv span { display: block; margin-top: 3px; font-size: 14px; font-weight: 700; }
  .sheet-close {
    position: absolute; top: calc(10px + var(--safe-top)); right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.5); color: #fff;
    font-size: 20px; cursor: pointer; z-index: 2;
  }
  .sheet-wrap { position: relative; }

  .loading, .err {
    min-height: 60dvh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; color: var(--cat-muted); padding: 24px; text-align: center;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--cat-border);
    border-top-color: var(--cat-blue-mid); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media print {
    .topbar, .cover, .sheet-back, .btn-icon, .toggle-visita, .pill-bar, .foto-alert { display: none !important; }
    .shell { display: block !important; }
    .content { padding: 0; max-width: none; }
    .cat-page { break-inside: avoid; box-shadow: none; border: none; margin: 0 0 12px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>

<div id="view-cover" class="cover hidden">
  <div class="cover-brand">
    <img src="/assets/pedidosweb-logo.svg" alt="" onerror="this.style.display='none'">
    <span>PedidosWeb · Catálogo</span>
  </div>
  <div class="cover-main">
    <h1 id="cover-title">Catálogo de Produtos</h1>
    <p id="cover-sub">Toque em uma linha para abrir a apresentação</p>
  </div>
  <div class="cover-list" id="cover-list"></div>
</div>

<div id="view-shell" class="shell hidden">
  <header class="topbar">
    <div class="topbar-row">
      <button type="button" class="btn-icon" id="btn-voltar" title="Voltar">←</button>
      <div class="top-title">
        <h2 id="cat-nome">Catálogo</h2>
        <span id="cat-sub"></span>
      </div>
      <button type="button" class="btn-icon" id="btn-full" title="Tela cheia">⛶</button>
    </div>
    <div class="topbar-row">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="busca" placeholder="Buscar código ou produto…" autocomplete="off">
      </div>
      <button type="button" class="toggle-visita" id="btn-visita" title="Oculta preços — ideal na visita comercial">Modo visita ✓</button>
    </div>
    <div class="topbar-row">
      <div class="pill-bar" id="pill-bar"></div>
    </div>
    <div class="foto-alert" id="foto-alert"></div>
  </header>
  <main class="content" id="content"></main>
</div>

<div id="view-loading" class="loading">
  <div class="spinner"></div>
  <span>Carregando catálogo…</span>
</div>

<div class="sheet-back" id="sheet-back" aria-hidden="true">
  <div class="sheet" role="dialog">
    <div class="sheet-wrap">
      <button type="button" class="sheet-close" id="sheet-close">×</button>
      <img id="sheet-img" class="sheet-img" alt="">
      <div class="sheet-thumbs" id="sheet-thumbs"></div>
      <div class="sheet-body">
        <h3 id="sheet-title"></h3>
        <p id="sheet-desc" style="margin:0;font-size:13px;color:var(--cat-muted)"></p>
        <div class="sheet-grid" id="sheet-grid"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  const idParam = params.get('id');
  const token = () => sessionStorage.getItem('token') || localStorage.getItem('token') || '';

  let _catalogos = [];
  let _cat = null;
  let _itens = [];
  let _modoVisita = true;
  let _busca = '';
  let _secAtiva = '';

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function money(v) {
    return (parseFloat(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }
  function fotoUrl(f) {
    if (!f) return '';
    const s = String(f).trim();
    if (/^https?:\/\//i.test(s) || s.startsWith('data:')) return s;
    return s.startsWith('/') ? s : '/' + s;
  }
  function show(id) {
    ['view-cover','view-shell','view-loading'].forEach(v => {
      document.getElementById(v).classList.toggle('hidden', v !== id);
    });
  }

  async function api(path) {
    const r = await fetch(path, { headers: { Authorization: 'Bearer ' + token() } });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) {
      location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
      throw new Error('Sessão expirada');
    }
    if (!r.ok) throw new Error(d.error || d.erro || 'Erro ao carregar');
    return d;
  }

  function grupoDe(item) {
    const g = String(item.nome_grupo || '').trim();
    return g || 'Geral';
  }

  /** Agrupa variantes (referência mãe ou nome base) — estilo catálogo Fort-Lar */
  function agruparItens(itens) {
    const fotoPorSku = new Map();
    itens.forEach(it => {
      const u = fotoUrl(it.foto_principal);
      if (u) fotoPorSku.set(String(it.cod_produto), u);
    });
    const map = new Map();
    itens.forEach(it => {
      const ref = it.id_referencia ? String(it.id_referencia) : '';
      const key = ref ? 'ref:' + ref : 'sku:' + it.cod_produto;
      if (!map.has(key)) {
        map.set(key, {
          key,
          titulo: it.desc_produto,
          foto: fotoUrl(it.foto_principal),
          grupo: grupoDe(it),
          variantes: [],
        });
      }
      const fam = map.get(key);
      fam.variantes.push(it);
      if (!fam.foto && it.foto_principal) fam.foto = fotoUrl(it.foto_principal);
      if ((it.desc_produto || '').length < (fam.titulo || '').length) fam.titulo = it.desc_produto;
    });
    // Filho sem foto: usa SKU pai quando o pai também está no catálogo
    map.forEach(fam => {
      if (fam.foto) return;
      const m = fam.key.match(/^ref:(\d+)$/);
      if (m && fotoPorSku.has(m[1])) fam.foto = fotoPorSku.get(m[1]);
    });
    return [...map.values()];
  }

  function filtrarFamilias(familias) {
    const q = _busca.toLowerCase().trim();
    return familias.filter(f => {
      if (_secAtiva && f.grupo !== _secAtiva) return false;
      if (!q) return true;
      if (f.titulo.toLowerCase().includes(q)) return true;
      return f.variantes.some(v =>
        String(v.cod_fabricante || '').toLowerCase().includes(q) ||
        String(v.cod_barras || '').toLowerCase().includes(q) ||
        String(v.desc_produto || '').toLowerCase().includes(q) ||
        String(v.cor1 || '').toLowerCase().includes(q)
      );
    });
  }

  function renderPills(grupos) {
    const bar = document.getElementById('pill-bar');
    const pills = [{ id: '', label: 'Todas (' + _itens.length + ')' }];
    grupos.forEach(g => {
      const n = _itens.filter(i => grupoDe(i) === g).length;
      pills.push({ id: g, label: g + ' (' + n + ')' });
    });
    bar.innerHTML = pills.map(p =>
      `<button type="button" class="pill${p.id === _secAtiva ? ' active' : ''}" data-g="${esc(p.id)}">${esc(p.label)}</button>`
    ).join('');
    bar.querySelectorAll('.pill').forEach(b => {
      b.addEventListener('click', () => {
        _secAtiva = b.dataset.g || '';
        renderCatalogo();
        bar.querySelectorAll('.pill').forEach(x => x.classList.toggle('active', x === b));
      });
    });
  }

  /** Extrai Nº, capacidade e medidas do apelido/descrição (ex.: "Nº 9 · 28x9") */
  function specsDe(item) {
    const raw = [item.apelido, item.desc_produto].filter(Boolean).join(' ');
    const med = raw.match(/(\d+(?:[.,]\d+)?)\s*[xX×]\s*(\d+(?:[.,]\d+)?(?:\s*[xX×]\s*\d+(?:[.,]\d+)?)?)/);
    const cap = raw.match(/(\d+(?:[.,]\d+)?)\s*L\b/i);
    const num = raw.match(/\bN[º°]?\s*(\d+(?:[.,]\d+)?)\b/i) || raw.match(/\b(\d{1,2})\s*(?:pol|")\b/i);
    return {
      numero: num ? num[1].replace(',', '.') : '—',
      capacidade: cap ? cap[1].replace(',', '.') : '—',
      medidas: med ? med[0].replace(/\s/g, '').replace(',', '.') : '—',
    };
  }

  function dash(v) {
    return v && v !== '—' ? esc(v) : '<span class="col-dash">—</span>';
  }

  function celEan(ean, id) {
    const e = String(ean || '').replace(/\D/g, '');
    if (e.length < 8) return '<span class="col-dash">—</span>';
    return `<div class="cat-ean-cell"><svg class="cat-barcode" data-ean="${esc(e)}" data-bid="${esc(id)}"></svg><div class="cat-ean-num">${esc(e)}</div></div>`;
  }

  function renderCabecalhoTabela(showPreco) {
    let h = `<thead><tr>
      <th>Produto</th><th>Cód.</th><th>Nº</th><th>Cap.(L)</th><th>Med.Ø (cm)</th><th>Master</th><th>EAN Code</th>`;
    if (showPreco) h += '<th>Preço</th>';
    h += '</tr></thead>';
    return h;
  }

  function renderFamiliaPrint(fam, showPreco) {
    const n = fam.variantes.length;
    const foto = fam.foto
      ? `<img src="${esc(fam.foto)}" alt="" loading="lazy" decoding="async">`
      : '<div class="cat-photo-placeholder">Sem foto</div>';
    const cols = showPreco ? 7 : 6;
    let rows = '';
    fam.variantes.forEach((v, i) => {
      const sp = specsDe(v);
      const nomeVar = v.desc_produto || fam.titulo;
      if (i === 0) {
        rows += `<tr class="cat-var-head" data-key="${esc(fam.key)}">
          <td class="cat-photo-cell" rowspan="${n * 2}">${foto}</td>
          <td colspan="${cols}">${esc(nomeVar)}</td></tr>`;
      } else {
        rows += `<tr class="cat-var-head" data-key="${esc(fam.key)}">
          <td colspan="${cols}">${esc(nomeVar)}</td></tr>`;
      }
      rows += `<tr class="cat-data-row" data-cod="${esc(v.cod_produto)}" data-key="${esc(fam.key)}">
        <td class="col-cod">${dash(v.cod_fabricante || v.cod_produto)}</td>
        <td>${dash(sp.numero)}</td>
        <td>${dash(sp.capacidade)}</td>
        <td>${dash(sp.medidas)}</td>
        <td>${v.embalagemmaster > 0 ? esc(v.embalagemmaster) : '<span class="col-dash">—</span>'}</td>
        <td>${celEan(v.cod_barras, v.cod_produto + '-' + i)}</td>`;
      if (showPreco) rows += `<td class="col-preco">${money(v.vlr_venda)}</td>`;
      rows += '</tr>';
    });
    return rows;
  }

  function aplicarBarcodes(root) {
    if (typeof JsBarcode === 'undefined') return;
    root.querySelectorAll('.cat-barcode[data-ean]').forEach(svg => {
      const ean = svg.getAttribute('data-ean');
      if (!ean || ean.length < 8) return;
      try {
        JsBarcode(svg, ean, {
          format: ean.length === 13 ? 'EAN13' : 'CODE128',
          width: 1.2,
          height: 32,
          displayValue: false,
          margin: 0,
        });
      } catch (_) {
        svg.outerHTML = `<span class="col-dash">${esc(ean)}</span>`;
      }
    });
  }

  function renderTabela(variantes) {
    /* legado — não usado no layout impresso */
    return '';
  }

  function renderCatalogo() {
    const familias = agruparItens(_itens);
    const filtradas = filtrarFamilias(familias);
    const gruposOrd = [];
    const seen = new Set();
    _itens.forEach(i => {
      const g = grupoDe(i);
      if (!seen.has(g)) { seen.add(g); gruposOrd.push(g); }
    });
    renderPills(gruposOrd);

    const el = document.getElementById('content');
    if (!filtradas.length) {
      el.innerHTML = '<div class="loading"><span>Nenhum produto encontrado.</span></div>';
      return;
    }

    const showPreco = !_modoVisita;
    filtradas.sort((a, b) => {
      const ga = gruposOrd.indexOf(a.grupo);
      const gb = gruposOrd.indexOf(b.grupo);
      if (ga !== gb) return ga - gb;
      return String(a.titulo).localeCompare(String(b.titulo), 'pt-BR');
    });

    const tituloPagina = _cat?.nome || 'Catálogo';
    const subPagina = [_cat?.subtitulo, _cat?.nome_fornecedor].filter(Boolean).join(' · ');

    let tbody = '';
    let secAtual = null;
    filtradas.forEach(f => {
      if (!_secAtiva && f.grupo !== secAtual) {
        secAtual = f.grupo;
        tbody += `<tr class="cat-subsec"><td colspan="${showPreco ? 8 : 7}">${esc(secAtual)}</td></tr>`;
      }
      tbody += renderFamiliaPrint(f, showPreco);
    });

    el.innerHTML = `
      <div class="cat-page">
        <div class="cat-line-bar">
          <span>${esc(tituloPagina)}</span>
          ${subPagina ? `<small>${esc(subPagina)}</small>` : ''}
        </div>
        <div class="cat-table-wrap">
          <table class="cat-tbl">
            ${renderCabecalhoTabela(showPreco)}
            <tbody>${tbody}</tbody>
          </table>
        </div>
      </div>`;

    aplicarBarcodes(el);

    el.querySelectorAll('.cat-data-row, .cat-var-head').forEach(node => {
      node.addEventListener('click', () => {
        const cod = node.dataset.cod;
        const key = node.dataset.key;
        const familia = filtradas.find(x => x.key === key);
        if (!familia) return;
        const item = cod
          ? familia.variantes.find(v => String(v.cod_produto) === String(cod))
          : familia.variantes[0];
        if (item) abrirSheet(item, familia);
      });
    });
  }

  function atualizarAlertaFotos() {
    const el = document.getElementById('foto-alert');
    if (!el || !_itens.length) { if (el) el.style.display = 'none'; return; }
    const semFam = agruparItens(_itens).filter(f => !f.foto).length;
    if (!semFam) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.innerHTML = `<strong>${semFam} linha(s) do catálogo sem foto.</strong> Coloque a imagem no produto <em>pai</em> (referência mãe) ou importe com o <em>código fabricante</em> (ex.: 9076.jpg) em Produtos — os filhos herdam automaticamente.`;
  }

  async function abrirSheet(item, familia) {
    document.getElementById('sheet-title').textContent = item.desc_produto || familia.titulo;
    document.getElementById('sheet-desc').textContent = familia.titulo !== item.desc_produto ? familia.titulo : (item.apelido || '');
    const imgEl = document.getElementById('sheet-img');
    const thumbs = document.getElementById('sheet-thumbs');
    thumbs.innerHTML = '';
    let urls = [];
    try {
      const r = await fetch('/api/produtos/' + item.cod_produto + '/imagens', {
        headers: { Authorization: 'Bearer ' + token() },
      });
      if (r.ok) {
        const d = await r.json();
        const arr = Array.isArray(d) ? d : (d.imagens || []);
        urls = arr.map(x => fotoUrl(x.url || x.caminho || x.filename)).filter(Boolean);
      }
    } catch (_) {}
    if (!urls.length) {
      const u = fotoUrl(item.foto_principal) || familia.foto;
      if (u) urls = [u];
    }
    const showImg = (u, idx) => {
      imgEl.src = u;
      imgEl.style.display = u ? 'block' : 'none';
      thumbs.querySelectorAll('img').forEach((t, i) => t.classList.toggle('active', i === idx));
    };
    if (urls.length > 1) {
      thumbs.innerHTML = urls.map((u, i) =>
        `<img src="${esc(u)}" alt="" data-i="${i}" class="${i === 0 ? 'active' : ''}">`
      ).join('');
      thumbs.querySelectorAll('img').forEach(t => {
        t.addEventListener('click', () => showImg(urls[parseInt(t.dataset.i, 10)], parseInt(t.dataset.i, 10)));
      });
    }
    showImg(urls[0], 0);
    const kvs = [
      ['Código', item.cod_fabricante || item.cod_produto],
      ['EAN', item.cod_barras || '—'],
      ['Cor', item.cor1 || '—'],
      ['Unidade', item.unidade || '—'],
      ['Master', item.embalagemmaster > 0 ? item.embalagemmaster : '—'],
      ['Grupo', grupoDe(item)],
    ];
    if (!_modoVisita) kvs.push(['Preço', money(item.vlr_venda)]);
    document.getElementById('sheet-grid').innerHTML = kvs.map(([l,v]) =>
      `<div class="sheet-kv"><label>${esc(l)}</label><span>${esc(v)}</span></div>`
    ).join('');
    document.getElementById('sheet-back').classList.add('open');
    document.getElementById('sheet-back').setAttribute('aria-hidden', 'false');
  }

  function fecharSheet() {
    document.getElementById('sheet-back').classList.remove('open');
    document.getElementById('sheet-back').setAttribute('aria-hidden', 'true');
  }

  async function carregarCatalogo(id) {
    show('view-loading');
    const d = await api('/api/catalogos/' + id);
    _cat = d.catalogo;
    _itens = d.itens || [];
    document.getElementById('cat-nome').textContent = _cat.nome || 'Catálogo';
    document.getElementById('cat-sub').textContent = [_cat.subtitulo, _cat.nome_fornecedor, _itens.length + ' produto(s)'].filter(Boolean).join(' · ');
    document.title = (_cat.nome || 'Catálogo') + ' — Apresentação';
    _secAtiva = '';
    renderCatalogo();
    atualizarAlertaFotos();
    show('view-shell');
  }

  async function carregarIndice() {
    show('view-loading');
    const d = await api('/api/catalogos?todos=0');
    _catalogos = (d.catalogos || []).filter(c => (c.qtd_itens || 0) > 0);
    if (!_catalogos.length) throw new Error('Nenhum catálogo ativo com produtos. Cadastre em Comercial → Catálogos Visuais.');
    document.getElementById('cover-title').textContent = 'Catálogo de Produtos';
    document.getElementById('cover-sub').textContent = 'Escolha a linha para apresentar ao cliente';
    document.getElementById('cover-list').innerHTML = _catalogos.map((c, i) =>
      `<button type="button" class="cover-item" data-id="${c.id}">
        <span class="cover-item-num">${String(i + 1).padStart(2, '0')}</span>
        <span class="cover-item-body">
          <div class="cover-item-title">${esc(c.nome)}</div>
          <div class="cover-item-sub">${esc(c.subtitulo || c.nome_fornecedor || '')} · ${c.qtd_itens || 0} produtos</div>
        </span>
      </button>`
    ).join('');
    document.getElementById('cover-list').querySelectorAll('.cover-item').forEach(btn => {
      btn.addEventListener('click', () => {
        history.replaceState(null, '', '?id=' + btn.dataset.id);
        carregarCatalogo(btn.dataset.id);
      });
    });
    show('view-cover');
  }

  document.getElementById('btn-voltar').addEventListener('click', () => {
    if (idParam || _catalogos.length <= 1) {
      if (_catalogos.length > 1) {
        history.replaceState(null, '', location.pathname);
        carregarIndice();
      } else {
        window.close();
        history.back();
      }
    } else {
      history.replaceState(null, '', location.pathname);
      carregarIndice();
    }
  });

  document.getElementById('btn-full').addEventListener('click', () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) el.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  });

  document.getElementById('btn-visita').addEventListener('click', () => {
    _modoVisita = !_modoVisita;
    const b = document.getElementById('btn-visita');
    b.classList.toggle('off', !_modoVisita);
    b.textContent = _modoVisita ? 'Modo visita ✓' : 'Mostrar preços';
    if (_cat) renderCatalogo();
  });

  document.getElementById('busca').addEventListener('input', e => {
    _busca = e.target.value;
    if (_cat) renderCatalogo();
  });

  document.getElementById('sheet-close').addEventListener('click', fecharSheet);
  document.getElementById('sheet-back').addEventListener('click', e => {
    if (e.target.id === 'sheet-back') fecharSheet();
  });

  (async function init() {
    try {
      if (!token()) {
        location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
        return;
      }
      if (idParam) await carregarCatalogo(idParam);
      else await carregarIndice();
    } catch (e) {
      show('view-loading');
      document.getElementById('view-loading').className = 'err';
      document.getElementById('view-loading').innerHTML =
        `<strong>Não foi possível abrir</strong><span>${esc(e.message)}</span>
         <a href="/pages/comercial-catalogos.html" style="color:var(--cat-blue-mid)">Ir para Catálogos Visuais</a>`;
    }
  })();
})();
</script>
</body>
</html>
