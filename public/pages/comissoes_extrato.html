<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Extrato Unificado · Comissões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<style>
:root {
  --bg:     var(--content-bg, #f4f7fa);
  --card:   var(--card-bg, #ffffff);
  --border: var(--table-border, #e2e8f0);
  --text:   var(--content-text, #1e293b);
  --text2:  var(--text-muted, #64748b);
  --accent: var(--accent, #0ea5e9);
  --accent-soft: rgba(14,165,233,.12);
  --success: #22c55e;
  --warn:    #f59e0b;
  --danger:  #ef4444;
  --purple:  #8b5cf6;
  --font:    var(--font,'Inter',system-ui,sans-serif);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}

/* ── toolbar ── */
.toolbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:100;}
.toolbar-title{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);margin-right:8px;white-space:nowrap;}
.f-group{display:flex;flex-direction:column;gap:3px;}
.f-label{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text2);}
.f-input{height:34px;padding:0 10px;border:1px solid #cbd5e1;border-radius:7px;background:var(--card);color:var(--text);font-size:12px;outline:none;font-family:var(--font);}
.f-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:var(--font);white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:var(--card);color:var(--text2);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--bg);color:var(--text);}
.btn-warn{background:var(--warn);color:#fff;}
.btn-warn:hover{filter:brightness(1.05);}

/* ── KPIs ── */
.kpi-bar{display:flex;gap:12px;padding:16px 24px;flex-wrap:wrap;}
.kpi{flex:1;min-width:160px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;display:flex;align-items:center;gap:12px;}
.kpi-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.kpi-icon.green{background:rgba(34,197,94,.12);color:var(--success);}
.kpi-icon.amber{background:rgba(245,158,11,.12);color:var(--warn);}
.kpi-icon.red{background:rgba(239,68,68,.12);color:var(--danger);}
.kpi-icon.blue{background:rgba(14,165,233,.12);color:var(--accent);}
.kpi-info{display:flex;flex-direction:column;}
.kpi-label{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text2);letter-spacing:.5px;}
.kpi-val{font-size:18px;font-weight:800;color:var(--text);}
.kpi-val.green{color:var(--success);}
.kpi-val.amber{color:var(--warn);}
.kpi-val.red{color:var(--danger);}

/* ── table ── */
.wrap{padding:0 24px 40px;}
.tbl-container{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{padding:12px 14px;background:#f8fafc;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--text2);border-bottom:2px solid var(--border);text-align:left;white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--accent-soft);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.saldo-pos{color:var(--success);font-weight:700;}
.saldo-neg{color:var(--danger);font-weight:700;}

/* ── badges ── */
.badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;white-space:nowrap;}
.badge-P{background:rgba(245,158,11,.15);color:#b45309;}
.badge-C{background:rgba(14,165,233,.15);color:#0369a1;}
.badge-R{background:rgba(34,197,94,.15);color:#15803d;}
.badge-I{background:rgba(239,68,68,.15);color:#b91c1c;}

/* ── empty ── */
.empty{text-align:center;padding:60px 0;color:var(--text2);}
.empty i{font-size:36px;margin-bottom:12px;display:block;opacity:.3;}

/* ── loading ── */
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--text2);}
.spinner{width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title"><i class="fa-solid fa-receipt" style="margin-right:6px;color:var(--accent);"></i>Extrato Unificado</span>

  <div class="f-group" id="wrap-vendedor" style="display:none;">
    <span class="f-label">Vendedor</span>
    <select id="sel-vendedor" class="f-input" style="min-width:160px;" autoComplete="off"></select>
  </div>

  <div class="f-group">
    <span class="f-label">De</span>
    <input type="date" id="dt-ini" class="f-input" autoComplete="off">
  </div>
  <div class="f-group">
    <span class="f-label">Até</span>
    <input type="date" id="dt-fim" class="f-input" autoComplete="off">
  </div>
  <div class="f-group">
    <span class="f-label">Fornecedor</span>
    <select id="sel-forn" class="f-input" style="min-width:160px;" autoComplete="off">
      <option value="">Todos</option>
    </select>
  </div>

  <button class="btn btn-primary" onclick="carregar()"><i class="fa-solid fa-magnifying-glass"></i> Consultar</button>
  <button class="btn btn-ghost" onclick="exportCSV()"><i class="fa-solid fa-file-csv"></i> CSV</button>
</div>

<div class="kpi-bar">
  <div class="kpi">
    <div class="kpi-icon green"><i class="fa-solid fa-circle-check"></i></div>
    <div class="kpi-info">
      <span class="kpi-label">Liquidado / Conferido</span>
      <span class="kpi-val green" id="kpi-liq">R$ —</span>
    </div>
  </div>
  <div class="kpi">
    <div class="kpi-icon amber"><i class="fa-solid fa-clock"></i></div>
    <div class="kpi-info">
      <span class="kpi-label">Pendente</span>
      <span class="kpi-val amber" id="kpi-pend">R$ —</span>
    </div>
  </div>
  <div class="kpi">
    <div class="kpi-icon red"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="kpi-info">
      <span class="kpi-label">Inadimplente</span>
      <span class="kpi-val red" id="kpi-inad">R$ —</span>
    </div>
  </div>
  <div class="kpi">
    <div class="kpi-icon blue"><i class="fa-solid fa-wallet"></i></div>
    <div class="kpi-info">
      <span class="kpi-label">Saldo Final</span>
      <span class="kpi-val" id="kpi-saldo">R$ —</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="tbl-container">
    <table id="tbl">
      <thead>
        <tr>
          <th>Data</th>
          <th>Pedido</th>
          <th>Cliente</th>
          <th>Fornecedor</th>
          <th>Parc.</th>
          <th>Vencimento</th>
          <th>Vendedor</th>
          <th>Status</th>
          <th class="num">Valor</th>
          <th class="num">Saldo Acum.</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="10"><div class="loading"><div class="spinner"></div> Carregando...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const fmtR = v => 'R$ ' + parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : '—';
let _dados = [];
let _isAdmin = false;

async function init() {
  const hoje = new Date();
  const ini  = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  document.getElementById('dt-ini').value = ini.toISOString().slice(0,10);
  document.getElementById('dt-fim').value = hoje.toISOString().slice(0,10);

  // verifica se é admin
  try {
    const r = await fetch('/api/comissoes/admin/vendedores', {credentials:'include'});
    if (r.ok) {
      const vends = await r.json();
      if (vends.length > 1) {
        _isAdmin = true;
        document.getElementById('wrap-vendedor').style.display = '';
        const sel = document.getElementById('sel-vendedor');
        sel.innerHTML = '<option value="">Todos</option>';
        vends.forEach(v => { const o = document.createElement('option'); o.value=v.id; o.textContent=v.nome; sel.appendChild(o); });
      }
    }
  } catch(_) {}

  // carrega fornecedores via lookups (leve — não faz full-scan na pagtocomissao)
  try {
    const r = await fetch('/api/pedidos/lookups', {credentials:'include'});
    if (r.ok) {
      const d = await r.json();
      const sel = document.getElementById('sel-forn');
      (d.fornecedores || []).forEach(f => {
        const o = document.createElement('option');
        o.value = f.id; o.textContent = f.nome;
        sel.appendChild(o);
      });
    }
  } catch(_) {}

  carregar();
}

async function carregar() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '<tr><td colspan="10"><div class="loading"><div class="spinner"></div> Carregando...</div></td></tr>';

  const dtIni  = document.getElementById('dt-ini').value;
  const dtFim  = document.getElementById('dt-fim').value;
  const forn   = document.getElementById('sel-forn').value;
  const vend   = document.getElementById('sel-vendedor').value;

  const params = new URLSearchParams({ dt_ini: dtIni, dt_fim: dtFim });
  if (forn) params.set('id_fornecedor', forn);
  if (vend) params.set('id_vendedor', vend);

  try {
    const r = await fetch('/api/comissoes/extrato-unificado?' + params, {credentials:'include'});
    if (!r.ok) throw new Error('Erro ' + r.status);
    const json = await r.json();
    _dados = json.data || [];

    // KPIs
    const t = json.totais || {};
    document.getElementById('kpi-liq').textContent  = fmtR(t.liquidado||0);
    document.getElementById('kpi-pend').textContent = fmtR(t.pendente||0);
    document.getElementById('kpi-inad').textContent = fmtR(t.inadimplente||0);
    const saldo = json.saldo_final || 0;
    const elSaldo = document.getElementById('kpi-saldo');
    elSaldo.textContent = fmtR(saldo);
    elSaldo.className = 'kpi-val ' + (saldo >= 0 ? 'green' : 'red');

    renderTabela(_dados);
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="10"><div class="empty"><i class="fa-solid fa-circle-exclamation"></i>${e.message}</div></td></tr>`;
  }
}

function renderTabela(rows) {
  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty"><i class="fa-solid fa-inbox"></i>Nenhum registro encontrado</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${fmtD(r.data)}</td>
      <td><b>${r.num_pedido||'—'}</b></td>
      <td>${r.nome_cliente||'—'}</td>
      <td>${r.nome_fornecedor||'—'}</td>
      <td style="text-align:center;">${r.parcela}/${r.qt_parcelas}</td>
      <td>${fmtD(r.vencimento)}</td>
      <td>${r.nome_vendedor||'—'}</td>
      <td><span class="badge badge-${r.status}">${r.status_label}</span></td>
      <td class="num"><b>${fmtR(r.valor)}</b></td>
      <td class="num ${r.saldo_acumulado>=0?'saldo-pos':'saldo-neg'}">${fmtR(r.saldo_acumulado)}</td>
    </tr>
  `).join('');
}

function exportCSV() {
  if (!_dados.length) return;
  const header = ['Data','Pedido','Cliente','Fornecedor','Parcela','Vencimento','Vendedor','Status','Valor','Saldo Acumulado'];
  const rows = _dados.map(r => [
    r.data, r.num_pedido, r.nome_cliente, r.nome_fornecedor,
    r.parcela+'/'+r.qt_parcelas, r.vencimento, r.nome_vendedor, r.status_label,
    String(r.valor||0).replace('.',','), String(r.saldo_acumulado||0).replace('.',',')
  ].map(v => '"'+(v||'').toString().replace(/"/g,'""')+'"').join(';'));
  const csv = [header.join(';'), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿' + encodeURIComponent(csv);
  a.download = 'extrato_comissoes.csv';
  a.click();
}

init();
</script>
</body>
</html>
