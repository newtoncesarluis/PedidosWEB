<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regiões | Administrativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/index.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --success-color: #2ec4b6;
      --bg-light: #f8f9fa;
    }
    body { background-color: var(--bg-light); font-family: 'Inter', sans-serif; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .btn-primary { background-color: var(--primary-color); border: none; padding: 10px 20px; border-radius: 8px; }
    .btn-success { background-color: var(--success-color); border: none; }
    .badge-active { background-color: rgba(46, 196, 182, 0.1); color: var(--success-color); border: 1px solid var(--success-color); }
    .badge-inactive { background-color: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid #e74c3c; }
    .action-btn { cursor: pointer; transition: transform 0.2s; }
    .action-btn:hover { transform: scale(1.1); }
  </style>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<script src="/assets/cadastros-permissao.js"></script>
</head>
<body>
  <div class="container-fluid py-4">
    <div class="row mb-4 align-items-center">
      <div class="col-6">
        <h1 class="h3 mb-0 text-gray-800 fw-bold">Gestão de Regiões</h1>
        <p class="text-muted mb-0">Cadastre e gerencie as rotas e regiões de atendimento.</p>
      </div>
      <div class="col-6 text-end">
        <button id="btnNovo" class="btn btn-primary shadow-sm" style="display:none;">
          <i class="bi bi-plus-lg me-2"></i> Nova Região
        </button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="table-responsive">
          <table id="tabelaRegioes" class="table table-hover align-middle" style="width:100%">
            <thead class="table-light">
              <tr>
                <th>Cód. Interno</th>
                <th>Cód. Auxiliar</th>
                <th>Nome</th>
                <th>Sigla</th>
                <th>Distância (KM)</th>
                <th>Status</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Cadastro -->
  <div class="modal fade" id="modalRegiao" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-light p-4">
          <h5 class="modal-title fw-bold" id="modalTitulo">Nova Região</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formRegiao">
          <div class="modal-body p-4">
            <input type="hidden" id="idRegiao">
            
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Código Auxiliar</label>
                <input type="text" id="cod_auxiliar" class="form-control" placeholder="Ex: R01">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Sigla</label>
                <input type="text" id="sigla" class="form-control" placeholder="Ex: SP-SUL">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Nome da Região <span class="text-danger">*</span></label>
                <input type="text" id="descricao" class="form-control" required placeholder="Digite o nome completo">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Distância (KM)</label>
                <input type="number" id="distancia" class="form-control" step="0.01" value="0.00">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Status</label>
                <select id="status" class="form-select">
                  <option value="A">ATIVO</option>
                  <option value="I">INATIVO</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer bg-light p-3">
            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 shadow-sm">Salvar Alterações</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    /** JWT Bearer p/ jQuery/DataTables + fetch /api/ */
(function(){
  function _tok() {
    try {
      if (window.parent && window.parent !== window) {
        const pt = window.parent.sessionStorage?.getItem('token') || window.parent.localStorage?.getItem('token');
        if (pt) return pt;
      }
    } catch (_) {}
    return localStorage.getItem('token')
      || sessionStorage.getItem('token')
      || sessionStorage.getItem('sysrep_token')
      || '';
  }
  window._authHeaders = function(extra) {
    const h = Object.assign({}, extra || {});
    const t = _tok();
    if (t) h.Authorization = 'Bearer ' + t;
    return h;
  };
  window._api = function(url, opts) {
    opts = opts || {};
    const headers = window._authHeaders(opts.headers || {});
    return fetch(url, Object.assign({}, opts, { credentials: 'include', headers }));
  };
  if (window.jQuery) {
    jQuery.ajaxSetup({
      beforeSend: function(xhr, settings) {
        const u = String(settings.url || '');
        if (u.indexOf('/api/') === 0 || (u.indexOf('/api/') !== -1 && u.charAt(0) === '/')) {
          const t = _tok();
          if (t) xhr.setRequestHeader('Authorization', 'Bearer ' + t);
        }
      },
      xhrFields: { withCredentials: true }
    });
  }
})();
let tabela;
    let permissoes = { incluir: 'N', alterar: 'N', excluir: 'N' };

    $(document).ready(async function() {
      if (typeof guardCadastroTela === 'function') {
        const ok = await guardCadastroTela();
        if (ok === false) return;
      }
      carregarPermissoes();
      inicializarTabela();
      
      $('#btnNovo').click(() => {
        if (typeof guardCadIncluir === 'function' && !guardCadIncluir()) return;
        $('#formRegiao')[0].reset();
        $('#idRegiao').val('');
        $('#modalTitulo').text('Nova Região');
        new bootstrap.Modal('#modalRegiao').show();
      });

      $('#formRegiao').submit(salvarRegiao);
    });

    function carregarPermissoes() {
      const incluir = (typeof podeIncluirCad === 'function' && podeIncluirCad()) || (typeof permCadastro === 'function' && permCadastro('incluir_regioes') === 'S');
      const alterar = (typeof podeAlterarCad === 'function' && podeAlterarCad()) || (typeof permCadastro === 'function' && permCadastro('alterar_regioes') === 'S');
      const excluir = (typeof podeExcluirCad === 'function' && podeExcluirCad()) || (typeof permCadastro === 'function' && permCadastro('excluir_regioes') === 'S');
      const admin = !!window._cadIsAdmin;
      permissoes = {
        incluir: (admin || incluir) ? 'S' : 'N',
        alterar: (admin || alterar) ? 'S' : 'N',
        excluir: (admin || excluir) ? 'S' : 'N',
      };
      if (permissoes.incluir === 'S') $('#btnNovo').show();
    }

    function inicializarTabela() {
      tabela = $('#tabelaRegioes').DataTable({
        ajax: {
          url: '/api/regioes',
          dataSrc: function (json) {
            if (!json || !Array.isArray(json.regioes)) return [];
            return json.regioes;
          },
          error: function (xhr) {
            const msg = (xhr.responseJSON && xhr.responseJSON.error) || xhr.statusText || 'Falha ao carregar';
            Swal.fire('Erro', 'Não foi possível carregar as regiões: ' + msg, 'error');
          }
        },
        columns: [
          { data: 'id' },
          { data: 'cod_auxiliar', defaultContent: '' },
          { data: 'descricao' },
          { data: 'sigla', defaultContent: '' },
          { data: 'distancia', render: v => v ? parseFloat(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : '0,00' },
          { data: 'status', render: v => `<span class="badge ${v === 'A' ? 'badge-active' : 'badge-inactive'}">${v === 'A' ? 'ATIVO' : 'INATIVO'}</span>` },
          { 
            data: null, 
            className: 'text-center',
            orderable: false,
            render: row => {
              let btns = '';
              if (permissoes.alterar === 'S') {
                btns += `<i class="bi bi-pencil-square text-primary action-btn me-3" onclick="editarRegiao(${row.id})" title="Editar"></i>`;
              }
              if (permissoes.excluir === 'S') {
                btns += `<i class="bi bi-trash text-danger action-btn" onclick="excluirRegiao(${row.id})" title="Excluir"></i>`;
              }
              return btns || '<span class="text-muted">-</span>';
            }
          }
        ],
        language: {
          emptyTable: 'Nenhuma região cadastrada',
          zeroRecords: 'Nenhum registro encontrado',
          info: 'Mostrando _START_ a _END_ de _TOTAL_ regiões',
          infoEmpty: 'Nenhuma região',
          infoFiltered: '(filtrado de _MAX_ no total)',
          search: 'Buscar:',
          lengthMenu: 'Exibir _MENU_',
          paginate: { first: 'Primeira', last: 'Última', next: 'Próxima', previous: 'Anterior' },
          processing: 'Carregando…',
          loadingRecords: 'Carregando…'
        },
        order: [[2, 'asc']]
      });
    }

    async function salvarRegiao(e) {
      e.preventDefault();
      const id = $('#idRegiao').val();
      if (id) {
        if (typeof guardCadAlterar === 'function' && !guardCadAlterar()) return;
      } else if (typeof guardCadIncluir === 'function' && !guardCadIncluir()) {
        return;
      }
      const dados = {
        descricao: $('#descricao').val(),
        cod_auxiliar: $('#cod_auxiliar').val(),
        sigla: $('#sigla').val(),
        distancia: $('#distancia').val(),
        status: $('#status').val()
      };

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/regioes/${id}` : '/api/regioes';
        
        const res = await _api(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        if (res.ok) {
          bootstrap.Modal.getInstance('#modalRegiao').hide();
          tabela.ajax.reload();
          Swal.fire('Sucesso!', `Região ${id ? 'atualizada' : 'cadastrada'} com sucesso.`, 'success');
        } else {
          const err = await res.json().catch(() => ({}));
          Swal.fire('Erro', err.error || 'Não foi possível salvar os dados.', 'error');
        }
      } catch (err) { Swal.fire('Erro', 'Não foi possível salvar os dados.', 'error'); }
    }

    async function editarRegiao(id) {
      try {
        if (typeof guardCadAlterar === 'function' && !guardCadAlterar()) return;
        const regiao = tabela.rows().data().toArray().find(r => r.id === id);
        if (regiao) {
          $('#idRegiao').val(regiao.id);
          $('#descricao').val(regiao.descricao);
          $('#cod_auxiliar').val(regiao.cod_auxiliar || '');
          $('#sigla').val(regiao.sigla || '');
          $('#distancia').val(regiao.distancia || 0);
          $('#status').val(regiao.status || 'A');
          $('#modalTitulo').text('Editar Região');
          new bootstrap.Modal('#modalRegiao').show();
        }
      } catch (err) { console.error(err); }
    }

    function excluirRegiao(id) {
      if (typeof guardCadExcluir === 'function' && !guardCadExcluir()) return;
      Swal.fire({
        title: 'Tem certeza?',
        text: "A região será marcada como excluída!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
      }).then(async (result) => {
        if (result.isConfirmed) {
          const res = await _api(`/api/regioes/${id}`, { method: 'DELETE' });
          if (res.ok) {
            tabela.ajax.reload();
            Swal.fire('Excluído!', 'A região foi removida.', 'success');
          } else {
            const err = await res.json().catch(() => ({}));
            Swal.fire('Erro', err.error || 'Não foi possível excluir.', 'error');
          }
        }
      });
    }
  </script>
</body>
</html>
