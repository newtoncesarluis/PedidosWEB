<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campos de importação — SysRepWeb</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="/assets/themes.css">
  <script src="/assets/themes.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font) !important;
      font-size: var(--base-font-size, 14px) !important;
      background: var(--content-bg, var(--bg, #f8fafc)) !important;
      color: var(--content-text, #1e293b) !important;
      min-height: 100vh;
      padding: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
    .hdr {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
    }
    .hdr h1 { font-size: clamp(1.25rem, 3vw, 1.65rem); font-weight: 800; letter-spacing: -0.02em; }
    .hdr h1 span { color: var(--accent); }
    .hdr-sub { font-size: 11px; font-weight: 600; color: var(--text2, #64748b); margin-top: 6px; letter-spacing: 0.06em; }
    .hdr-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-top {
      padding: 8px 14px; font-size: 12px; font-weight: 700; border: none; border-radius: 7px;
      background: var(--accent); color: var(--btn-text, #fff); cursor: pointer; transition: .15s;
      font-family: var(--font, system-ui, sans-serif);
    }
    .btn-top:hover { filter: brightness(1.06); }
    .btn-link {
      display: inline-flex; align-items: center; padding: 8px 14px; font-size: 12px; font-weight: 700;
      border-radius: 7px; border: 1px solid var(--input-border, #e5e7eb);
      background: var(--glass-bg, #fff); color: var(--content-text); text-decoration: none;
      font-family: var(--font, system-ui, sans-serif); transition: .15s;
    }
    .btn-link:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar {
      display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap;
    }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--input-border, #e5e7eb);
      background: var(--glass-bg, #fff); color: var(--text2, #64748b);
      font-size: 11px; font-weight: 700; cursor: pointer; transition: .15s;
      font-family: var(--font, system-ui, sans-serif);
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active {
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent);
    }
    .tabela-select {
      padding: 7px 11px; background: var(--glass-bg, #fff); border: 1px solid var(--input-border, #e5e7eb);
      border-radius: 7px; color: var(--content-text); font-size: 12px; outline: none; cursor: pointer;
      font-family: var(--font, system-ui, sans-serif); font-weight: 600;
    }
    .search-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-wrap svg {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text2, #64748b); width: 14px; height: 14px; pointer-events: none;
    }
    .search-input {
      width: 100%; padding: 8px 10px 8px 34px;
      background: var(--glass-bg, #fff); border: 1px solid var(--input-border, #e5e7eb);
      border-radius: 7px; color: var(--content-text); font-size: 13px; outline: none; transition: .15s;
      font-family: var(--font, system-ui, sans-serif);
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
    .stats { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .stat {
      background: var(--glass-bg, #fff); border: 1px solid var(--input-border, #e5e7eb);
      border-radius: 8px; padding: 8px 14px;
    }
    .stat-val { font-size: 1.25rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .stat-lbl { font-size: 10px; font-weight: 700; color: var(--text2, #64748b); margin-top: 4px; letter-spacing: 0.06em; }
    .table-container {
      border: 1px solid var(--input-border, #e5e7eb); border-radius: var(--radius-md, 10px);
      overflow: auto; max-height: 65vh; background: var(--glass-bg, #fff);
      box-shadow: var(--shadow-sm, 0 1px 4px rgba(0,0,0,.06));
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead { position: sticky; top: 0; z-index: 2; background: var(--content-bg, #f1f5f9); }
    th {
      padding: 10px 12px; text-align: left; font-size: 10px; font-weight: 800;
      letter-spacing: 0.06em; color: var(--accent); border-bottom: 1px solid var(--input-border, #e5e7eb);
      white-space: nowrap;
    }
    td {
      padding: 9px 12px; border-bottom: 1px solid color-mix(in srgb, var(--content-text) 10%, transparent);
      vertical-align: middle; font-size: 12px; color: var(--content-text);
    }
    tr:nth-child(even) td { background: color-mix(in srgb, var(--content-text) 3%, transparent); }
    tr:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
    tr.inativo td { opacity: 0.5; }
    .col-id { width: 48px; text-align: center; color: var(--text2, #64748b); font-size: 11px; }
    .col-ordem { width: 56px; text-align: center; }
    .col-acoes { width: 120px; text-align: center; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 9px; font-weight: 800; letter-spacing: 0.04em; border: 1px solid;
    }
    .badge-ativo   { color: var(--success, #22c55e); border-color: color-mix(in srgb, var(--success) 35%, transparent); background: color-mix(in srgb, var(--success) 8%, transparent); }
    .badge-inativo { color: var(--danger, #ef4444); border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: color-mix(in srgb, var(--danger) 8%, transparent); }
    .badge-obrig   { color: var(--warn, #ca8a04); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
    .badge-tipo    { color: var(--accent-hover, #0ea5e9); border-color: color-mix(in srgb, var(--accent-hover) 35%, transparent); background: color-mix(in srgb, var(--accent-hover) 8%, transparent); }
    .btn-action {
      padding: 4px 8px; border-radius: 6px; border: 1px solid var(--input-border, #e5e7eb);
      background: transparent; color: var(--text2, #64748b);
      font-size: 11px; font-weight: 700; cursor: pointer; transition: .15s; margin: 0 2px;
      font-family: var(--font, system-ui, sans-serif);
    }
    .btn-action:hover { border-color: var(--accent); color: var(--accent); }
    .btn-action.danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn-action.toggle-on  { border-color: color-mix(in srgb, var(--success) 45%, transparent); color: var(--success); }
    .btn-action.toggle-off { border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }
    .empty-state { padding: 40px; text-align: center; color: var(--text2, #64748b); font-weight: 600; font-size: 13px; }
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      opacity: 0; pointer-events: none; transition: opacity .2s; backdrop-filter: blur(3px);
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--glass-bg, #fff); border: 1px solid var(--input-border, #e5e7eb);
      border-radius: var(--radius-md, 14px); padding: 20px 22px; width: 100%; max-width: 500px;
      transform: translateY(12px); transition: transform .2s; box-shadow: var(--shadow-md, 0 8px 32px rgba(0,0,0,.12));
    }
    .overlay.open .modal { transform: translateY(0); }
    .modal h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; }
    .modal h2 span { color: var(--accent); }
    .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .form-grid2 { grid-template-columns: 1fr; } }
    .form-row { margin-bottom: 12px; }
    .form-row label {
      display: block; font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
      color: var(--text2, #64748b); margin-bottom: 4px;
    }
    .form-row input, .form-row select {
      width: 100%; padding: 9px 11px;
      background: var(--content-bg, #f8fafc); border: 1px solid var(--input-border, #e5e7eb);
      border-radius: 7px; color: var(--content-text); font-size: 13px; outline: none; transition: .15s;
      font-family: var(--font, system-ui, sans-serif);
    }
    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
    .toggle-row { display: flex; gap: 20px; margin-bottom: 12px; flex-wrap: wrap; }
    .toggle-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .toggle-item input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .toggle-item span { font-size: 12px; font-weight: 600; color: var(--text2, #64748b); }
    .modal-footer { display: flex; gap: 10px; margin-top: 18px; }
    .btn-salvar {
      flex: 1; padding: 10px; background: var(--accent); color: var(--btn-text, #fff);
      border: none; border-radius: 7px; font-size: 12px; font-weight: 800; cursor: pointer;
      font-family: var(--font, system-ui, sans-serif); transition: .15s;
    }
    .btn-salvar:hover { filter: brightness(1.06); }
    .btn-cancelar {
      padding: 10px 14px; background: transparent; border: 1px solid var(--input-border, #e5e7eb);
      border-radius: 7px; color: var(--text2, #64748b); font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: var(--font, system-ui, sans-serif); transition: .15s;
    }
    .btn-cancelar:hover { border-color: var(--danger); color: var(--danger); }
    .modal-msg { margin-top: 10px; padding: 8px 11px; border-radius: 7px; font-size: 12px; font-weight: 600; display: none; }
    .modal-msg.ok { background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success); display: block; }
    .modal-msg.erro { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); display: block; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; padding: 11px 16px; border-radius: 8px;
      font-size: 12px; font-weight: 600; z-index: 200; opacity: 0; transform: translateY(10px);
      transition: all .25s; pointer-events: none; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok { background: color-mix(in srgb, var(--success) 14%, transparent); border: 1px solid color-mix(in srgb, var(--success) 35%, transparent); color: var(--success); }
    .toast.erro { background: color-mix(in srgb, var(--danger) 14%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); }
    mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--content-text); border-radius: 2px; padding: 0 2px; }
  </style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div>
      <h1>Campos<span>.</span>importação</h1>
      <p class="hdr-sub">Configure os campos usados pelo importador de planilhas (tabela produto e outras).</p>
    </div>
    <div class="hdr-actions">
      <button type="button" class="btn-link" onclick="window.SysTheme?.open?.()">Tema</button>
      <a class="btn-link" href="/pages/importacao-menu.html">← Menu importação</a>
      <button type="button" class="btn-top" onclick="abrirModal()">+ Novo campo</button>
    </div>
  </header>

  <div class="toolbar">
    <select class="tabela-select" id="tabelaSelect" autocomplete="off" onchange="carregar()">
      <option value="produto">produto</option>
    </select>
    <div class="filter-group">
      <button type="button" class="filter-btn active" onclick="setFiltro('todos', this)">Todos</button>
      <button type="button" class="filter-btn" onclick="setFiltro('ativos', this)">Ativos</button>
      <button type="button" class="filter-btn" onclick="setFiltro('inativos', this)">Inativos</button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" class="search-input" id="searchInput" placeholder="Buscar campo ou apelido..." autoComplete="off" oninput="filtrarLocal()"/>
    </div>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-id">ID</th>
          <th class="col-ordem">Ordem</th>
          <th>Tabela</th>
          <th>Campo</th>
          <th>Apelido</th>
          <th>Tipo</th>
          <th>Status</th>
          <th>Obrig.</th>
          <th class="col-acoes">Ações</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <h2 id="modalTitulo">Novo <span>campo</span></h2>
    <input type="hidden" id="fId"/>

    <div class="form-grid2">
      <div class="form-row">
        <label for="fTabela">Tabela</label>
        <input type="text" id="fTabela" value="produto" autoComplete="off"/>
      </div>
      <div class="form-row">
        <label for="fNomeCampo">Nome do campo</label>
        <input type="text" id="fNomeCampo" placeholder="ex: vlr_venda" autoComplete="off"/>
      </div>
    </div>

    <div class="form-row">
      <label for="fApelido">Apelido (nome amigável)</label>
      <input type="text" id="fApelido" placeholder="ex: Valor de venda" autoComplete="off"/>
    </div>

    <div class="form-grid2">
      <div class="form-row">
        <label for="fTipo">Tipo</label>
        <select id="fTipo">
          <option value="texto">texto</option>
          <option value="numero">numero</option>
          <option value="decimal">decimal</option>
          <option value="data">data</option>
        </select>
      </div>
      <div class="form-row">
        <label for="fOrdem">Ordem</label>
        <input type="number" id="fOrdem" value="0" min="0"/>
      </div>
    </div>

    <div class="toggle-row">
      <label class="toggle-item">
        <input type="checkbox" id="fObrigatorio"/>
        <span>Obrigatório</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="fExcluido"/>
        <span>Inativo (excluído)</span>
      </label>
    </div>

    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-footer">
      <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button type="button" class="btn-salvar" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const _token = sessionStorage.getItem('token') || localStorage.getItem('token') || '';
  if (!_token) {
    try { window.top.location.href = '/login.html?_=' + Date.now(); } catch (_) { window.location.href = '/login.html?_=' + Date.now(); }
  }

  function apiGet(url) {
    return fetch(url, { headers: { 'Authorization': 'Bearer ' + _token } });
  }
  function apiPost(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _token },
      body: JSON.stringify(body)
    });
  }
  async function apiHandle401(r) {
    if (r.status === 401) {
      try { window.top.location.href = '/login.html?_=' + Date.now(); } catch (_) { window.location.href = '/login.html?_=' + Date.now(); }
      return true;
    }
    return false;
  }

  let todosOsCampos = [];
  let filtroAtual = 'todos';

  async function carregar() {
    const tabela = document.getElementById('tabelaSelect').value;
    const r = await apiGet('/api/importacao-precos/campos-importacao?tabela=' + encodeURIComponent(tabela) + '&filtro=' + encodeURIComponent(filtroAtual));
    if (await apiHandle401(r)) return;
    const d = await r.json();
    if (!d.ok) { showToast(d.msg || 'Erro ao carregar.', 'erro'); return; }
    todosOsCampos = d.campos || [];
    renderStats(todosOsCampos);
    renderTabela(todosOsCampos);
    await carregarTabelasSelect();
  }

  async function carregarTabelasSelect() {
    const r = await apiGet('/api/importacao-precos/campos-tabelas');
    if (await apiHandle401(r)) return;
    const d = await r.json();
    if (!d.ok || !d.tabelas || !d.tabelas.length) return;
    const sel = document.getElementById('tabelaSelect');
    const atual = sel.value;
    sel.innerHTML = '';
    d.tabelas.forEach((t) => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      if (t === atual) opt.selected = true;
      sel.appendChild(opt);
    });
    if (![...sel.options].some((o) => o.value === atual)) {
      const opt = document.createElement('option');
      opt.value = atual; opt.textContent = atual; opt.selected = true;
      sel.appendChild(opt);
    }
  }

  function setFiltro(f, btn) {
    filtroAtual = f;
    document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    carregar();
  }

  function filtrarLocal() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) { renderTabela(todosOsCampos); return; }
    const filtrados = todosOsCampos.filter((c) =>
      String(c.nome_campo || '').toLowerCase().includes(q) ||
      String(c.apelido || '').toLowerCase().includes(q)
    );
    renderTabela(filtrados, q);
  }

  function renderStats(campos) {
    const ativos = campos.filter((c) => c.excluido === 'N').length;
    const inativos = campos.filter((c) => c.excluido === 'S').length;
    const obrig = campos.filter((c) => c.obrigatorio === 'S').length;
    document.getElementById('statsBar').innerHTML = `
      <div class="stat"><div class="stat-val">${campos.length}</div><div class="stat-lbl">TOTAL</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--success)">${ativos}</div><div class="stat-lbl">ATIVOS</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--danger)">${inativos}</div><div class="stat-lbl">INATIVOS</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--warn)">${obrig}</div><div class="stat-lbl">OBRIGATÓRIOS</div></div>`;
  }

  function renderTabela(campos, q = '') {
    const tbody = document.getElementById('tableBody');
    if (!campos.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Nenhum campo encontrado.</td></tr>';
      return;
    }
    tbody.innerHTML = campos.map((c) => `
      <tr class="${c.excluido === 'S' ? 'inativo' : ''}">
        <td class="col-id">${c.id}</td>
        <td class="col-ordem">${c.ordem}</td>
        <td><span style="color:var(--text2)">${esc(c.tabela)}</span></td>
        <td style="color:var(--accent-hover)">${q ? hl(c.nome_campo, q) : esc(c.nome_campo)}</td>
        <td>${q ? hl(c.apelido, q) : esc(c.apelido)}</td>
        <td><span class="badge badge-tipo">${esc(c.tipo)}</span></td>
        <td><span class="badge ${c.excluido === 'N' ? 'badge-ativo' : 'badge-inativo'}">${c.excluido === 'N' ? 'ATIVO' : 'INATIVO'}</span></td>
        <td>${c.obrigatorio === 'S' ? '<span class="badge badge-obrig">SIM</span>' : '<span style="color:var(--text2);font-size:11px">Não</span>'}</td>
        <td class="col-acoes">
          <button type="button" class="btn-action" onclick="editarCampo(${c.id})" title="Editar">✏️</button>
          <button type="button" class="btn-action ${c.excluido === 'N' ? 'toggle-on' : 'toggle-off'}" onclick="toggleExcluido(${c.id})" title="Ativar/desativar">${c.excluido === 'N' ? '✔' : '✘'}</button>
          <button type="button" class="btn-action danger" onclick="deletar(${c.id})" title="Remover">🗑</button>
        </td>
      </tr>`).join('');
  }

  function abrirModal(campo = null) {
    document.getElementById('modalMsg').className = 'modal-msg';
    document.getElementById('modalMsg').textContent = '';
    document.getElementById('modalTitulo').innerHTML = campo ? 'Editar <span>campo</span>' : 'Novo <span>campo</span>';
    document.getElementById('fId').value = campo?.id ?? '';
    document.getElementById('fTabela').value = campo?.tabela ?? document.getElementById('tabelaSelect').value;
    document.getElementById('fNomeCampo').value = campo?.nome_campo ?? '';
    document.getElementById('fApelido').value = campo?.apelido ?? '';
    document.getElementById('fTipo').value = campo?.tipo ?? 'texto';
    document.getElementById('fOrdem').value = campo?.ordem ?? 0;
    document.getElementById('fObrigatorio').checked = campo?.obrigatorio === 'S';
    document.getElementById('fExcluido').checked = campo?.excluido === 'S';
    document.getElementById('overlay').classList.add('open');
    document.getElementById('fNomeCampo').focus();
  }

  function fecharModal() {
    document.getElementById('overlay').classList.remove('open');
  }

  document.getElementById('overlay').addEventListener('click', (e) => {
    if (e.target.id === 'overlay') fecharModal();
  });

  function editarCampo(id) {
    const campo = todosOsCampos.find((c) => c.id == id);
    if (campo) abrirModal(campo);
  }

  async function salvar() {
    const idVal = document.getElementById('fId').value;
    const body = {
      id: idVal ? parseInt(idVal, 10) : null,
      tabela: document.getElementById('fTabela').value,
      nome_campo: document.getElementById('fNomeCampo').value,
      apelido: document.getElementById('fApelido').value,
      tipo: document.getElementById('fTipo').value,
      ordem: document.getElementById('fOrdem').value,
      obrigatorio: document.getElementById('fObrigatorio').checked ? 'S' : 'N',
      excluido: document.getElementById('fExcluido').checked ? 'S' : 'N'
    };
    const msgEl = document.getElementById('modalMsg');
    msgEl.textContent = 'Salvando…';
    msgEl.className = 'modal-msg ok';

    const r = await apiPost('/api/importacao-precos/campos-salvar', body);
    if (await apiHandle401(r)) return;
    const d = await r.json();
    if (d.ok) {
      msgEl.textContent = d.msg || 'Salvo.';
      setTimeout(() => { fecharModal(); carregar(); }, 600);
    } else {
      msgEl.textContent = d.msg || 'Erro ao salvar.';
      msgEl.className = 'modal-msg erro';
    }
  }

  async function toggleExcluido(id) {
    const r = await apiPost('/api/importacao-precos/campos-toggle-excluido', { id });
    if (await apiHandle401(r)) return;
    const d = await r.json();
    if (d.ok) {
      showToast(d.excluido === 'S' ? 'Campo desativado.' : 'Campo ativado.', 'ok');
      carregar();
    } else showToast(d.msg || 'Erro.', 'erro');
  }

  async function deletar(id) {
    const campo = todosOsCampos.find((c) => c.id == id);
    if (!confirm('Remover permanentemente o campo "' + (campo?.apelido || id) + '"?')) return;
    const r = await apiPost('/api/importacao-precos/campos-deletar', { id });
    if (await apiHandle401(r)) return;
    const d = await r.json();
    showToast(d.msg || (d.ok ? 'Removido.' : 'Erro.'), d.ok ? 'ok' : 'erro');
    if (d.ok) carregar();
  }

  function showToast(msg, tipo) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + tipo;
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function hl(text, q) {
    const safe = esc(text);
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return safe.replace(re, (m) => '<mark>' + m + '</mark>');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') fecharModal();
    if (e.ctrlKey && e.key === 'Enter' && document.getElementById('overlay').classList.contains('open')) salvar();
  });

  // Pre-seleciona tabela via ?tabela= na URL
  (function preSelectTabela() {
    const params = new URLSearchParams(window.location.search);
    const t = params.get('tabela');
    if (t) {
      const sel = document.getElementById('tabelaSelect');
      // tenta setar agora; se a opção ainda não existe, insere como fallback
      let found = [...sel.options].some(o => o.value === t);
      if (!found) {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t; opt.selected = true;
        sel.appendChild(opt);
      } else {
        sel.value = t;
      }
    }
  })();

  carregar();
</script>
</body>
</html>
