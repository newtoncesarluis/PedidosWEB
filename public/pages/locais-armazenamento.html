<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locais de Armazenamento | Administrativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/index.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --success-color: #2ec4b6;
      --bg-light: #f8f9fa;
    }
    body { background-color: var(--bg-light); font-family: 'Inter', sans-serif; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .btn-primary { background-color: var(--primary-color); border: none; padding: 10px 20px; border-radius: 8px; }
    .btn-success { background-color: var(--success-color); border: none; }
    .badge-active { background-color: rgba(46, 196, 182, 0.1); color: var(--success-color); border: 1px solid var(--success-color); }
    .badge-inactive { background-color: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid #e74c3c; }
    .action-btn { cursor: pointer; transition: transform 0.2s; }
    .action-btn:hover { transform: scale(1.1); }
  </style>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
</head>
<body>
  <div class="container-fluid py-4">
    <div class="row mb-4 align-items-center">
      <div class="col-6">
        <h1 class="h3 mb-0 text-gray-800 fw-bold">Locais de Armazenamento</h1>
        <p class="text-muted mb-0">Gerencie almoxarifados, estoques e áreas de depósito.</p>
      </div>
      <div class="col-6 text-end">
        <button id="btnNovo" class="btn btn-primary shadow-sm" style="display:none;">
          <i class="bi bi-plus-lg me-2"></i> Novo Local
        </button>
        <!-- ★ Card View toggle -->
        <div class="cv-view-toggle" id="cvToggle" style="vertical-align:middle;margin-left:8px">
          <button type="button" class="cv-vt-btn active" id="cvBtnTable" title="Tabela">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <button type="button" class="cv-vt-btn" id="cvBtnCards" title="Cards">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="table-responsive" id="cvTableResponsive">
          <table id="tabelaLocais" class="table table-hover align-middle" style="width:100%">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Tipo</th>
                <th>Status</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <!-- ★ Card View grid -->
        <div id="cvCardsGrid" class="cv-cards-grid" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- Modal Cadastro -->
  <div class="modal fade" id="modalLocal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-light p-4">
          <h5 class="modal-title fw-bold" id="modalTitulo">Novo Local de Armazenamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formLocal">
          <div class="modal-body p-4">
            <input type="hidden" id="idLocal">
            
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Nome do Local <span class="text-danger">*</span></label>
                <input type="text" id="descricao" class="form-control" required placeholder="Ex: Almoxarifado Central, Galpão A">
              </div>
              
              <div class="col-md-6">
                <label class="form-label fw-semibold">Tipo / Classificação</label>
                <input type="text" id="tipo" class="form-control" placeholder="Ex: Matéria Prima, Acabado">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Status</label>
                <select id="status" class="form-select">
                  <option value="A">ATIVO</option>
                  <option value="I">INATIVO</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer bg-light p-3">
            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 shadow-sm">Salvar Registro</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- ★ Card View (CSS apenas — a integração com DataTables é inline abaixo) -->
  <link rel="stylesheet" href="/assets/card-view.css">

  <script>
    let tabela;
    let permissoes = {};

    $(document).ready(async function() {
      await carregarPermissoes();
      inicializarTabela();
      
      $('#btnNovo').click(() => {
        $('#formLocal')[0].reset();
        $('#idLocal').val('');
        $('#modalTitulo').text('Novo Local de Armazenamento');
        new bootstrap.Modal('#modalLocal').show();
      });

      $('#formLocal').submit(salvarLocal);
    });

    async function carregarPermissoes() {
      try {
        const res = await fetch('/api/check-permissions?modulo=locais_armazenamento');
        permissoes = await res.json();
        if (permissoes.incluir === 'S') $('#btnNovo').show();
      } catch (err) { console.error('Erro ao carregar permissões', err); }
    }

    function inicializarTabela() {
      tabela = $('#tabelaLocais').DataTable({
        ajax: { url: '/api/locais-armazenamento', dataSrc: 'locais' },
        columns: [
          { data: 'id' },
          { data: 'descricao' },
          { data: 'tipo', render: v => v || '<span class="text-muted italic">Não definido</span>' },
          { data: 'status', render: v => `<span class="badge ${v === 'A' ? 'badge-active' : 'badge-inactive'}">${v === 'A' ? 'ATIVO' : 'INATIVO'}</span>` },
          { 
            data: null, 
            className: 'text-center',
            render: row => {
              let btns = '';
              if (permissoes.alterar === 'S') {
                btns += `<i class="bi bi-pencil-square text-primary action-btn me-3" onclick="editarLocal(${row.id})" title="Editar"></i>`;
              }
              if (permissoes.excluir === 'S') {
                btns += `<i class="bi bi-trash text-danger action-btn" onclick="excluirLocal(${row.id})" title="Excluir"></i>`;
              }
              return btns || '<span class="text-muted">-</span>';
            }
          }
        ],
        language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json' },
        order: [[1, 'asc']]
      });
    }

    async function salvarLocal(e) {
      e.preventDefault();
      const id = $('#idLocal').val();
      const dados = {
        descricao: $('#descricao').val(),
        tipo: $('#tipo').val(),
        status: $('#status').val()
      };

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/locais-armazenamento/${id}` : '/api/locais-armazenamento';
        
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        if (res.ok) {
          bootstrap.Modal.getInstance('#modalLocal').hide();
          tabela.ajax.reload();
          Swal.fire('Sucesso!', `Local de armazenamento ${id ? 'atualizado' : 'cadastrado'} com sucesso.`, 'success');
        }
      } catch (err) { Swal.fire('Erro', 'Não foi possível salvar os dados.', 'error'); }
    }

    function editarLocal(id) {
      const loc = tabela.rows().data().toArray().find(l => l.id === id);
      if (loc) {
        $('#idLocal').val(loc.id);
        $('#descricao').val(loc.descricao);
        $('#tipo').val(loc.tipo);
        $('#status').val(loc.status);
        $('#modalTitulo').text('Editar Local de Armazenamento');
        new bootstrap.Modal('#modalLocal').show();
      }
    }

    function excluirLocal(id) {
      Swal.fire({
        title: 'Tem certeza?',
        text: "Este local será marcado como excluído!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
      }).then(async (result) => {
        if (result.isConfirmed) {
          const res = await fetch(`/api/locais-armazenamento/${id}`, { method: 'DELETE' });
          if (res.ok) {
            tabela.ajax.reload();
            Swal.fire('Excluído!', 'O registro foi removido.', 'success');
          }
        }
      });
    }

    /* ★ Card View — integração one-off com DataTables */
    (function(){
      const KEY  = 'cv-mode:' + location.pathname;
      let mode   = localStorage.getItem(KEY) || 'table';
      const btnT = document.getElementById('cvBtnTable');
      const btnC = document.getElementById('cvBtnCards');
      const tw   = document.getElementById('cvTableResponsive');
      const cg   = document.getElementById('cvCardsGrid');

      function avatarClass(s) {
        const c = (String(s || '?')[0]).toUpperCase();
        if (/[A-Z]/.test(c)) return 'cv-av-' + c;
        if (/[0-9]/.test(c)) return 'cv-av-NUM';
        return 'cv-av-A';
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
          { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
        ));
      }

      function renderCards() {
        if (!tabela) return;
        const rows = tabela.rows({ search:'applied' }).data().toArray();
        if (!rows.length) {
          cg.innerHTML = '<div class="cv-empty">Nenhum registro encontrado</div>';
          return;
        }
        cg.innerHTML = rows.map(r => {
          const desc  = r.descricao || '';
          const ini   = (desc[0] || '?').toUpperCase();
          const ativo = r.status === 'A';
          const canE  = permissoes.alterar === 'S';
          const canD  = permissoes.excluir === 'S';
          return `<div class="cv-card" data-id="${r.id}">
            <div class="cv-card-head">
              <div class="cv-avatar ${avatarClass(desc)}">${esc(ini)}</div>
              <div class="cv-card-head-text">
                <div class="cv-card-title"><span>${esc(desc)}</span></div>
                ${r.tipo ? `<div class="cv-card-sub">${esc(r.tipo)}</div>` : ''}
              </div>
            </div>
            <div class="cv-card-body">
              <div class="cv-card-row"><span class="cv-val">Código #${esc(r.id)}</span></div>
            </div>
            <div class="cv-card-foot">
              <div class="cv-card-foot-left">
                <span class="cv-badge cv-badge-${ativo ? 'success' : 'neutral'}">${ativo ? 'Ativo' : 'Inativo'}</span>
              </div>
              <div class="cv-card-foot-right">
                ${canE ? '<button class="cv-card-action" data-edit title="Editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>' : ''}
                ${canD ? '<button class="cv-card-action" data-del  title="Excluir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' : ''}
              </div>
            </div>
          </div>`;
        }).join('');

        cg.querySelectorAll('.cv-card').forEach(el => {
          const id = parseInt(el.dataset.id, 10);
          el.addEventListener('click', e => {
            if (e.target.closest('[data-edit]')) { editarLocal(id); return; }
            if (e.target.closest('[data-del]'))  { excluirLocal(id); return; }
            if (permissoes.alterar === 'S') editarLocal(id);
          });
        });
      }

      function applyMode() {
        const cards = mode === 'cards';
        tw.style.display = cards ? 'none' : '';
        cg.style.display = cards ? '' : 'none';
        btnT.classList.toggle('active', !cards);
        btnC.classList.toggle('active', cards);
        if (cards) renderCards();
      }

      btnT.addEventListener('click', () => { mode = 'table'; localStorage.setItem(KEY, 'table'); applyMode(); });
      btnC.addEventListener('click', () => { mode = 'cards'; localStorage.setItem(KEY, 'cards'); applyMode(); });

      // DataTables: rerender cards a cada draw (search/sort/pagination/reload)
      $(document).on('init.dt draw.dt', '#tabelaLocais', () => { if (mode === 'cards') renderCards(); });
      $(document).on('init.dt', '#tabelaLocais', applyMode);
    })();
  </script>
</body>
</html>
