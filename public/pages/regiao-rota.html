<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Regiões e Rotas</title>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:var(--content-bg);--card:var(--card-bg);--border:var(--card-border);
  --text:var(--content-text);--text2:var(--text2);--accent:var(--accent);
  --accent-hover:var(--accent-hover);--danger:#ef4444;--warn:#f59e0b;--success:#22c55e;
  --input-bg:var(--card-bg);
}
body{font-family:var(--font,'Inter',sans-serif);background:var(--bg);color:var(--text);min-height:100vh}

/* TOOLBAR */
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;
  box-shadow:0 4px 12px rgba(0,0,0,.04)}
.toolbar-title{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.sep{width:1px;height:28px;background:var(--border);flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:8px;
  font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border:1.5px solid var(--accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-outline{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn-outline:hover{filter:brightness(.95)}
.btn-danger{background:#ef4444;color:#fff;border:1.5px solid #ef4444}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-icon{padding:6px;border-radius:7px}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--input-bg);
  color:var(--text);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;
  width:100%;transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:280px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text2)}
.search-wrap input{padding-left:32px}

/* CONTENT */
.content{padding:24px}

/* STATS BAR */
.stats-bar{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;flex:1;min-width:140px}
.stat-card .label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.stat-card .value{font-size:26px;font-weight:800;margin-top:4px}
.stat-card .sub{font-size:11px;color:var(--text2);margin-top:2px}

/* TABLE */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.table-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.table-header h2{font-size:14px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;
  padding:10px 16px;text-align:left;border-bottom:1px solid var(--border)}
td{font-size:13px;padding:12px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-soft,rgba(14,165,233,.05))}

/* STATUS BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-ativo{background:#dcfce7;color:#15803d}
.badge-inativo{background:#fee2e2;color:#b91c1c}

/* COR SWATCH */
.cor-swatch{width:20px;height:20px;border-radius:6px;display:inline-block;border:2px solid rgba(0,0,0,.1)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:16px;padding:28px;width:100%;max-width:520px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--border);max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:800;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* CLIENTES PANEL */
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:20px;display:none}
.panel.open{display:block}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-header h3{font-size:14px;font-weight:700}

/* STATUS FILTER */
.filter-tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px}
.filter-tab{padding:5px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;
  background:transparent;color:var(--text2);transition:.15s;font-family:inherit}
.filter-tab.active{background:var(--accent);color:#fff}

/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty svg{width:48px;height:48px;opacity:.3;margin-bottom:12px}
.empty p{font-size:13px}

/* LOADER */
.loader{display:flex;align-items:center;justify-content:center;padding:32px}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <span class="toolbar-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;vertical-align:-3px;margin-right:4px">
      <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
    </svg>
    Regiões e Rotas
  </span>
  <div class="sep"></div>
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFiltroStatus('A',this)">Ativas</button>
    <button class="filter-tab" onclick="setFiltroStatus('I',this)">Inativas</button>
    <button class="filter-tab" onclick="setFiltroStatus('',this)">Todas</button>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="inpBusca" placeholder="Buscar região..." oninput="debounceCarregar()" autocomplete="off">
  </div>
  <div style="flex:1"></div>
  <button class="btn btn-outline btn-sm" onclick="abrirPainelClientes()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/></svg>
    Clientes da Região
  </button>
  <button class="btn btn-primary" onclick="abrirModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Nova Região
  </button>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="label">Regiões Ativas</div>
      <div class="value" id="statAtivos">—</div>
      <div class="sub">cadastradas</div>
    </div>
    <div class="stat-card">
      <div class="label">Inativas</div>
      <div class="value" id="statInativos">—</div>
      <div class="sub">inativas</div>
    </div>
    <div class="stat-card">
      <div class="label">Total</div>
      <div class="value" id="statTotal">—</div>
      <div class="sub">regiões</div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <div class="table-header">
      <h2>Regiões Cadastradas</h2>
      <span id="lblTotal" style="font-size:12px;color:var(--text2)"></span>
    </div>
    <div id="tableBody">
      <div class="loader"><div class="spin"></div></div>
    </div>
  </div>

  <!-- PAINEL CLIENTES DA REGIÃO -->
  <div id="painelClientes" class="panel">
    <div class="panel-header">
      <h3 id="painelTitle">Clientes da Região</h3>
      <button class="btn btn-sm btn-outline" onclick="fecharPainelClientes()">Fechar</button>
    </div>
    <div class="search-wrap" style="max-width:300px;margin-bottom:12px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="inpBuscaCliente" placeholder="Buscar cliente..." oninput="debounceClientes()" autocomplete="off">
    </div>
    <div id="tabelaClientes">
      <div class="loader"><div class="spin"></div></div>
    </div>
  </div>
</div>

<!-- MODAL REGIÃO -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <h2 id="modalTitulo">Nova Região</h2>
    <form onsubmit="salvar(event)">
      <div class="form-grid">
        <div class="form-group full">
          <label>Descrição *</label>
          <input id="fDescricao" required autocomplete="off" placeholder="Nome da região">
        </div>
        <div class="form-group">
          <label>Sigla</label>
          <input id="fSigla" maxlength="10" autocomplete="off" placeholder="Ex: NE">
        </div>
        <div class="form-group">
          <label>Distância (km)</label>
          <input id="fDistancia" type="number" step="0.001" min="0" placeholder="0.000">
        </div>
        <div class="form-group">
          <label>Cor</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input type="color" id="fCor" value="#3b82f6" style="width:48px;height:38px;padding:2px;cursor:pointer">
            <input id="fCorHex" placeholder="#3b82f6" maxlength="7" oninput="syncColorHex(this.value)" style="flex:1">
          </div>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="fStatus">
            <option value="A">Ativa</option>
            <option value="I">Inativa</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Vendedor Padrão</label>
          <select id="fVendedor">
            <option value="">— Nenhum —</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Observação</label>
          <textarea id="fObs" rows="2" placeholder="Observações sobre a região..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnSalvar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
          Salvar
        </button>
      </div>
    </form>
  </div>
</div>

<script>
function token() {
  return sessionStorage.getItem('token') || localStorage.getItem('token') || '';
}

function _tratarErroApiRegiao(r, data) {
  if (r.status === 401) {
    const msg = (data && data.error) ? data.error : 'Sessão expirada. Faça login novamente.';
    alert(msg);
    setTimeout(() => { (window.top || window).location.href = '/login.html'; }, 600);
    return true;
  }
  return false;
}

async function api(url, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  const t = token();
  if (t && !headers.Authorization) headers.Authorization = 'Bearer ' + t;
  const r = await fetch(url, { ...opts, headers, credentials: 'include' });
  const txt = await r.text();
  let data = {};
  try { data = txt ? JSON.parse(txt) : {}; } catch { data = { error: txt || r.statusText }; }
  if (!r.ok) {
    if (_tratarErroApiRegiao(r, data)) throw new Error(data.error || 'Sessão expirada');
    throw new Error(data.error || txt || `Erro ${r.status}`);
  }
  return data;
}

let filtroStatus='A', _timerBusca, _timerCliente, editId=null, regiaoSelecionada=null;

function setFiltroStatus(s, btn){
  filtroStatus=s;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  carregar();
}

function debounceCarregar(){ clearTimeout(_timerBusca); _timerBusca=setTimeout(carregar,350); }
function debounceClientes(){ clearTimeout(_timerCliente); _timerCliente=setTimeout(()=>carregarClientes(regiaoSelecionada),350); }

async function carregar(){
  const q=document.getElementById('inpBusca').value;
  document.getElementById('tableBody').innerHTML='<div class="loader"><div class="spin"></div></div>';
  try {
    const d=await api(`/api/regiao-rota?q=${encodeURIComponent(q)}&status=${filtroStatus}`);
    document.getElementById('lblTotal').textContent=`${d.total} registro(s)`;
    renderTabela(d.regioes);
  } catch(e){ document.getElementById('tableBody').innerHTML=`<div class="empty"><p>${e.message}</p></div>`; }
}

function renderTabela(rows){
  if(!rows.length){
    document.getElementById('tableBody').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg><p>Nenhuma região encontrada.</p></div>';
    return;
  }
  const html=`<table><thead><tr>
    <th>Cor</th><th>Descrição</th><th>Sigla</th><th>Distância</th>
    <th>Clientes</th><th>Vendedor Padrão</th><th>Status</th><th>Ações</th>
  </tr></thead><tbody>${rows.map(r=>`<tr>
    <td><span class="cor-swatch" style="background:${r.cor||'#3b82f6'}"></span></td>
    <td><strong>${r.descricao}</strong></td>
    <td>${r.sigla||'—'}</td>
    <td>${r.distancia?Number(r.distancia).toFixed(0)+' km':'—'}</td>
    <td><a href="#" onclick="abrirClientesDaRegiao(${r.id},'${escHtml(r.descricao)}');return false" style="color:var(--accent);font-weight:600">${r.total_clientes||0} cliente(s)</a></td>
    <td>${r.nome_vendedor_padrao||'—'}</td>
    <td><span class="badge ${r.status==='A'||!r.status?'badge-ativo':'badge-inativo'}">${r.status==='A'||!r.status?'Ativa':'Inativa'}</span></td>
    <td>
      <div style="display:flex;gap:6px">
        ${(typeof podeAlterarCad === 'function' ? podeAlterarCad() : true) ? `<button class="btn btn-sm btn-outline btn-icon" title="Editar" onclick="editar(${r.id})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        </button>` : ''}
        ${(typeof podeExcluirCad === 'function' ? podeExcluirCad() : true) ? `<button class="btn btn-sm btn-danger btn-icon" title="Excluir" onclick="excluir(${r.id},'${escHtml(r.descricao)}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>` : ''}
      </div>
    </td>
  </tr>`).join('')}</tbody></table>`;
  document.getElementById('tableBody').innerHTML=html;
}

function escHtml(s){ return String(s||'').replace(/'/g,"\\'"); }

async function carregarStats(){
  try {
    const d=await api('/api/regiao-rota/notificacoes');
    document.getElementById('statAtivos').textContent=d.ativos;
    document.getElementById('statInativos').textContent=d.inativos;
    document.getElementById('statTotal').textContent=d.ativos+d.inativos;
  } catch(e){}
}

async function carregarVendedores(){
  try {
    const d=await api('/api/vendedores');
    const sel=document.getElementById('fVendedor');
    (d.vendedores||[]).forEach(v=>{
      const o=document.createElement('option');
      o.value=v.id; o.textContent=v.nome;
      sel.appendChild(o);
    });
  } catch(e){}
}

function abrirModal(id=null){
  if (!id && !guardCadIncluir('Sem permissão para incluir regiões')) return;
  editId=id;
  document.getElementById('modalTitulo').textContent=id?'Editar Região':'Nova Região';
  document.getElementById('fDescricao').value='';
  document.getElementById('fSigla').value='';
  document.getElementById('fDistancia').value='';
  document.getElementById('fCor').value='#3b82f6';
  document.getElementById('fCorHex').value='#3b82f6';
  document.getElementById('fStatus').value='A';
  document.getElementById('fVendedor').value='';
  document.getElementById('fObs').value='';
  document.getElementById('modalOverlay').classList.add('open');
  if(id) carregarParaEdicao(id);
  else document.getElementById('fDescricao').focus();
}

async function carregarParaEdicao(id){
  try {
    const d=await api(`/api/regiao-rota/${id}`);
    document.getElementById('fDescricao').value=d.descricao||'';
    document.getElementById('fSigla').value=d.sigla||'';
    document.getElementById('fDistancia').value=d.distancia||'';
    document.getElementById('fCor').value=d.cor||'#3b82f6';
    document.getElementById('fCorHex').value=d.cor||'#3b82f6';
    document.getElementById('fStatus').value=d.status||'A';
    document.getElementById('fVendedor').value=d.id_vendedor_padrao||'';
    document.getElementById('fObs').value=d.observacao||'';
    if (!podeAlterarCad()) aplicarFormSomenteLeituraCad(document.getElementById('modalOverlay'));
  } catch(e){ alert('Erro ao carregar: '+e.message); }
}

function fecharModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

function syncColorHex(v){
  if(/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('fCor').value=v;
}
document.getElementById('fCor').addEventListener('input',function(){ document.getElementById('fCorHex').value=this.value; });

async function salvar(e){
  e.preventDefault();
  if (!guardCadSalvar(!!editId, 'Sem permissão para incluir regiões', 'Sem permissão para alterar regiões')) return;
  const btn=document.getElementById('btnSalvar');
  btn.disabled=true;
  const body={
    descricao: document.getElementById('fDescricao').value.trim(),
    sigla: document.getElementById('fSigla').value.trim(),
    distancia: document.getElementById('fDistancia').value||0,
    cor: document.getElementById('fCor').value,
    status: document.getElementById('fStatus').value,
    id_vendedor_padrao: document.getElementById('fVendedor').value||null,
    observacao: document.getElementById('fObs').value.trim()||null,
  };
  try {
    if(editId) await api(`/api/regiao-rota/${editId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    else await api('/api/regiao-rota',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    fecharModal();
    await carregar();
    await carregarStats();
  } catch(err){ alert('Erro ao salvar: '+err.message); }
  finally{ btn.disabled=false; }
}

async function editar(id){ abrirModal(id); }

async function excluir(id, nome){
  if (!guardCadExcluir('Sem permissão para excluir regiões')) return;
  if(!confirm(`Excluir a região "${nome}"?`)) return;
  try {
    await api(`/api/regiao-rota/${id}`,{method:'DELETE'});
    await carregar(); await carregarStats();
  } catch(e){ alert('Erro ao excluir: '+e.message); }
}

// ─── Painel de clientes da região ────────────────────────────────────────────
function abrirPainelClientes(){
  if(!regiaoSelecionada){ alert('Selecione uma região na tabela primeiro.'); return; }
  document.getElementById('painelClientes').classList.add('open');
}

function abrirClientesDaRegiao(id, nome){
  regiaoSelecionada=id;
  document.getElementById('painelTitle').textContent=`Clientes — ${nome}`;
  document.getElementById('painelClientes').classList.add('open');
  document.getElementById('inpBuscaCliente').value='';
  carregarClientes(id);
  document.getElementById('painelClientes').scrollIntoView({behavior:'smooth'});
}

function fecharPainelClientes(){ document.getElementById('painelClientes').classList.remove('open'); }

async function carregarClientes(id){
  if(!id) return;
  const q=document.getElementById('inpBuscaCliente').value;
  document.getElementById('tabelaClientes').innerHTML='<div class="loader"><div class="spin"></div></div>';
  try {
    const d=await api(`/api/regiao-rota/${id}/clientes?q=${encodeURIComponent(q)}&limit=200`);
    if(!d.clientes.length){
      document.getElementById('tabelaClientes').innerHTML='<div class="empty"><p>Nenhum cliente nesta região.</p></div>';
      return;
    }
    const html=`<table><thead><tr>
      <th>Cliente</th><th>Cidade/UF</th><th>Telefone</th><th>Última Compra</th><th>Dias Sem Compra</th>
    </tr></thead><tbody>${d.clientes.map(c=>{
      const risco=c.dias_sem_compra>180?'color:#ef4444':c.dias_sem_compra>90?'color:#f59e0b':'color:#22c55e';
      return `<tr>
        <td><strong>${c.nome}</strong>${c.apelido?`<br><small style="color:var(--text2)">${c.apelido}</small>`:''}</td>
        <td>${c.cidade||''}${c.uf?'/'+c.uf:''}</td>
        <td>${c.foneprincipal||'—'}</td>
        <td>${c.dtultimacompra?new Date(c.dtultimacompra).toLocaleDateString('pt-BR'):'Nunca'}</td>
        <td style="${risco};font-weight:700">${c.dias_sem_compra!=null?c.dias_sem_compra+'d':'—'}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
    document.getElementById('tabelaClientes').innerHTML=html;
  } catch(e){ document.getElementById('tabelaClientes').innerHTML=`<div class="empty"><p>${e.message}</p></div>`; }
}

document.addEventListener('cad-perm-ready', () => {
  carregar();
  carregarVendedores();
  carregarStats();
  if (typeof aplicarUiPermissoesCad === 'function') aplicarUiPermissoesCad();
});
</script>
<script src="/assets/cadastros-permissao.js"></script>
