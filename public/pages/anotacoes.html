<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anotações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font,'Inter','Segoe UI',sans-serif);background:var(--content-bg);color:var(--content-text)}
.toolbar{position:sticky;top:0;z-index:20;background:var(--card-bg);border-bottom:1px solid var(--card-border);padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.title-wrap{margin-right:auto}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);font-weight:800}
h1{margin:2px 0 0;font-size:20px;line-height:1.1}
.search{height:36px;border:1.5px solid var(--card-border);border-radius:10px;padding:0 12px;background:var(--content-bg);color:var(--content-text);font:inherit;font-size:13px;outline:none;min-width:200px}
.search:focus{border-color:var(--accent)}
.btn{height:36px;border:none;border-radius:10px;padding:0 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--content-bg);color:var(--content-text);border:1.5px solid var(--card-border)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Form inline */
.form-panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:16px 18px;margin:18px 20px 0;display:none}
.form-panel.open{display:block}
.form-title{font-size:14px;font-weight:900;margin-bottom:12px}
.form-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;text-transform:uppercase;color:var(--text2);font-weight:800;letter-spacing:.6px}
.field input,.field textarea,.field select{border:1.5px solid var(--card-border);border-radius:9px;padding:7px 10px;background:var(--content-bg);color:var(--content-text);font:inherit;font-size:13px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:72px}
.form-sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:18px 20px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.card.fixado{border-top:3px solid var(--accent)}
.card-head{display:flex;align-items:flex-start;gap:8px}
.card-titulo{font-size:14px;font-weight:800;flex:1;min-width:0;word-break:break-word}
.card-menu{position:relative}
.card-menu-btn{height:26px;width:26px;border:none;border-radius:7px;background:transparent;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-menu-btn:hover{background:var(--content-bg)}
.dropdown{position:absolute;right:0;top:28px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:130px;z-index:100;padding:4px 0;display:none}
.dropdown.open{display:block}
.dropdown button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 14px;font:inherit;font-size:12px;color:var(--content-text);cursor:pointer}
.dropdown button:hover{background:var(--content-bg)}
.dropdown button.danger{color:#dc2626}
.card-conteudo{font-size:12px;color:var(--text2);line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:hidden;position:relative}
.card-conteudo.expanded{max-height:none}
.card-conteudo::after{content:'';position:absolute;bottom:0;left:0;right:0;height:28px;background:linear-gradient(transparent,var(--card-bg));pointer-events:none}
.card-conteudo.expanded::after{display:none}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;color:var(--text2)}
.pin{font-size:13px;cursor:pointer;user-select:none;opacity:.5}
.pin.on{opacity:1}
.cor-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}

/* Cores */
.cor-default .cor-dot{background:var(--card-border)}
.cor-amarela .cor-dot,.card.cor-amarela{--dot:#f59e0b} .cor-amarela .cor-dot{background:#f59e0b}
.card.cor-amarela{border-left:3px solid #f59e0b}
.cor-verde .cor-dot{background:#10b981} .card.cor-verde{border-left:3px solid #10b981}
.cor-vermelha .cor-dot{background:#ef4444} .card.cor-vermelha{border-left:3px solid #ef4444}
.cor-azul .cor-dot{background:#3b82f6} .card.cor-azul{border-left:3px solid #3b82f6}
.cor-roxa .cor-dot{background:#8b5cf6} .card.cor-roxa{border-left:3px solid #8b5cf6}

.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--text2);font-size:13px}
.loading-state{padding:48px;text-align:center;color:var(--text2);font-size:13px}

@media(max-width:640px){
  .form-row{grid-template-columns:1fr}.form-sub{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr;padding:12px}
  .form-panel{margin:12px}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="title-wrap">
    <div class="eyebrow">Sistema</div>
    <h1>Anotações</h1>
  </div>
  <input class="search" id="search" type="text" placeholder="Buscar anotações..." autocomplete="off">
  <button class="btn btn-primary" id="btnNova">+ Nova anotação</button>
</div>

<div class="form-panel" id="formPanel">
  <div class="form-title" id="formTitle">Nova Anotação</div>
  <input type="hidden" id="fId">
  <div class="field"><label>Título</label><input id="fTitulo" type="text" placeholder="Título da anotação" maxlength="200" autocomplete="off"></div>
  <div class="field" style="margin-top:10px"><label>Conteúdo</label><textarea id="fConteudo" placeholder="Escreva aqui..."></textarea></div>
  <div class="form-sub">
    <div class="field">
      <label>Cor</label>
      <select id="fCor">
        <option value="default">Padrão</option>
        <option value="amarela">Amarela</option>
        <option value="verde">Verde</option>
        <option value="vermelha">Vermelha</option>
        <option value="azul">Azul</option>
        <option value="roxa">Roxa</option>
      </select>
    </div>
    <div class="field" style="justify-content:flex-end;flex-direction:row;align-items:center;gap:8px">
      <input type="checkbox" id="fFixado" style="width:16px;height:16px;accent-color:var(--accent)">
      <label for="fFixado" style="font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;cursor:pointer">Fixar no topo</label>
    </div>
  </div>
  <div class="form-foot">
    <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
    <button class="btn btn-primary" id="btnSalvar">Salvar</button>
  </div>
</div>

<div id="mainState" class="loading-state">Carregando...</div>
<div id="grid" class="grid" style="display:none"></div>

<script>
function token(){ return localStorage.getItem('token') || sessionStorage.getItem('token') || ''; }
function authH(){ return { 'Content-Type':'application/json', Authorization:'Bearer '+token() }; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDt(v){
  try{
    const d = new Date(v);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch{ return String(v||''); }
}

let _q = '';
let _debounce = null;

// ── API ──────────────────────────────────────────────────────────────────────
async function apiFetch(url, opts = {}){
  const r = await fetch(url, { headers: authH(), ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.ok === false) throw new Error(data.error || 'Erro na operação');
  return data;
}

// ── Carregar ─────────────────────────────────────────────────────────────────
async function load(){
  const state = document.getElementById('mainState');
  const grid  = document.getElementById('grid');
  state.style.display = ''; state.textContent = 'Carregando...';
  grid.style.display  = 'none';
  try{
    const qs = new URLSearchParams({ limit:200 });
    if (_q) qs.set('q', _q);
    const data = await apiFetch('/api/anotacoes?' + qs);
    const rows = data.anotacoes || [];
    state.style.display = 'none';
    grid.style.display = '';
    if (!rows.length){
      grid.innerHTML = `<div class="empty">📝 Nenhuma anotação${_q ? ' encontrada' : ' ainda'}.<br><small>Clique em <strong>+ Nova anotação</strong> para criar.</small></div>`;
      return;
    }
    grid.innerHTML = rows.map(renderCard).join('');
    bindCardEvents();
  }catch(e){
    state.textContent = e.message || 'Erro ao carregar';
  }
}

function renderCard(n){
  const cor = n.cor || 'default';
  const fixClass = n.fixado ? 'fixado' : '';
  const long = (n.conteudo || '').length > 200;
  return `
  <div class="card cor-${esc(cor)} ${fixClass}" data-id="${n.id}">
    <div class="card-head">
      <div class="cor-dot"></div>
      <div class="card-titulo">${esc(n.titulo)}</div>
      <div class="card-menu">
        <button class="card-menu-btn" data-menu="${n.id}" title="Opções">⋮</button>
        <div class="dropdown" id="drop-${n.id}">
          <button onclick="editarCard(${n.id})">✏️ Editar</button>
          <button onclick="toggleFixado(${n.id},${n.fixado?0:1})">${n.fixado?'📌 Desafixar':'📌 Fixar'}</button>
          <button class="danger" onclick="excluirCard(${n.id})">🗑️ Excluir</button>
        </div>
      </div>
    </div>
    ${n.conteudo ? `<div class="card-conteudo${long?' truncated':''}" id="cont-${n.id}">${esc(n.conteudo)}</div>${long?`<button onclick="toggleExpand(${n.id})" style="font-size:11px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-align:left" id="exp-${n.id}">Ver mais</button>`:''}` : ''}
    <div class="card-foot">
      <span>${fmtDt(n.dtatualizacao)}</span>
      <span class="pin ${n.fixado?'on':''}" onclick="toggleFixado(${n.id},${n.fixado?0:1})" title="${n.fixado?'Desafixar':'Fixar'}">📌</span>
    </div>
  </div>`;
}

function bindCardEvents(){
  document.querySelectorAll('[data-menu]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.getAttribute('data-menu');
      document.querySelectorAll('.dropdown.open').forEach(d => { if (d.id !== 'drop-'+id) d.classList.remove('open'); });
      document.getElementById('drop-'+id)?.classList.toggle('open');
    });
  });
}
document.addEventListener('click', () => document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open')));

function toggleExpand(id){
  const el = document.getElementById('cont-'+id);
  const btn = document.getElementById('exp-'+id);
  if (!el) return;
  el.classList.toggle('expanded');
  if (btn) btn.textContent = el.classList.contains('expanded') ? 'Ver menos' : 'Ver mais';
}

// ── Form ─────────────────────────────────────────────────────────────────────
function abrirForm(dados = null){
  const panel = document.getElementById('formPanel');
  document.getElementById('fId').value = dados?.id || '';
  document.getElementById('fTitulo').value = dados?.titulo || '';
  document.getElementById('fConteudo').value = dados?.conteudo || '';
  document.getElementById('fCor').value = dados?.cor || 'default';
  document.getElementById('fFixado').checked = !!dados?.fixado;
  document.getElementById('formTitle').textContent = dados ? 'Editar Anotação' : 'Nova Anotação';
  panel.classList.add('open');
  document.getElementById('fTitulo').focus();
}

function fecharForm(){
  document.getElementById('formPanel').classList.remove('open');
}

async function salvar(){
  const btn = document.getElementById('btnSalvar');
  const titulo = document.getElementById('fTitulo').value.trim();
  if (!titulo) { document.getElementById('fTitulo').focus(); return; }
  const id = document.getElementById('fId').value;
  const body = {
    titulo,
    conteudo: document.getElementById('fConteudo').value,
    cor: document.getElementById('fCor').value,
    fixado: document.getElementById('fFixado').checked ? 1 : 0,
  };
  btn.disabled = true;
  try{
    if (id) await apiFetch('/api/anotacoes/'+id, { method:'PUT', body: JSON.stringify(body) });
    else     await apiFetch('/api/anotacoes',     { method:'POST', body: JSON.stringify(body) });
    fecharForm();
    load();
  }catch(e){
    alert(e.message || 'Erro ao salvar');
  } finally { btn.disabled = false; }
}

async function editarCard(id){
  document.getElementById('drop-'+id)?.classList.remove('open');
  try{
    const data = await apiFetch('/api/anotacoes?limit=200');
    const n = (data.anotacoes||[]).find(x => String(x.id) === String(id));
    if (n) abrirForm(n);
  }catch(e){ alert(e.message); }
}

async function toggleFixado(id, val){
  document.getElementById('drop-'+id)?.classList.remove('open');
  try{ await apiFetch('/api/anotacoes/'+id, { method:'PUT', body: JSON.stringify({ fixado: val }) }); load(); }
  catch(e){ alert(e.message); }
}

async function excluirCard(id){
  document.getElementById('drop-'+id)?.classList.remove('open');
  if (!confirm('Excluir esta anotação?')) return;
  try{ await apiFetch('/api/anotacoes/'+id, { method:'DELETE' }); load(); }
  catch(e){ alert(e.message); }
}

// ── Eventos ──────────────────────────────────────────────────────────────────
document.getElementById('btnNova').addEventListener('click', () => abrirForm());
document.getElementById('btnCancelar').addEventListener('click', fecharForm);
document.getElementById('btnSalvar').addEventListener('click', salvar);
document.getElementById('fTitulo').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); salvar(); } });

document.getElementById('search').addEventListener('input', e => {
  clearTimeout(_debounce);
  _debounce = setTimeout(() => { _q = e.target.value.trim(); load(); }, 350);
});

window.addEventListener('message', ev => {
  if (ev.data?.type === 'theme-changed') document.documentElement.setAttribute('data-theme', ev.data.theme);
  if (ev.data?.type === 'font-pref-changed'){ window.SysFont?.apply(ev.data.familyId, ev.data.sizeId); window.SysVisual?.apply(ev.data.accentId, ev.data.compact); }
});

load();
</script>
</body>
</html>
