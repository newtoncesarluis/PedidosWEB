<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Tipos de Pedido | SysRepWeb</title>
<style>
* { margin:0;padding:0;box-sizing:border-box; }
:root {
  --bg:#f0f2f5; --card:#fff; --border:#e5e7eb;
  --text:#111827; --text2:#6b7280;
  --accent:var(--accent); --accent-hover:var(--accent-hover);
  --danger:#ef4444; --warn:#f59e0b; --success:#22c55e;
}
body { font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh; }

.toolbar-bar { background:#fff;border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100; }
.btn { display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap; }
.btn svg { width:14px;height:14px;flex-shrink:0; }
.btn:disabled { opacity:.5;cursor:not-allowed; }
.btn-primary { background:var(--accent);color:#fff;border:1.5px solid var(--accent); }
.btn-primary:hover:not(:disabled) { background:var(--accent-hover); }
.btn-outline { background:#fff;color:var(--accent);border:1.5px solid var(--accent); }
.btn-outline:hover { background:var(--accent-soft); }
.btn-ghost   { background:#fff;color:var(--text2);border:1.5px solid var(--border); }
.btn-ghost:hover { background:#f9fafb;color:var(--text); }
.btn-danger  { background:var(--danger);color:#fff;border:1.5px solid var(--danger); }
.btn-danger:hover:not(:disabled) { opacity:.9; }
.btn-save { background:var(--accent);color:#fff;border:1.5px solid var(--accent);font-size:13px;padding:8px 18px; }
.btn-save:hover:not(:disabled) { background:var(--accent-hover); }

.ins-card { display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:4px 9px;border-radius:7px;border:1.5px solid var(--border);background:#fafafa;transition:.15s;user-select:none;flex-shrink:0;white-space:nowrap; }
.ins-card:hover { border-color:var(--accent);background:var(--accent-soft); }
.ins-card.active { border-color:var(--accent);background:var(--accent);color:#fff; }
.ins-card.active .ins-label,.ins-card.active .ins-val { color:#fff; }
.ins-label { font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2); }
.ins-val   { font-size:12px;font-weight:800;color:var(--text);line-height:1; }

.subbar { background:#f9fafb;border-bottom:1px solid var(--border);padding:5px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;z-index:99; }
.icon-btn { display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1.5px solid var(--border);border-radius:7px;background:#fff;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap; }
.icon-btn svg { width:13px;height:13px;flex-shrink:0; }
.icon-btn:hover { background:var(--accent-soft);color:var(--accent);border-color:var(--accent); }

.content-area { padding:14px 16px; }

.table-card { background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden; }
.table-wrap { overflow-x:auto; }
table { width:100%;border-collapse:collapse; }
thead th { background:#f9fafb;padding:7px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap; }
tbody tr { transition:background .1s;cursor:pointer; }
tbody tr:hover { background:var(--accent-soft); }
tbody td { padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px; }
tbody tr:last-child td { border-bottom:none; }
.td-num { color:var(--text2);font-size:11px;width:52px; }

.badge { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap; }
.badge::before { content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0; }
.badge-A { background:#dcfce7;color:#15803d; }.badge-A::before { background:#22c55e; }
.badge-I { background:#f3f4f6;color:#6b7280; }.badge-I::before { background:#9ca3af; }
.chip { display:inline-flex;align-items:center;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;gap:3px; }
.chip-s { background:#dbeafe;color:#1e40af; }
.chip-n { background:#f3f4f6;color:#9ca3af; }

.btn-acoes { background:#f3f4f6;color:var(--text2);border:1px solid var(--border);padding:4px 7px;border-radius:6px;cursor:pointer; }
.btn-acoes:hover { background:#e5e7eb;color:var(--text); }
.btn-acoes svg { width:16px;height:16px; }
.dropdown-menu { position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:6500;min-width:160px;animation:fadeIn .12s ease;padding:4px; }
.dropdown-item { display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--text);transition:.1s;border:none;background:none;width:100%;font-family:inherit;text-align:left;font-weight:500; }
.dropdown-item:hover { background:var(--accent-soft);color:var(--accent); }
.dropdown-item.danger { color:var(--danger); }.dropdown-item.danger:hover { background:#fef2f2; }
.dropdown-item svg { width:14px;height:14px;flex-shrink:0; }

.empty { text-align:center;padding:56px 24px;color:var(--text2); }
.empty p { font-size:13px; }

.pagination { display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);gap:10px;flex-wrap:wrap; }
.pag-select { padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;color:var(--text2);background:#fff;font-family:inherit;cursor:pointer;outline:none; }
.pag-btn { min-width:30px;height:30px;padding:0 6px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:var(--text2);transition:.12s;font-family:inherit;display:flex;align-items:center;justify-content:center; }
.pag-btn:hover:not(:disabled) { border-color:var(--accent);color:var(--accent);background:var(--accent-soft); }
.pag-btn:disabled { opacity:.35;cursor:not-allowed; }
.pag-btn.active { background:var(--accent);border-color:var(--accent);color:#fff; }

#formSection { display:none; }
.form-card { background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden; }
.form-card-head { padding:12px 18px;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:space-between; }
.form-card-head-title { font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px; }
.form-card-head-sub   { font-size:11px;color:var(--text2);margin-top:2px; }
.form-body { padding:20px 18px; }

.form-grid { display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px; }
@media(max-width:700px) { .form-grid { grid-template-columns:1fr; } }
.form-group { display:flex;flex-direction:column;gap:4px; }
.form-group.full { grid-column:1/-1; }
.form-group.half { grid-column:span 2; }
label { font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.3px; }
.req { color:var(--danger); }
input[type="text"],select,textarea {
  padding:8px 10px;border:1.5px solid #d1d5db;border-radius:6px;
  font-size:13px;color:var(--text);background:#fff;
  transition:.12s;outline:none;font-family:inherit;width:100%;
}
textarea { resize:vertical;min-height:60px; }
#formSection input[type="text"] { text-transform:uppercase; }
input:focus,select:focus,textarea:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.08); }
input.err { border-color:var(--danger); }

.toggle-sn { display:flex;border:1.5px solid var(--border);border-radius:7px;overflow:hidden;width:fit-content; }
.toggle-sn button { padding:5px 12px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;background:#fff;color:var(--text2);transition:.12s; }
.toggle-sn button.active-s { background:var(--accent);color:#fff; }
.toggle-sn button.active-n { background:#f3f4f6;color:#6b7280; }

.form-footer { display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--border);background:#fff;gap:10px;flex-wrap:wrap; }
.form-footer-left  { display:flex;gap:8px; }
.form-footer-right { display:flex;gap:8px; }

.menu-more-wrap { position:relative; }
.menu-more-btn { padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;background:#fff;color:var(--text2);cursor:pointer;font-size:15px;line-height:1;display:inline-flex;align-items:center;transition:.12s;font-family:inherit; }
.menu-more-btn:hover { border-color:var(--accent);color:var(--accent);background:var(--accent-soft); }
.menu-more-drop { position:absolute;top:calc(100% + 5px);right:0;background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:5px 0;min-width:160px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.12);animation:dropIn .15s ease-out; }
@keyframes dropIn { from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)} }
.menu-more-drop button { display:flex;align-items:center;gap:8px;width:100%;padding:8px 14px;border:none;background:none;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;transition:.1s;text-align:left; }
.menu-more-drop button:hover { background:var(--accent-soft);color:var(--accent); }
.menu-more-drop button.danger { color:var(--danger); }
.menu-more-drop button.danger:hover { background:#fef2f2; }
.menu-more-drop hr { border:none;border-top:1px solid var(--border);margin:4px 0; }

.section-divider { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:8px;grid-column:1/-1; }

.spinner { width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;flex-shrink:0; }
@keyframes spin { to{transform:rotate(360deg)} }

#toast-container { position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none; }
.toast { display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.14);animation:toastIn .22s ease-out;pointer-events:auto; }
@keyframes toastIn { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)} }
.toast-ok  { background:#1a1a2e;color:#fff; }
.toast-err { background:#ef4444;color:#fff; }
.toast-warn{ background:#f59e0b;color:#fff; }
.toast svg { width:15px;height:15px;flex-shrink:0; }

.confirm-backdrop { position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);animation:fadeIn .18s; }
@keyframes fadeIn { from{opacity:0}to{opacity:1} }
.confirm-box { background:#fff;border-radius:14px;padding:26px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.18); }
.confirm-box h3 { font-size:16px;font-weight:700;margin-bottom:9px; }
.confirm-box p  { font-size:13px;color:var(--text2);line-height:1.5; }
.confirm-btns   { display:flex;gap:10px;justify-content:center;margin-top:18px; }
</style>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar-bar">
  <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
    <div class="ins-card" id="ins-total" onclick="toggleFiltroStatus('T')">
      <span class="ins-label">Total</span><span class="ins-val" id="val-total">—</span>
    </div>
    <div class="ins-card active" id="ins-ativos" onclick="toggleFiltroStatus('A')">
      <span class="ins-label">Ativos</span><span class="ins-val" id="val-ativos">—</span>
    </div>
    <div class="ins-card" id="ins-inativos" onclick="toggleFiltroStatus('I')">
      <span class="ins-label">Inativos</span><span class="ins-val" id="val-inativos" style="color:#f59e0b">—</span>
    </div>
  </div>
  <button class="btn btn-outline" onclick="abrirNovo()">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
    Novo Tipo
  </button>
</div>

<!-- SUBBAR -->
<div class="subbar">
  <div style="display:flex;gap:6px;align-items:center">
    <button class="icon-btn" onclick="exportCSV()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      CSV
    </button>
  </div>
  <div style="display:flex;align-items:center;gap:5px">
    <input type="text" id="inputBusca" placeholder="Buscar tipo de pedido…"
           oninput="debounceSearch()" onkeydown="if(event.key==='Enter')buscar()"
           style="padding:5px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;background:#fff;color:var(--text);outline:none;width:260px;transition:.15s"
           onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'" autocomplete="off">
    <button class="icon-btn" onclick="buscar()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </button>
    <button class="icon-btn" id="btnLimpar" onclick="limparBusca()" style="display:none">✕</button>
  </div>
</div>

<!-- CONTENT -->
<div class="content-area">
  <div id="listSection">
    <div class="table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="td-num">#</th>
              <th>Descrição</th>
              <th>Tratamento</th>
              <th style="text-align:center">Fin.</th>
              <th style="text-align:center">Est.</th>
              <th style="text-align:center">Vitrine</th>
              <th>Status</th>
              <th style="width:60px"></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="8" class="empty"><p>Carregando…</p></td></tr>
          </tbody>
        </table>
      </div>
      <div class="empty" id="emptyMsg" style="display:none"><p>Nenhum tipo de pedido encontrado</p></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="formSection">
    <div class="form-card">
      <div class="form-card-head">
        <div>
          <div class="form-card-head-title">Tipo de Pedido</div>
          <div class="form-card-head-sub"><span id="formTitle">Novo Tipo</span> — <span id="formSub">Preencha os dados</span></div>
        </div>
        <div class="menu-more-wrap" id="menuMoreWrap" style="display:none">
          <button class="menu-more-btn" onclick="toggleMenuMore()">⋮</button>
          <div class="menu-more-drop" id="menuMoreDrop" style="display:none">
            <button onclick="clonarRegistro()">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M7 9a2 2 0 012-2h6a2 2 0 012 2v6a2 2 0 01-2 2H9a2 2 0 01-2-2V9z"/><path d="M5 3a2 2 0 00-2 2v6a2 2 0 002 2V5h8a2 2 0 00-2-2H5z"/></svg>
              Clonar
            </button>
            <hr>
            <button id="btnAtivarMenu" onclick="ativarInativar('A')" style="display:none">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
              Ativar
            </button>
            <button id="btnInativarMenu" onclick="ativarInativar('I')" style="display:none">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M13.477 14.89A6 6 0 015.11 6.524L13.477 14.89zm1.414-1.414L6.524 5.11a6 6 0 018.367 8.367zM18 10a8 8 0 11-16 0 8 8 0 0116 0z" clip-rule="evenodd"/></svg>
              Inativar
            </button>
            <hr>
            <button class="danger" onclick="excluirAtual()">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
              Excluir
            </button>
          </div>
        </div>
      </div>

      <div class="form-body">
        <div class="form-grid">

          <div class="section-divider">Identificação</div>

          <div class="form-group half">
            <label>Descrição <span class="req">*</span></label>
            <input type="text" id="f_descricao" autocomplete="off" oninput="this.classList.remove('err')" placeholder="Ex: PEDIDO, ORÇAMENTO, BONIFICAÇÃO">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="f_situacao">
              <option value="A">Ativo</option>
              <option value="I">Inativo</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Observação</label>
            <textarea id="f_obs" rows="2" placeholder="Observação interna"></textarea>
          </div>
          <div class="form-group">
            <label>Tratamento</label>
            <input type="text" id="f_tratamento" placeholder="Ex: PEDIDO, ORCAMENTO">
          </div>
          <div class="form-group">
            <label>Cod. Plano de Conta</label>
            <input type="text" id="f_cod_planoconta" placeholder="Código contábil">
          </div>
          <div class="form-group">
            <label>ID Receitas</label>
            <input type="text" id="f_id_receitas" placeholder="Vínculo de receita">
          </div>

          <div class="section-divider">Comportamento</div>

          <div class="form-group">
            <label>Gera Financeiro</label>
            <div class="toggle-sn" id="tgl_gerafinanceiro">
              <button onclick="setSN('gerafinanceiro','S')">Sim</button>
              <button onclick="setSN('gerafinanceiro','N')">Não</button>
            </div>
          </div>
          <div class="form-group">
            <label>Movimenta Estoque</label>
            <div class="toggle-sn" id="tgl_movimentaestoque">
              <button onclick="setSN('movimentaestoque','S')">Sim</button>
              <button onclick="setSN('movimentaestoque','N')">Não</button>
            </div>
          </div>
          <div class="form-group">
            <label>Permite Processo</label>
            <div class="toggle-sn" id="tgl_permiteprocesso">
              <button onclick="setSN('permiteprocesso','S')">Sim</button>
              <button onclick="setSN('permiteprocesso','N')">Não</button>
            </div>
          </div>
          <div class="form-group">
            <label>Faturado</label>
            <div class="toggle-sn" id="tgl_faturado">
              <button onclick="setSN('faturado','S')">Sim</button>
              <button onclick="setSN('faturado','N')">Não</button>
            </div>
          </div>
          <div class="form-group">
            <label>Puxada (Fábrica)</label>
            <div class="toggle-sn" id="tgl_puxada">
              <button onclick="setSN('puxada','S')">Sim</button>
              <button onclick="setSN('puxada','N')">Não</button>
            </div>
          </div>
          <div class="form-group">
            <label>Importação</label>
            <div class="toggle-sn" id="tgl_importacao">
              <button onclick="setSN('importacao','S')">Sim</button>
              <button onclick="setSN('importacao','N')">Não</button>
            </div>
          </div>
          <div class="form-group">
            <label>Padrão Vitrine</label>
            <div class="toggle-sn" id="tgl_padrao_vitrine">
              <button onclick="setSN('padrao_vitrine','S')">Sim</button>
              <button onclick="setSN('padrao_vitrine','N')">Não</button>
            </div>
          </div>

        </div>
      </div>

      <div class="form-footer">
        <div class="form-footer-left">
          <button class="btn btn-ghost" onclick="voltarLista()">
            <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Voltar
          </button>
        </div>
        <div class="form-footer-right">
          <button class="btn btn-save" id="btnSalvar" onclick="salvar()">
            <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V6h5a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5v5.586l-1.293-1.293z"/></svg>
            Salvar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<div class="dropdown-menu" id="dropMenu" style="display:none"></div>

<script>
/* Stubs de segurança — sobrescritos por cadastros-permissao.js quando carregar */
window.podeAlterarCad  = window.podeAlterarCad  || function(){ return true; };
window.podeIncluirCad  = window.podeIncluirCad  || function(){ return true; };
window.podeExcluirCad  = window.podeExcluirCad  || function(){ return true; };
window.guardCadIncluir = window.guardCadIncluir || function(){ return true; };
window.guardCadAlterar = window.guardCadAlterar || function(){ return true; };
window.guardCadExcluir = window.guardCadExcluir || function(){ return true; };
window.guardCadSalvar  = window.guardCadSalvar  || function(){ return true; };
window.aplicarUiPermissoesCad       = window.aplicarUiPermissoesCad       || function(){};
window.aplicarFormSomenteLeituraCad = window.aplicarFormSomenteLeituraCad || function(){};

const SN_FIELDS = ['gerafinanceiro','movimentaestoque','permiteprocesso','faturado','puxada','importacao','padrao_vitrine'];
const SN_DEFAULTS = { gerafinanceiro:'S', movimentaestoque:'S', permiteprocesso:'N', faturado:'N', puxada:'N', importacao:'N', padrao_vitrine:'N' };
let SV = Object.assign({}, SN_DEFAULTS);

let S = { filtroStatus:'A', page:1, perPage:50, total:0, registroId:null, dados:null };

function _token() {
  return sessionStorage.getItem('token') || localStorage.getItem('token') || '';
}
function _apiHeaders(json) {
  const h = { Authorization: 'Bearer ' + _token() };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}
function _tratarErroApi(r, d) {
  if (r.status === 401) {
    toast('Sessão expirada. Faça login novamente.', 'err');
    setTimeout(() => { (window.top || window).location.href = '/login.html'; }, 2000);
    return true;
  }
  return false;
}

function setSN(campo, val) {
  SV[campo] = val;
  const tgl = document.getElementById('tgl_'+campo);
  if (!tgl) return;
  tgl.children[0].className = val === 'S' ? 'active-s' : '';
  tgl.children[1].className = val === 'N' ? 'active-n' : '';
}
function setSNAll(obj) { SN_FIELDS.forEach(f => setSN(f, obj[f] || SN_DEFAULTS[f])); }

document.addEventListener('cad-perm-ready', () => {
  if (typeof aplicarUiPermissoesCad === 'function') aplicarUiPermissoesCad();
  document.addEventListener('click', e => {
    if (!e.target.closest('#menuMoreWrap')) fecharMenuMore();
    if (!e.target.closest('#dropMenu') && !e.target.closest('.btn-acoes')) fecharDrop();
  });
  buscar();
});

let _deb = null;
function debounceSearch() {
  clearTimeout(_deb); _deb = setTimeout(buscar, 320);
  document.getElementById('btnLimpar').style.display = document.getElementById('inputBusca').value ? '' : 'none';
}
function limparBusca() {
  document.getElementById('inputBusca').value = '';
  document.getElementById('btnLimpar').style.display = 'none';
  buscar();
}

function toggleFiltroStatus(st) {
  S.filtroStatus = st; S.page = 1;
  ['T','A','I'].forEach(k => {
    const id = k==='T'?'ins-total':k==='A'?'ins-ativos':'ins-inativos';
    document.getElementById(id).classList.toggle('active', k===st);
  });
  buscar();
}

async function buscar() {
  const q      = document.getElementById('inputBusca').value.trim();
  const sit    = S.filtroStatus === 'T' ? '' : S.filtroStatus;
  const offset = (S.page - 1) * S.perPage;
  try {
    const r = await fetch(`/api/tipo-pedidos?q=${encodeURIComponent(q)}&situacao=${sit}&limit=${S.perPage}&offset=${offset}`, { headers: _apiHeaders() });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (_tratarErroApi(r, d)) return;
      toast(d.error || 'Erro ao carregar', 'err');
      return;
    }
    S.total = d.total || 0;
    document.getElementById('val-total').textContent    = (d.total_a || 0) + (d.total_i || 0);
    document.getElementById('val-ativos').textContent   = d.total_a || 0;
    document.getElementById('val-inativos').textContent = d.total_i || 0;
    renderLista(d.tipos || []);
    renderPaginacao();
  } catch(e) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="8" class="empty"><p>Erro ao carregar</p></td></tr>`;
  }
}

function chip(val) {
  return val === 'S'
    ? '<span class="chip chip-s">Sim</span>'
    : '<span class="chip chip-n">Não</span>';
}

function renderLista(rows) {
  const tbody   = document.getElementById('tbody');
  const emptyEl = document.getElementById('emptyMsg');
  if (!rows.length) { tbody.innerHTML = ''; emptyEl.style.display = 'block'; return; }
  emptyEl.style.display = 'none';
  tbody.innerHTML = rows.map((f, i) => {
    const seq = (S.page-1)*S.perPage + i + 1;
    const sk  = f.situacao === 'A' ? 'A' : 'I';
    const sl  = f.situacao === 'A' ? 'Ativo' : 'Inativo';
    return `<tr onclick="abrirEditar(${f.id})">
      <td class="td-num">${seq}</td>
      <td style="font-weight:600">${f.descricao}${f.obs ? `<br><span style="font-size:11px;color:var(--text2);font-weight:400">${f.obs}</span>` : ''}</td>
      <td>${f.tratamento ? `<span style="background:#f0fdf4;color:#15803d;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600">${f.tratamento}</span>` : '—'}</td>
      <td style="text-align:center">${chip(f.gerafinanceiro)}</td>
      <td style="text-align:center">${chip(f.movimentaestoque)}</td>
      <td style="text-align:center">${chip(f.padrao_vitrine)}</td>
      <td><span class="badge badge-${sk}">${sl}</span></td>
      <td onclick="event.stopPropagation()">
        <button class="btn-acoes" onclick="abrirDrop(event,${f.id},'${f.situacao}')">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
        </button>
      </td>
    </tr>`;
  }).join('');
}

function abrirDrop(e, id, sit) {
  e.stopPropagation();
  const ativar   = sit !== 'A';
  const inativar = sit === 'A';
  const m = document.getElementById('dropMenu');
  m.innerHTML = `
    <button class="dropdown-item" onclick="abrirEditar(${id});fecharDrop()">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      Editar
    </button>
    ${ativar   ? `<button class="dropdown-item" onclick="ativarInativarLinha(${id},'A')">Ativar</button>` : ''}
    ${inativar ? `<button class="dropdown-item" onclick="ativarInativarLinha(${id},'I')">Inativar</button>` : ''}
    <button class="dropdown-item danger" onclick="excluirLinha(${id})">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      Excluir
    </button>`;
  m.style.display = 'block';
  const rect = e.currentTarget.getBoundingClientRect();
  m.style.top  = (rect.bottom + 4) + 'px';
  m.style.left = Math.min(rect.left, window.innerWidth - 175) + 'px';
}
function fecharDrop() { document.getElementById('dropMenu').style.display = 'none'; }

async function ativarInativarLinha(id, acao) {
  fecharDrop();
  const r = await fetch(`/api/tipo-pedidos/${id}/${acao==='A'?'ativar':'inativar'}`, { method:'PUT', headers: _apiHeaders() });
  if (!r.ok) { toast('Erro','err'); return; }
  toast(acao==='A' ? 'Tipo ativado!' : 'Tipo inativado!', 'ok');
  buscar();
}
async function excluirLinha(id) {
  if (!guardCadExcluir('Sem permissão para excluir tipos de pedido')) return;
  fecharDrop();
  confirmar('Excluir tipo de pedido?', 'Esta ação não pode ser desfeita.', async () => {
    const r = await fetch(`/api/tipo-pedidos/${id}`, { method:'DELETE', headers: _apiHeaders() });
    const d = await r.json();
    if (!r.ok) { toast(d.error||'Erro ao excluir','err'); return; }
    toast('Excluído!','ok'); buscar();
  });
}

function renderPaginacao() {
  const pages = Math.ceil(S.total / S.perPage);
  const cur   = S.page;
  const el    = document.getElementById('pagination');
  if (!S.total) { el.innerHTML=''; return; }
  const ini = (cur-1)*S.perPage+1, fim=Math.min(cur*S.perPage,S.total);
  let btns = '';
  for (let p=1;p<=pages;p++) {
    if(p===1||p===pages||Math.abs(p-cur)<=1) btns+=`<button class="pag-btn${p===cur?' active':''}" onclick="irPagina(${p})">${p}</button>`;
    else if(Math.abs(p-cur)===2) btns+=`<span style="padding:0 4px;color:var(--text2)">…</span>`;
  }
  el.innerHTML = `
    <span>Exibindo ${ini}–${fim} de ${S.total}</span>
    <div style="display:flex;align-items:center;gap:10px">
      <label style="font-size:12px;color:var(--text2)">Linhas:
        <select class="pag-select" onchange="setPerPage(+this.value)">
          ${[25,50,100].map(n=>`<option value="${n}"${n===S.perPage?' selected':''}>${n}</option>`).join('')}
        </select>
      </label>
      <div style="display:flex;gap:4px">
        <button class="pag-btn" ${cur===1?'disabled':''} onclick="irPagina(${cur-1})">‹</button>
        ${btns}
        <button class="pag-btn" ${cur>=pages?'disabled':''} onclick="irPagina(${cur+1})">›</button>
      </div>
    </div>`;
}
function irPagina(p){const pg=Math.ceil(S.total/S.perPage);if(p<1||p>pg)return;S.page=p;buscar();}
function setPerPage(n){S.perPage=n;S.page=1;buscar();}

function abrirNovo() {
  if (!guardCadIncluir('Sem permissão para incluir tipos de pedido')) return;
  S.registroId = null; S.dados = null;
  document.getElementById('f_descricao').value   = '';
  document.getElementById('f_obs').value         = '';
  document.getElementById('f_situacao').value    = 'A';
  document.getElementById('f_tratamento').value  = '';
  document.getElementById('f_cod_planoconta').value = '';
  document.getElementById('f_id_receitas').value = '';
  setSNAll(SN_DEFAULTS);
  document.getElementById('formTitle').textContent = 'Novo Tipo';
  document.getElementById('formSub').textContent   = 'Preencha os dados';
  document.getElementById('menuMoreWrap').style.display = 'none';
  showForm();
}

async function abrirEditar(id) {
  try {
    const r = await fetch(`/api/tipo-pedidos/${id}`, { headers: _apiHeaders() });
    if (!r.ok) { toast('Erro ao carregar','err'); return; }
    const d = await r.json();
    S.registroId = id; S.dados = d;
    document.getElementById('f_descricao').value      = d.descricao || '';
    document.getElementById('f_obs').value            = d.obs || '';
    document.getElementById('f_situacao').value       = d.situacao || 'A';
    document.getElementById('f_tratamento').value     = d.tratamento || '';
    document.getElementById('f_cod_planoconta').value = d.cod_planoconta || '';
    document.getElementById('f_id_receitas').value    = d.id_receitas || '';
    setSNAll(d);
    document.getElementById('formTitle').textContent = d.descricao;
    document.getElementById('formSub').textContent   = `ID: ${d.id}`;
    document.getElementById('menuMoreWrap').style.display = '';
    document.getElementById('btnAtivarMenu').style.display   = d.situacao !== 'A' ? '' : 'none';
    document.getElementById('btnInativarMenu').style.display = d.situacao === 'A' ? '' : 'none';
    showForm();
    if (!podeAlterarCad()) aplicarFormSomenteLeituraCad();
  } catch(e) { toast(e.message,'err'); }
}

function showForm() {
  document.getElementById('listSection').style.display = 'none';
  document.getElementById('formSection').style.display = 'block';
  document.getElementById('f_descricao').focus();
}
function voltarLista() {
  document.getElementById('formSection').style.display = 'none';
  document.getElementById('listSection').style.display = '';
  buscar();
}

async function salvar() {
  if (!guardCadSalvar(!!S.registroId,'Sem permissão para incluir tipos de pedido','Sem permissão para alterar tipos de pedido')) return;
  const descricao = document.getElementById('f_descricao').value.trim();
  if (!descricao) {
    document.getElementById('f_descricao').classList.add('err');
    toast('O campo Descrição é obrigatório','warn');
    return;
  }
  const payload = {
    descricao,
    obs:            document.getElementById('f_obs').value.trim() || null,
    situacao:       document.getElementById('f_situacao').value,
    tratamento:     document.getElementById('f_tratamento').value.trim() || null,
    cod_planoconta: document.getElementById('f_cod_planoconta').value.trim() || null,
    id_receitas:    document.getElementById('f_id_receitas').value.trim() || null,
    ...Object.fromEntries(SN_FIELDS.map(f => [f, SV[f]]))
  };
  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Salvando…';
  try {
    const r = await fetch(
      S.registroId ? `/api/tipo-pedidos/${S.registroId}` : '/api/tipo-pedidos',
      { method: S.registroId ? 'PUT' : 'POST', headers: _apiHeaders(true), body: JSON.stringify(payload) }
    );
    const d = await r.json();
    if (!r.ok) { toast(d.error||'Erro ao salvar','err'); return; }
    if (!S.registroId) {
      S.registroId = d.id;
      document.getElementById('formTitle').textContent = descricao;
      document.getElementById('formSub').textContent   = `ID: ${d.id}`;
      document.getElementById('menuMoreWrap').style.display = '';
      document.getElementById('btnAtivarMenu').style.display   = 'none';
      document.getElementById('btnInativarMenu').style.display = '';
    }
    toast('Tipo de pedido salvo!','ok');
  } catch(e) { toast(e.message,'err'); }
  finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V6h5a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5v5.586l-1.293-1.293z"/></svg> Salvar`;
  }
}

async function ativarInativar(acao) {
  if (!guardCadAlterar('Sem permissão para alterar tipos de pedido')) return;
  fecharMenuMore();
  const id = S.registroId; if (!id) return;
  const r = await fetch(`/api/tipo-pedidos/${id}/${acao==='A'?'ativar':'inativar'}`, { method:'PUT', headers: _apiHeaders() });
  if (!r.ok) { toast('Erro','err'); return; }
  toast(acao==='A'?'Tipo ativado!':'Tipo inativado!','ok');
  document.getElementById('f_situacao').value = acao;
  document.getElementById('btnAtivarMenu').style.display   = acao==='I'?'':'none';
  document.getElementById('btnInativarMenu').style.display = acao==='A'?'':'none';
  buscar();
}

async function excluirAtual() {
  if (!guardCadExcluir('Sem permissão para excluir tipos de pedido')) return;
  fecharMenuMore();
  if (!S.registroId) return;
  confirmar('Excluir tipo de pedido?', 'Esta ação não pode ser desfeita.', async () => {
    const r = await fetch(`/api/tipo-pedidos/${S.registroId}`, { method:'DELETE', headers: _apiHeaders() });
    const d = await r.json();
    if (!r.ok) { toast(d.error||'Erro','err'); return; }
    toast('Excluído!','ok'); voltarLista();
  });
}

function clonarRegistro() {
  fecharMenuMore();
  if (!S.dados) return;
  const desc = S.dados.descricao;
  S.registroId = null; S.dados = null;
  document.getElementById('f_descricao').value = '';
  document.getElementById('formTitle').textContent = 'Novo Tipo (Clone)';
  document.getElementById('formSub').textContent   = 'Informe a nova descrição e salve';
  document.getElementById('menuMoreWrap').style.display = 'none';
  toast(`Clone de "${desc}" — informe nova descrição`,'warn');
}

function toggleMenuMore() {
  const d = document.getElementById('menuMoreDrop');
  d.style.display = d.style.display==='none' ? 'block' : 'none';
}
function fecharMenuMore() { document.getElementById('menuMoreDrop').style.display='none'; }

function exportCSV() {
  const rows = [...document.querySelectorAll('#tbody tr')];
  if (!rows.length || rows[0].querySelector('td[colspan]')) { toast('Nenhum dado','warn'); return; }
  const head = 'ID;Descrição;Tratamento;Gera Fin.;Mov. Est.;Vitrine;Status\n';
  const body = rows.map(r => {
    const t = [...r.querySelectorAll('td')];
    return [t[0],t[1],t[2],t[3],t[4],t[5],t[6]]
      .map(c=>'"'+(c?.textContent.trim().replace(/"/g,'""')||'')+'"').join(';');
  }).join('\n');
  const a = Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(new Blob(['﻿'+head+body],{type:'text/csv;charset=utf-8'})),
    download:'tipo-pedidos.csv'
  });
  a.click();
}

function toast(msg, tipo='ok', dur=3500) {
  const icons = {
    ok:  `<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>`,
    err: `<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>`,
    warn:`<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>`,
  };
  const t = document.createElement('div');
  t.className = `toast toast-${tipo}`;
  t.innerHTML = (icons[tipo]||'') + msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(), dur);
}
function confirmar(titulo, msg, onOk) {
  const bd = document.createElement('div');
  bd.className = 'confirm-backdrop';
  bd.innerHTML = `<div class="confirm-box"><h3>${titulo}</h3><p>${msg}</p>
    <div class="confirm-btns">
      <button class="btn btn-ghost" id="_no">Cancelar</button>
      <button class="btn btn-danger" id="_ok">Confirmar</button>
    </div></div>`;
  document.body.appendChild(bd);
  bd.querySelector('#_no').onclick = ()=>bd.remove();
  bd.querySelector('#_ok').onclick = ()=>{bd.remove();onOk();};
  bd.onclick = e=>{if(e.target===bd)bd.remove();};
}
</script>
<script src="/assets/cadastros-permissao.js"></script>
</body>
</html>
