<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Formas de Pagamento - SysRepWeb</title>
<style>
  * { margin:0;padding:0;box-sizing:border-box; }

  :root {
    --bg:#f4f5f7;
    --card:#fff;
    --border:#e8eaed;
    --text:#1e2433;
    --text2:#6b7280;
    --accent:var(--accent);
    --accent-dark:var(--accent-hover);
    --danger:#ef4444;
    --success:#22c55e;
    --input-bg:#f9fafb;
  }

  body {
    font-family:'Inter','Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px;
  }

  /* ── HEADER ── */
  .page-header {
    display:flex;align-items:center;gap:14px;margin-bottom:24px;
    flex-wrap:wrap;
  }
  .page-icon {
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(13,148,136,.3);
    flex-shrink:0;
  }
  .page-icon svg { width:24px;height:24px;color:#fff; }
  .page-title h1 { font-size:20px;font-weight:700;color:var(--text); }
  .page-title p  { font-size:13px;color:var(--text2);margin-top:2px; }

  /* ── CARDS ── */
  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:20px;
    box-shadow:0 1px 4px rgba(0,0,0,.04);
  }
  .card-title {
    font-size:13px;font-weight:700;text-transform:uppercase;
    letter-spacing:.6px;color:var(--text2);
    display:flex;align-items:center;gap:8px;
    margin-bottom:18px;padding-bottom:12px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .card-title svg { width:16px;height:16px;color:var(--accent); }

  /* ── BOTÕES ── */
  .btn {
    display:inline-flex;align-items:center;gap:7px;
    padding:10px 18px;border:none;border-radius:9px;
    font-size:13px;font-weight:600;cursor:pointer;
    transition:.2s;font-family:inherit;
  }
  .btn svg { width:15px;height:15px; }
  .btn-accent  { background:var(--accent);color:#fff; }
  .btn-accent:hover  { background:var(--accent-dark);transform:translateY(-1px); }
  .btn-ghost  { background:var(--border);color:var(--text2); }
  .btn-ghost:hover  { background:#dde0e5; }
  .btn-danger { background:var(--danger);color:#fff; }
  .btn-danger:hover { opacity:.9;transform:translateY(-1px); }
  .btn:disabled { opacity:.5;cursor:not-allowed;transform:none !important; }

  /* ── TABELA ── */
  .table-wrap { overflow-x:auto; }
  table { width:100%;border-collapse:collapse;font-size:13px; }
  thead th {
    background:var(--bg);padding:10px 14px;
    text-align:left;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;
    color:var(--text2);border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody tr { transition:background .12s; cursor:pointer; }
  tbody tr:hover { background:var(--accent-soft); }
  tbody td { padding:12px 14px;border-bottom:1px solid var(--border); }
  tbody tr:last-child td { border-bottom:none; }

  .badge {
    padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;
    text-transform:uppercase;
  }
  .badge-active   { background:#dcfce7;color:#16a34a; }
  .badge-inactive { background:#f3f4f6;color:#6b7280; }

  .td-actions { white-space:nowrap; }
  .btn-sm {
    display:inline-flex;align-items:center;gap:5px;
    padding:6px 12px;border:none;border-radius:7px;
    font-size:11px;font-weight:600;cursor:pointer;
    transition:.15s;font-family:inherit;
  }
  .btn-sm svg { width:13px;height:13px; }
  .btn-sm-accent { background:var(--accent-soft);color:var(--accent-dark); }
  .btn-sm-accent:hover { background:var(--accent);color:#fff; }
  .btn-sm-red    { background:#fee2e2;color:#991b1b; }
  .btn-sm-red:hover    { background:var(--danger);color:#fff; }

  /* ── EMPTY ── */
  .empty { text-align:center;padding:40px;color:var(--text2); }
  .empty svg { width:48px;height:48px;opacity:.2;display:block;margin:0 auto 12px; }
  .empty p   { font-size:13px;opacity:.6; }

  /* ── MODAL ── */
  .modal-backdrop {
    position:fixed;inset:0;z-index:9999;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
    padding:16px;animation:fadeIn .2s;
  }
  @keyframes fadeIn { from{opacity:0}to{opacity:1} }

  .modal {
    background:#fff;border-radius:18px;
    width:100%;max-width:600px;
    box-shadow:0 24px 64px rgba(0,0,0,.25);
    animation:slideUp .25s ease-out;overflow:hidden;
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)} }

  .modal-head {
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--border);
  }
  .modal-head h3   { font-size:15px;font-weight:700;color:var(--text); }
  .modal-close {
    width:30px;height:30px;border-radius:50%;background:none;
    border:none;cursor:pointer;color:var(--text2);font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .modal-close:hover { background:var(--border); }

  .modal-body { padding:24px; max-height:80vh; overflow-y:auto; }

  .form-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .form-group { display:flex;flex-direction:column;gap:6px; margin-bottom:14px; }
  .form-group.full { grid-column: 1 / -1; }
  
  label { font-size:12px;font-weight:700;color:var(--text2); text-transform:uppercase; letter-spacing:0.3px; }
  .req { color:var(--danger); margin-left:3px; }

  input[type="text"], input[type="number"], select {
    padding:10px 12px;border:1.5px solid var(--border);
    border-radius:8px;font-size:14px;color:var(--text);
    background:var(--input-bg);transition:.15s;outline:none;
    font-family:inherit;width:100%;
  }
  input:focus, select:focus {
    border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px rgba(13,148,136,.08);
  }

  .chk-list { display:flex; flex-direction:column; gap:10px; margin-top:5px; }
  .chk-item { 
    display:flex; align-items:center; gap:10px; font-size:13px; 
    font-weight:600; cursor:pointer; 
  }
  .chk-item input[type="checkbox"] { width:18px;height:18px; accent-color:var(--accent); cursor:pointer; }

  .modal-footer {
    display:flex;gap:10px;justify-content:flex-end;
    padding:16px 22px;border-top:1px solid var(--border);
  }

  /* ── TOAST ── */
  .toast-container {
    position:fixed;bottom:24px;right:24px;z-index:99999;
    display:flex;flex-direction:column;gap:8px;
  }
  .toast {
    display:flex;align-items:center;gap:10px;
    padding:12px 18px;border-radius:10px;
    font-size:13px;font-weight:600;color:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,0.1);
    animation:toastIn 0.3s ease-out;
  }
  .toast-success { background:var(--success); }
  .toast-error   { background:var(--danger); }

  @keyframes toastIn { from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)} }
</style>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
</head>
<body>

<div class="page-header">
  <div class="page-icon">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
  </div>
  <div class="page-title">
    <h1>Formas de Pagamento</h1>
    <p>Gerencie as modalidades de pagamento aceitas pelo sistema</p>
  </div>
</div>

<div class="card">
  <div class="card-title">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
    </svg>
    Listagem de Modalidades
    <button class="btn btn-accent" style="margin-left:auto" onclick="abrirModalNovo()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Nova Forma
    </button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Descrição</th>
          <th>Tipo</th>
          <th>Prazos</th>
          <th style="text-align:center">Status</th>
          <th style="text-align:right">Ações</th>
        </tr>
      </thead>
      <tbody id="tbody_formas">
        <tr><td colspan="5" class="empty"><p>Carregando...</p></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div id="modal_forma" style="display:none">
  <div class="modal-backdrop" onclick="fecharModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h3 id="modal_titulo">Nova Forma de Pagamento</h3>
        <button class="modal-close" onclick="document.getElementById('modal_forma').style.display='none'">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="f_id">
        <div class="form-grid">
          <div class="form-group full">
            <label>Descrição <span class="req">*</span></label>
            <input type="text" id="f_descricao" placeholder="Ex: CARTÃO DE CRÉDITO 30 DIAS">
          </div>
          
          <div class="form-group">
            <label>Tipo de Pagamento</label>
            <select id="f_tipo_pagto">
              <option value="">Selecione...</option>
              <option value="DINHEIRO">DINHEIRO</option>
              <option value="CARTAO">CARTÃO</option>
              <option value="PIX">PIX</option>
              <option value="CONVÊNIO">CONVÊNIO</option>
              <option value="BOLETO">BOLETO</option>
            </select>
          </div>

          <div class="form-group">
            <label>Prazo Padrão (Dias)</label>
            <input type="text" id="f_prazo_padrao" placeholder="Ex: 30/60/90">
          </div>

          <div class="form-group">
            <label>Recebimento Automático</label>
            <div class="chk-list">
              <label class="chk-item">
                <input type="checkbox" id="f_recebimento_auto"> Sim
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>Permite Troco</label>
            <div class="chk-list">
              <label class="chk-item">
                <input type="checkbox" id="f_permite_troco"> Sim
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>Ajuste na Venda (%)</label>
            <div style="display:flex; gap:5px">
              <select id="f_tipo_percentual" style="width:130px">
                <option value="">Nenhum</option>
                <option value="DESCONTO">DESCONTO</option>
                <option value="ACRESCIMO">ACRÉSCIMO</option>
              </select>
              <input type="number" id="f_percentual" step="0.01" placeholder="0,00">
            </div>
          </div>

          <div class="form-group">
            <label>Status</label>
            <select id="f_status">
              <option value="A">ATIVO</option>
              <option value="I">INATIVO</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="document.getElementById('modal_forma').style.display='none'">Cancelar</button>
        <button class="btn btn-accent" id="btn_salvar" onclick="salvar()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast_container"></div>

<script>
async function carregar() {
  const tbody = document.getElementById('tbody_formas');
  try {
    const r = await fetch('/api/formas-pagamento');
    const d = await r.json();
    const lista = d.formas || [];
    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty"><p>Nenhuma forma cadastrada</p></td></tr>';
      return;
    }
    tbody.innerHTML = lista.map(g => `
      <tr onclick='editar(${JSON.stringify(g)})'>
        <td style="font-weight:700">${g.descricao}</td>
        <td>${g.tipo_pagto || '-'}</td>
        <td style="color:var(--text2)">${g.prazo_padrao || '-'}</td>
        <td style="text-align:center">
          <span class="badge badge-${g.status === 'A' ? 'active' : 'inactive'}">
            ${g.status === 'A' ? 'Ativo' : 'Inativo'}
          </span>
        </td>
        <td class="td-actions" style="text-align:right" onclick="event.stopPropagation()">
          <button class="btn-sm btn-sm-red" onclick="excluir(${g.id})">Excluir</button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty"><p>Erro ao carregar dados</p></td></tr>';
  }
}

function abrirModalNovo() {
  document.getElementById('f_id').value = '';
  document.getElementById('f_descricao').value = '';
  document.getElementById('f_tipo_pagto').value = '';
  document.getElementById('f_prazo_padrao').value = '';
  document.getElementById('f_recebimento_auto').checked = false;
  document.getElementById('f_permite_troco').checked = false;
  document.getElementById('f_tipo_percentual').value = '';
  document.getElementById('f_percentual').value = '';
  document.getElementById('f_status').value = 'A';
  
  document.getElementById('modal_titulo').textContent = 'Nova Forma de Pagamento';
  document.getElementById('modal_forma').style.display = 'block';
}

function editar(g) {
  document.getElementById('f_id').value = g.id;
  document.getElementById('f_descricao').value = g.descricao;
  document.getElementById('f_tipo_pagto').value = g.tipo_pagto || '';
  document.getElementById('f_prazo_padrao').value = g.prazo_padrao || '';
  document.getElementById('f_recebimento_auto').checked = g.recebimento_auto === 'S';
  document.getElementById('f_permite_troco').checked = g.permite_troco === 'S';
  document.getElementById('f_tipo_percentual').value = g.tipo_percentual || '';
  document.getElementById('f_percentual').value = g.percentual || '';
  document.getElementById('f_status').value = g.status;

  document.getElementById('modal_titulo').textContent = 'Editar Forma de Pagamento';
  document.getElementById('modal_forma').style.display = 'block';
}

async function salvar() {
  const payload = {
    descricao: document.getElementById('f_descricao').value.trim(),
    tipo_pagto: document.getElementById('f_tipo_pagto').value,
    prazo_padrao: document.getElementById('f_prazo_padrao').value,
    recebimento_auto: document.getElementById('f_recebimento_auto').checked ? 'S' : 'N',
    permite_troco: document.getElementById('f_permite_troco').checked ? 'S' : 'N',
    tipo_percentual: document.getElementById('f_tipo_percentual').value,
    percentual: document.getElementById('f_percentual').value || 0,
    status: document.getElementById('f_status').value
  };

  if(!payload.descricao) return toast('Preencha a descrição', 'error');

  const id = document.getElementById('f_id').value;
  try {
    const r = await fetch(id ? `/api/formas-pagamento/${id}` : '/api/formas-pagamento', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(r.ok) {
      toast('Salvo com sucesso!');
      document.getElementById('modal_forma').style.display = 'none';
      carregar();
    }
  } catch (e) { toast('Erro ao salvar', 'error'); }
}

async function excluir(id) {
  if(!confirm('Deseja excluir esta forma de pagamento?')) return;
  try {
    const r = await fetch(`/api/formas-pagamento/${id}`, { method: 'DELETE' });
    if(r.ok) {
      toast('Excluído com sucesso!');
      carregar();
    }
  } catch (e) { toast('Erro ao excluir', 'error'); }
}

function toast(msg, type='success') {
  const container = document.getElementById('toast_container');
  const div = document.createElement('div');
  div.className = `toast toast-${type}`;
  div.textContent = msg;
  container.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

function fecharModal(e) {
  if(e.target.className === 'modal-backdrop') {
    document.getElementById('modal_forma').style.display = 'none';
  }
}

carregar();
</script>
</body>
</html>
