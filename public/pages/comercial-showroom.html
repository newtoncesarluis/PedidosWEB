<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Showroom — Catálogo Visual</title>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; }
  .boot { display:flex; align-items:center; justify-content:center; height:100vh; color:#94a3b8; font: 14px/1.4 system-ui,sans-serif; }
</style>
</head>
<body>
<div class="boot" id="boot">Abrindo Showroom…</div>
<script src="/assets/sysrep-api.js"></script>
<script src="/assets/catalogo-afv-ui.js?v=20260716c"></script>
<script>
(function () {
  const token = sessionStorage.getItem('token') || localStorage.getItem('token') || '';
  if (!token) {
    location.href = '/login.html';
    return;
  }
  // Expõe apiFetch no formato usado pelo módulo
  if (window.SysRepApi?.apiFetch && !window.SysRepApi.apiFetch._bound) {
    /* ok */
  }
  if (typeof abrirCatalogoAfv === 'function') {
    document.getElementById('boot')?.remove();
    abrirCatalogoAfv({ standalone: true });
  } else {
    document.getElementById('boot').textContent = 'Falha ao carregar o Showroom.';
  }
})();
</script>
</body>
</html>
