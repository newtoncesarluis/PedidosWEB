<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Showroom — Catálogo Visual</title>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; }
  .boot { display:flex; align-items:center; justify-content:center; height:100vh; color:#94a3b8; font: 14px/1.4 system-ui,sans-serif; }
</style>
</head>
<body>
<div class="boot" id="boot">Abrindo Showroom…</div>
<script src="/assets/confirm-dialog.js"></script>
<script src="/assets/sysrep-api.js"></script>
<script src="/assets/preco-peso-produto.js"></script>
<script src="/assets/produto-cores-picker.js?v=20260924a"></script>
<script src="/assets/grade-fechada-pack.js?v=20260917a"></script>
<script>
(function () {
  const token = sessionStorage.getItem('token') || localStorage.getItem('token') || '';
  if (!token) {
    location.href = '/login.html';
    return;
  }
  const boot = document.getElementById('boot');
  const falhou = () => { if (boot) boot.textContent = 'Falha ao carregar o Showroom.'; };

  // Usa a versão do sistema para invalidar cache do módulo a cada deploy.
  function carregarModulo(versao) {
    const s = document.createElement('script');
    s.src = '/assets/catalogo-afv-ui.js?v=' + encodeURIComponent(versao) + '&r=20261012m';
    s.onload = () => {
      if (typeof abrirCatalogoAfv === 'function') {
        boot?.remove();
        abrirCatalogoAfv({ standalone: true });
      } else falhou();
    };
    s.onerror = falhou;
    document.head.appendChild(s);
  }

  fetch('/api/version', { cache: 'no-store' })
    .then((r) => r.json())
    .then((d) => carregarModulo(d.v || d.versao || Date.now()))
    .catch(() => carregarModulo(Date.now()));
})();
</script>
</body>
</html>
