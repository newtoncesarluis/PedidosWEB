<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Prepostos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:var(--content-bg);--card:var(--card-bg);--border:var(--card-border);--text:var(--content-text);--text2:var(--text2);--accent:var(--accent);--accent-hover:var(--accent-hover);--danger:#ef4444;--warn:#f59e0b;--success:#22c55e;--input-bg:var(--card-bg)}
body{font-family:var(--font,'Inter','Segoe UI',sans-serif);background:var(--bg);color:var(--text);min-height:100vh}

/* TOOLBAR */
.toolbar-bar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.toolbar-title{font-size:14px;font-weight:800;letter-spacing:.8px;color:var(--text);text-transform:uppercase;white-space:nowrap;margin-right:4px}
.badge-total{display:inline-flex;align-items:center;padding:4px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--accent-soft,rgba(13,148,136,.12));color:var(--accent);border:1px solid var(--accent);white-space:nowrap}
.search-group{display:flex;align-items:center;gap:4px;margin-left:auto}
.search-group input{padding:9px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;color:var(--text);background:var(--card);outline:none;font-family:inherit;width:220px;transition:.2s}
.search-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft,rgba(13,148,136,.15))}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap;letter-spacing:.3px}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--btn-text,#fff);border:1.5px solid var(--accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:var(--card);color:var(--text2);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff;border:1.5px solid var(--danger)}
.btn-danger:hover:not(:disabled){opacity:.9}
.btn-sm{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:none;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;transition:.12s;font-family:inherit;white-space:nowrap}
.btn-sm svg{width:12px;height:12px}
.btn-sm-edit{background:var(--accent-soft,rgba(13,148,136,.1));color:var(--accent)}
.btn-sm-edit:hover{background:var(--accent);color:#fff}
.btn-sm-delete{background:#fef2f2;color:#dc2626}
.btn-sm-delete:hover{background:#dc2626;color:#fff}
.btn-sm-com{background:#f0fdf4;color:#16a34a}
.btn-sm-com:hover{background:#16a34a;color:#fff}

/* CONTENT */
.content-area{padding:14px 16px;display:flex;flex-direction:column;gap:14px}

/* FORM INLINE */
.form-card{background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:20px 24px;display:none}
.form-card.open{display:block}
.form-title{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:768px){.form-grid{grid-template-columns:1fr}}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.input-field{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--input-bg);outline:none;font-family:inherit;transition:.15s;width:100%}
.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft,rgba(13,148,136,.12))}
.form-actions{display:flex;gap:8px;margin-top:16px}

/* TABLE */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg);padding:10px 12px;text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{transition:.15s;cursor:pointer;border-left:3px solid transparent}
tbody tr:hover{background:var(--accent-soft,rgba(13,148,136,.08));border-left-color:var(--accent)}
tbody td{padding:12px 12px;border-bottom:1px solid var(--border);font-size:13px}
tbody tr:last-child td{border-bottom:none}
.td-actions{white-space:nowrap;text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-A{background:#dcfce7;color:#15803d}.badge-A::before{background:#22c55e}
.badge-I{background:#f3f4f6;color:#6b7280}.badge-I::before{background:#9ca3af}
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty svg{width:40px;height:40px;opacity:.18;margin:0 auto 12px;display:block}

/* COMISSÕES DRAWER */
.com-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;display:none}
.com-panel.open{display:block}
.com-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.com-title{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.com-resumo{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.com-card{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;text-align:center}
.com-card-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.com-card-value{font-size:18px;font-weight:700;color:var(--text)}
.com-card.prev .com-card-value{color:var(--warn)}
.com-card.conf .com-card-value{color:var(--accent)}
.com-card.paga .com-card-value{color:var(--success)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:toastIn .2s ease;pointer-events:none}
.toast-ok{background:#22c55e}.toast-err{background:#ef4444}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="toolbar-bar">
  <span class="toolbar-title">Prepostos</span>
  <span class="badge-total" id="badgeTotal">0</span>
  <div class="search-group">
    <input id="searchInput" type="text" placeholder="Buscar preposto..." autocomplete="off" oninput="filtrar()">
  </div>
  <button class="btn btn-primary" id="btnNovo" onclick="abrirForm()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    Novo Preposto
  </button>
</div>

<div class="content-area">

  <!-- FORM INLINE -->
  <div class="form-card" id="formCard">
    <div class="form-title" id="formTitle">Novo Preposto</div>
    <form id="formPreposto" onsubmit="salvar(event)">
      <input type="hidden" id="fId">
      <div class="form-grid">
        <div class="field-group">
          <label class="field-label">Nome *</label>
          <input class="input-field" id="fNome" required autocomplete="off" placeholder="Nome completo">
        </div>
        <div class="field-group">
          <label class="field-label">Login *</label>
          <input class="input-field" id="fLogin" autocomplete="off" placeholder="Login de acesso">
        </div>
        <div class="field-group">
          <label class="field-label">Senha (novo)</label>
          <input class="input-field" id="fSenha" type="password" autocomplete="new-password" placeholder="Deixe vazio para manter">
        </div>
        <div class="field-group">
          <label class="field-label">% Comissão</label>
          <input class="input-field" id="fPct" type="number" step="0.01" min="0" max="100" value="6" placeholder="6.00">
        </div>
        <div class="field-group">
          <label class="field-label">Representante vinculado *</label>
          <select class="input-field" id="fGerente">
            <option value="">— selecione —</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Visibilidade de clientes</label>
          <select class="input-field" id="fVisib">
            <option value="TODOS">Toda a carteira do representante</option>
            <option value="ATRIBUIDOS">Somente clientes selecionados</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Tabelas de preço</label>
          <select class="input-field" id="fVisibTab" onchange="onVisibTabChange()">
            <option value="TODOS">Todas as tabelas do representante</option>
            <option value="ATRIBUIDOS">Somente tabelas selecionadas</option>
          </select>
          <div id="tabPickRow" style="display:none;margin-top:8px;align-items:center;gap:10px;flex-wrap:wrap">
            <button type="button" class="btn btn-ghost btn-sm" onclick="escolherTabelasForm()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              Escolher tabelas
            </button>
            <span id="tabPickCount" style="font-size:12px;color:var(--text2)"></span>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Pedidos que o preposto enxerga</label>
          <select class="input-field" id="fVisibPed">
            <option value="CARTEIRA">Pedidos da carteira do representante</option>
            <option value="PROPRIOS">Somente os pedidos dele (esconde vendas do representante)</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
          Salvar
        </button>
        <button type="button" class="btn btn-ghost" onclick="fecharForm()">Cancelar</button>
      </div>
    </form>
  </div>

  <!-- COMISSÕES PANEL -->
  <div class="com-panel" id="comPanel">
    <div class="com-header">
      <span class="com-title" id="comNome">Comissões</span>
      <button class="btn btn-ghost" onclick="fecharCom()">Fechar</button>
    </div>
    <div class="com-resumo">
      <div class="com-card prev"><div class="com-card-label">Prevista</div><div class="com-card-value" id="comPrev">R$ 0,00</div></div>
      <div class="com-card conf"><div class="com-card-label">Confirmada</div><div class="com-card-value" id="comConf">R$ 0,00</div></div>
      <div class="com-card paga"><div class="com-card-label">Paga</div><div class="com-card-value" id="comPaga">R$ 0,00</div></div>
    </div>
    <div class="table-card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Pedido</th><th>Cliente</th><th>Fábrica</th><th>Valor Pedido</th><th>%</th><th>Comissão</th><th>Status</th><th>Data</th>
          </tr></thead>
          <tbody id="comBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CLIENTES ATRIBUÍDOS PANEL -->
  <div class="com-panel" id="cliPanel">
    <div class="com-header">
      <span class="com-title" id="cliNome">Clientes atribuídos</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="salvarClientes()">Salvar seleção</button>
        <button class="btn btn-ghost" onclick="fecharCli()">Fechar</button>
      </div>
    </div>
    <div class="search-group" style="margin:0 0 12px 0">
      <input id="cliSearch" type="text" placeholder="Buscar cliente..." autocomplete="off" oninput="renderCli()" style="width:100%">
    </div>
    <div class="table-card">
      <div class="table-wrap" style="max-height:420px;overflow-y:auto">
        <table>
          <thead><tr>
            <th style="width:40px"><input type="checkbox" id="cliAll" onchange="toggleAllCli(this.checked)"></th>
            <th>Cliente</th><th>Cidade/UF</th>
          </tr></thead>
          <tbody id="cliBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- TABELAS DE PREÇO ATRIBUÍDAS PANEL -->
  <div class="com-panel" id="tabPanel">
    <div class="com-header">
      <span class="com-title" id="tabNome">Tabelas de preço atribuídas</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="salvarTabelas()">Salvar seleção</button>
        <button class="btn btn-ghost" onclick="fecharTab()">Fechar</button>
      </div>
    </div>
    <div class="search-group" style="margin:0 0 12px 0">
      <input id="tabSearch" type="text" placeholder="Buscar tabela..." autocomplete="off" oninput="renderTab()" style="width:100%">
    </div>
    <div class="table-card">
      <div class="table-wrap" style="max-height:420px;overflow-y:auto">
        <table>
          <thead><tr>
            <th style="width:40px"><input type="checkbox" id="tabAll" onchange="toggleAllTab(this.checked)"></th>
            <th>Tabela</th>
          </tr></thead>
          <tbody id="tabBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- LISTA -->
  <div class="table-card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Nome</th><th>Login</th><th>Representante</th><th>% Comissão</th><th>Status</th><th style="text-align:right">Ações</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>
      <p>Nenhum preposto cadastrado</p>
    </div>
  </div>

</div>
<div id="toast"></div>

<script>
const BASE = '/api';
let _token = '';
let _todos = [];
let _filtrados = [];

// ── Auth ─────────────────────────────────────────────────────────────────────
(function initToken() {
  try {
    const raw = (window.parent && window.parent.App && window.parent.App.token)
      || sessionStorage.getItem('token') || localStorage.getItem('token')
      || sessionStorage.getItem('authToken') || localStorage.getItem('authToken') || '';
    _token = (raw && raw.startsWith('"')) ? JSON.parse(raw) : raw;
  } catch { _token = ''; }
})();

// ── Permissões (do JWT) ─────────────────────────────────────────────────────
let _perm = {}, _isAdmin = false;
(function initPerm() {
  try {
    const p = JSON.parse(atob(_token.split('.')[1]));
    _isAdmin = p.perfil == 1 || p.role === 'admin';
    _perm = p.permissoes || {};
  } catch { _perm = {}; }
})();
function can(k) { return _isAdmin || _perm[k] === 'S'; }

async function api(path, opts = {}) {
  const r = await fetch(BASE + path, {
    headers: { 'Authorization': 'Bearer ' + _token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || r.statusText);
  }
  return r.json();
}

// ── Formatação ────────────────────────────────────────────────────────────────
function fmtCur(v) {
  return 'R$ ' + parseFloat(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, ok = true) {
  const d = document.createElement('div');
  d.className = 'toast-item ' + (ok ? 'toast-ok' : 'toast-err');
  d.textContent = msg;
  document.getElementById('toast').appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

// ── Vendedores (para combo Representante) ─────────────────────────────────────
let _vendedores = [];
async function carregarVendedores() {
  try {
    const data = await api('/lookups/vendedores');
    _vendedores = data.vendedores || data || [];
    const sel = document.getElementById('fGerente');
    _vendedores.forEach(v => {
      const o = document.createElement('option');
      o.value = v.id || v.idusuario;
      o.textContent = v.nome || v.nomeusu;
      sel.appendChild(o);
    });
  } catch (_) {}
}

// ── Carregar lista ────────────────────────────────────────────────────────────
async function carregar() {
  try {
    const data = await api('/prepostos');
    _todos = data.prepostos || [];
    filtrar();
  } catch (err) {
    toast(err.message, false);
  }
}

function filtrar() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  _filtrados = q
    ? _todos.filter(p => (p.nome || '').toLowerCase().includes(q) || (p.login || '').toLowerCase().includes(q))
    : [..._todos];
  renderizar();
}

function renderizar() {
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  document.getElementById('badgeTotal').textContent = _filtrados.length;

  if (!_filtrados.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  const statusMap = { 'N': ['A', 'Ativo'], 'S': ['I', 'Inativo'] };
  tbody.innerHTML = _filtrados.map(p => {
    const [cls, label] = statusMap[p.excluido] || ['I', 'Inativo'];
    return `<tr>
      <td><strong>${esc(p.nome)}</strong></td>
      <td style="color:var(--text2)">${esc(p.login)}</td>
      <td style="color:var(--text2);font-size:12px">${esc(p.nome_gerente || '—')}</td>
      <td><strong>${parseFloat(p.pct_comissao || 6).toFixed(2).replace('.',',')}%</strong></td>
      <td><span class="badge badge-${cls}">${label}</span></td>
      <td class="td-actions">
        ${(p.preposto_visibilidade === 'ATRIBUIDOS' && can('alterar_prepostos')) ? `<button class="btn-sm btn-sm-edit" title="Clientes atribuídos" onclick="gerenciarClientes(${p.id},'${esc(p.nome)}')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0z"/></svg>
          Clientes
        </button>` : ''}
        ${(p.preposto_tabela_visibilidade === 'ATRIBUIDOS' && can('alterar_prepostos')) ? `<button class="btn-sm btn-sm-edit" title="Tabelas de preço atribuídas" onclick="gerenciarTabelas(${p.id},'${esc(p.nome)}')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 14.25l6-6m4.5-3.493V21.75l-3.75-1.5-3.75 1.5-3.75-1.5-3.75 1.5V4.757c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0c1.1.128 1.907 1.077 1.907 2.185zM9.75 9h.008v.008H9.75V9zm0 6h.008v.008H9.75V15zm5.25-6h.008v.008H15V9zm0 6h.008v.008H15V15z"/></svg>
          Tabelas
        </button>` : ''}
        <button class="btn-sm btn-sm-com" title="Comissões" onclick="verComissoes(${p.id},'${esc(p.nome)}')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Comissões
        </button>
        ${can('alterar_prepostos') ? `<button class="btn-sm btn-sm-edit" title="Editar" onclick="editar(${p.id})">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125"/></svg>
          Editar
        </button>` : ''}
        ${can('excluir_prepostos') ? `<button class="btn-sm btn-sm-delete" title="Inativar" onclick="inativar(${p.id},'${esc(p.nome)}')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          Inativar
        </button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Formulário ────────────────────────────────────────────────────────────────
function abrirForm(p = null) {
  const fc = document.getElementById('formCard');
  fc.classList.add('open');
  document.getElementById('formTitle').textContent = p ? 'Editar Preposto' : 'Novo Preposto';
  document.getElementById('fId').value    = p?.id || '';
  document.getElementById('fNome').value  = p?.nome || '';
  document.getElementById('fLogin').value = p?.login || '';
  document.getElementById('fSenha').value = '';
  document.getElementById('fPct').value   = p?.pct_comissao ?? 6;
  document.getElementById('fVisib').value = p?.preposto_visibilidade || 'TODOS';
  document.getElementById('fVisibTab').value = p?.preposto_tabela_visibilidade || 'TODOS';
  document.getElementById('fVisibPed').value = p?.preposto_pedidos_visibilidade || 'CARTEIRA';
  document.getElementById('fGerente').value = p?.id_gerente || '';
  document.getElementById('fLogin').disabled = !!p;
  onVisibTabChange();
  if (p?.id && (p.preposto_tabela_visibilidade === 'ATRIBUIDOS')) atualizarContadorTabelas(p.id);
  fc.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Mostra/oculta o botão "Escolher tabelas" conforme o modo selecionado
function onVisibTabChange() {
  const atrib = document.getElementById('fVisibTab').value === 'ATRIBUIDOS';
  const row = document.getElementById('tabPickRow');
  row.style.display = atrib ? 'flex' : 'none';
  if (!atrib) document.getElementById('tabPickCount').textContent = '';
}

// Busca quantas tabelas estão atribuídas e atualiza o texto do contador
async function atualizarContadorTabelas(id) {
  try {
    const data = await api(`/prepostos/${id}/tabelas-preco`);
    const total = (data.tabelas || []).length;
    const sel = (data.atribuidas || []).length;
    document.getElementById('tabPickCount').textContent =
      sel ? `${sel} de ${total} tabela(s) selecionada(s)` : 'Nenhuma tabela selecionada ainda';
  } catch { /* silencioso */ }
}

// Abre o modal de seleção a partir do formulário (precisa ter sido salvo antes)
function escolherTabelasForm() {
  const id = document.getElementById('fId').value;
  const nome = document.getElementById('fNome').value.trim();
  if (!id) { toast('Salve o preposto primeiro para escolher as tabelas', false); return; }
  gerenciarTabelas(id, nome);
}

function fecharForm() { document.getElementById('formCard').classList.remove('open'); }

function editar(id) {
  const p = _todos.find(x => x.id == id);
  if (p) abrirForm(p);
}

async function salvar(ev) {
  ev.preventDefault();
  const id   = document.getElementById('fId').value;
  const nome    = document.getElementById('fNome').value.trim();
  const pct     = parseFloat(document.getElementById('fPct').value) || 6;
  const visib   = document.getElementById('fVisib').value || 'TODOS';
  const visibTab = document.getElementById('fVisibTab').value || 'TODOS';
  const visibPed = document.getElementById('fVisibPed').value || 'CARTEIRA';
  const gerente = parseInt(document.getElementById('fGerente').value) || null;

  if (!gerente) { toast('Selecione o representante vinculado', false); return; }

  try {
    if (id) {
      const body = { nome, pct_comissao: pct, preposto_visibilidade: visib, preposto_tabela_visibilidade: visibTab, preposto_pedidos_visibilidade: visibPed, id_gerente: gerente };
      const senha = document.getElementById('fSenha').value;
      if (senha) body.senha = senha;
      await api('/prepostos/' + id, { method: 'PUT', body: JSON.stringify(body) });
    } else {
      const login = document.getElementById('fLogin').value.trim();
      const senha = document.getElementById('fSenha').value;
      await api('/prepostos', { method: 'POST', body: JSON.stringify({ nome, login, senha, pct_comissao: pct, preposto_visibilidade: visib, preposto_tabela_visibilidade: visibTab, preposto_pedidos_visibilidade: visibPed, id_gerente: gerente }) });
    }
    toast('Preposto salvo com sucesso');
    fecharForm();
    await carregar();
  } catch (err) {
    toast(err.message, false);
  }
}

async function inativar(id, nome) {
  if (!confirm(`Inativar preposto "${nome}"?`)) return;
  try {
    await api('/prepostos/' + id, { method: 'DELETE' });
    toast('Preposto inativado');
    await carregar();
  } catch (err) {
    toast(err.message, false);
  }
}

// ── Comissões ─────────────────────────────────────────────────────────────────
const _statusLabel = { P: 'Prevista', C: 'Confirmada', R: 'Paga' };
const _statusCor   = { P: 'var(--warn)', C: 'var(--accent)', R: 'var(--success)' };

async function verComissoes(id, nome) {
  try {
    const data = await api(`/prepostos/${id}/comissoes`);
    document.getElementById('comNome').textContent = 'Comissões — ' + nome;
    document.getElementById('comPrev').textContent = fmtCur(data.resumo.prevista);
    document.getElementById('comConf').textContent = fmtCur(data.resumo.confirmada);
    document.getElementById('comPaga').textContent = fmtCur(data.resumo.paga);

    const tbody = document.getElementById('comBody');
    if (!data.comissoes.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text2)">Nenhuma comissão encontrada</td></tr>`;
    } else {
      tbody.innerHTML = data.comissoes.map(c => `
        <tr>
          <td>${esc(c.pedido)}</td>
          <td>${esc(c.nome_cliente || '—')}</td>
          <td>${esc(c.nome_fornecedor || '—')}</td>
          <td>${fmtCur(c.vlrtotalpedido)}</td>
          <td style="text-align:center;color:var(--text2);font-size:11px">${parseFloat(c.pct_aplicado || 0).toFixed(2)}%</td>
          <td><strong>${fmtCur(c.vlr_pago)}</strong></td>
          <td><span style="font-size:11px;font-weight:700;color:${_statusCor[c.status] || 'var(--text2)'}">${_statusLabel[c.status] || c.status}</span></td>
          <td style="color:var(--text2)">${c.data_lancamento ? new Date(c.data_lancamento).toLocaleDateString('pt-BR') : '—'}</td>
        </tr>
      `).join('');
    }

    const panel = document.getElementById('comPanel');
    panel.classList.add('open');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    toast(err.message, false);
  }
}

function fecharCom() { document.getElementById('comPanel').classList.remove('open'); }

// ── Clientes atribuídos ─────────────────────────────────────────────────────────
let _cliPrepId = null;
let _cliLista = [];
let _cliSel = new Set();

async function gerenciarClientes(id, nome) {
  _cliPrepId = id;
  try {
    const data = await api(`/prepostos/${id}/clientes`);
    _cliLista = data.clientes || [];
    _cliSel = new Set((data.atribuidos || []).map(Number));
    document.getElementById('cliNome').textContent = 'Clientes atribuídos — ' + nome;
    document.getElementById('cliSearch').value = '';
    renderCli();
    const panel = document.getElementById('cliPanel');
    panel.classList.add('open');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    toast(err.message, false);
  }
}

function renderCli() {
  const q = (document.getElementById('cliSearch').value || '').toLowerCase();
  const lista = q ? _cliLista.filter(c => (c.nome || '').toLowerCase().includes(q) || (c.cidade || '').toLowerCase().includes(q)) : _cliLista;
  const body = document.getElementById('cliBody');
  if (!lista.length) {
    body.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:32px;color:var(--text2)">Nenhum cliente na carteira do representante</td></tr>`;
    return;
  }
  body.innerHTML = lista.map(c => `
    <tr onclick="toggleCli(${c.id})">
      <td><input type="checkbox" ${_cliSel.has(Number(c.id)) ? 'checked' : ''} onclick="event.stopPropagation();toggleCli(${c.id})"></td>
      <td><strong>${esc(c.nome)}</strong></td>
      <td style="color:var(--text2)">${esc(c.cidade || '')}${c.uf ? '/' + esc(c.uf) : ''}</td>
    </tr>
  `).join('');
}

function toggleCli(id) {
  id = Number(id);
  if (_cliSel.has(id)) _cliSel.delete(id); else _cliSel.add(id);
  renderCli();
}

function toggleAllCli(check) {
  const q = (document.getElementById('cliSearch').value || '').toLowerCase();
  const lista = q ? _cliLista.filter(c => (c.nome || '').toLowerCase().includes(q) || (c.cidade || '').toLowerCase().includes(q)) : _cliLista;
  lista.forEach(c => { if (check) _cliSel.add(Number(c.id)); else _cliSel.delete(Number(c.id)); });
  renderCli();
}

async function salvarClientes() {
  try {
    await api(`/prepostos/${_cliPrepId}/clientes`, { method: 'POST', body: JSON.stringify({ ids: [..._cliSel] }) });
    toast('Clientes atribuídos salvos');
    fecharCli();
  } catch (err) {
    toast(err.message, false);
  }
}

function fecharCli() { document.getElementById('cliPanel').classList.remove('open'); }

// ── Tabelas de preço atribuídas ──────────────────────────────────────────────
let _tabPrepId = null;
let _tabLista = [];
let _tabSel = new Set();

async function gerenciarTabelas(id, nome) {
  _tabPrepId = id;
  try {
    const data = await api(`/prepostos/${id}/tabelas-preco`);
    _tabLista = data.tabelas || [];
    _tabSel = new Set((data.atribuidas || []).map(Number));
    document.getElementById('tabNome').textContent = 'Tabelas de preço atribuídas — ' + nome;
    document.getElementById('tabSearch').value = '';
    renderTab();
    const panel = document.getElementById('tabPanel');
    panel.classList.add('open');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    toast(err.message, false);
  }
}

function renderTab() {
  const q = (document.getElementById('tabSearch').value || '').toLowerCase();
  const lista = q ? _tabLista.filter(t => (t.descricao || '').toLowerCase().includes(q)) : _tabLista;
  const body = document.getElementById('tabBody');
  if (!lista.length) {
    // Vazio por busca x vazio por falta de liberação no representante (mensagens diferentes)
    const msg = (q && _tabLista.length)
      ? `Nenhuma tabela encontrada para "${esc(q)}"`
      : `Nenhuma tabela de preço liberada para o representante.<br>
         <span style="font-size:12px">Libere as tabelas em <strong>Cadastros › Usuários</strong>, editando o representante na seção <strong>"Tabelas de Preço Liberadas"</strong>, e depois volte aqui.</span>`;
    body.innerHTML = `<tr><td colspan="2" style="text-align:center;padding:32px;color:var(--text2);line-height:1.6">${msg}</td></tr>`;
    return;
  }
  body.innerHTML = lista.map(t => `
    <tr onclick="toggleTab(${t.id_tabela})">
      <td><input type="checkbox" ${_tabSel.has(Number(t.id_tabela)) ? 'checked' : ''} onclick="event.stopPropagation();toggleTab(${t.id_tabela})"></td>
      <td><strong>${esc(t.descricao)}</strong></td>
    </tr>
  `).join('');
}

function toggleTab(id) {
  id = Number(id);
  if (_tabSel.has(id)) _tabSel.delete(id); else _tabSel.add(id);
  renderTab();
}

function toggleAllTab(check) {
  const q = (document.getElementById('tabSearch').value || '').toLowerCase();
  const lista = q ? _tabLista.filter(t => (t.descricao || '').toLowerCase().includes(q)) : _tabLista;
  lista.forEach(t => { if (check) _tabSel.add(Number(t.id_tabela)); else _tabSel.delete(Number(t.id_tabela)); });
  renderTab();
}

async function salvarTabelas() {
  try {
    await api(`/prepostos/${_tabPrepId}/tabelas-preco`, { method: 'POST', body: JSON.stringify({ ids: [..._tabSel] }) });
    toast('Tabelas de preço atribuídas salvas');
    fecharTab();
    // Se o formulário do mesmo preposto estiver aberto, atualiza o contador
    if (document.getElementById('fId').value == _tabPrepId) atualizarContadorTabelas(_tabPrepId);
  } catch (err) {
    toast(err.message, false);
  }
}

function fecharTab() { document.getElementById('tabPanel').classList.remove('open'); }

// ── Init ──────────────────────────────────────────────────────────────────────
if (!can('incluir_prepostos')) { const b = document.getElementById('btnNovo'); if (b) b.style.display = 'none'; }
carregarVendedores();
carregar();
</script>
</body>
</html>
