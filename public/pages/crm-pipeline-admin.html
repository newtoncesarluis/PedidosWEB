<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Configurar CRM Pipeline | SysRepWeb</title>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<script src="/assets/mobile-app.js"></script>
<script src="/assets/sysrep-api.js?v=1.1.3.24"></script>
<link rel="stylesheet" href="/assets/mobile-app.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: var(--content-bg); --card: var(--card-bg); --border: var(--card-border);
  --text: var(--content-text); --text2: var(--text2); --accent: var(--accent);
  --accent-soft: var(--accent-soft, rgba(13,148,136,.12)); --accent-hover: var(--accent-hover);
  --danger: #ef4444;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
.toolbar { position: sticky; top: 0; z-index: 30; background: var(--card); border-bottom: 1px solid var(--border);
  padding: 12px 18px; display: flex; gap: 12px; align-items: center; }
.title { font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.tb-actions { margin-left: auto; display: flex; gap: 8px; }
.content { padding: 16px; display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 14px; }
.card h3 { font-size: 13px; font-weight: 800; margin-bottom: 12px; }
.pipe-item { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 12px; }
.pipe-item.active { border-color: var(--accent); background: var(--accent-soft); }
.input, .select { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--card); color: var(--text); font: inherit; outline: none; margin-bottom: 8px; }
.btn { border: 1.5px solid var(--border); background: var(--card); color: var(--text); border-radius: 12px;
  padding: 9px 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.etapa-row { display: flex; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 10px; margin-bottom: 8px; }
.etapa-row input[type=color] { width: 32px; height: 32px; border: none; border-radius: 8px; padding: 0; }
.vend-check { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
.field-row { display: flex; gap: 8px; margin-bottom: 8px; }
.field-row .input, .field-row .select { margin-bottom: 0; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="title">Configurar CRM Pipeline</div>
  <div class="tb-actions">
    <a class="btn" href="/pages/crm-pipeline.html">← Voltar ao Kanban</a>
  </div>
</div>

<div class="content">
  <div class="card">
    <h3>Pipelines</h3>
    <div id="pipeList"></div>
    <div class="field-row"><input class="input" id="newPipeNome" placeholder="Nova pipeline"></div>
    <button class="btn btn-primary" onclick="createPipeline()" style="width:100%">+ Criar Pipeline</button>
    <h3 style="margin-top:18px">Motivos de Perda</h3>
    <div id="motivosList"></div>
    <div class="field-row"><input class="input" id="newMotivo" placeholder="Novo motivo"></div>
    <button class="btn" onclick="createMotivo()" style="width:100%">+ Adicionar Motivo</button>
  </div>

  <div>
    <div class="card" id="pipeDetailCard" style="display:none">
      <h3>Etapas da Pipeline</h3>
      <div id="etapasList"></div>
      <div class="field-row">
        <input class="input" id="newEtapaNome" placeholder="Nome da etapa">
        <select class="select" id="newEtapaTipo"><option value="ABERTA">Aberta</option><option value="GANHO">Ganho</option><option value="PERDIDO">Perdido</option></select>
        <input class="input" id="newEtapaProb" type="number" placeholder="% prob." style="max-width:90px">
        <input type="color" id="newEtapaCor" value="#0d9488">
      </div>
      <button class="btn btn-primary" onclick="createEtapa()">+ Adicionar Etapa</button>

      <h3 style="margin-top:20px">Vendedores com Acesso</h3>
      <div id="vendList"></div>
      <button class="btn btn-primary" onclick="saveVendedores()" style="margin-top:10px">Salvar Vendedores</button>
    </div>
  </div>
</div>

<script>
const state = { pipelines: [], currentId: null, vendedores: [] };

async function api(url, options = {}) {
  return SysRepApi.fetch(url, options);
}
function esc(t) { return String(t || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function loadAll() {
  await Promise.all([loadPipelines(), loadMotivos(), loadVendedoresAll()]);
}

async function loadPipelines() {
  const data = await api('/api/crm/pipelines');
  state.pipelines = data.pipelines || [];
  document.getElementById('pipeList').innerHTML = state.pipelines.map(p => `
    <div class="pipe-item ${p.id === state.currentId ? 'active' : ''}" onclick="selectPipeline(${p.id})">
      <span>${esc(p.nome)} ${p.padrao === 'S' ? '⭐' : ''}</span>
      <button class="btn btn-danger" onclick="event.stopPropagation();deletePipeline(${p.id})">✕</button>
    </div>`).join('') || '<div style="font-size:12px;color:var(--text2)">Nenhuma pipeline criada</div>';
}

async function createPipeline() {
  const nome = document.getElementById('newPipeNome').value.trim();
  if (!nome) return;
  await api('/api/crm/pipelines', { method: 'POST', body: JSON.stringify({ nome }) });
  document.getElementById('newPipeNome').value = '';
  await loadPipelines();
}
async function deletePipeline(id) {
  if (!confirm('Excluir esta pipeline?')) return;
  await api('/api/crm/pipelines/' + id, { method: 'DELETE' });
  if (state.currentId === id) { state.currentId = null; document.getElementById('pipeDetailCard').style.display = 'none'; }
  await loadPipelines();
}

async function selectPipeline(id) {
  state.currentId = id;
  document.getElementById('pipeDetailCard').style.display = '';
  await loadPipelines();
  await Promise.all([loadEtapas(id), loadVendedoresPipeline(id)]);
}

async function loadEtapas(id) {
  const data = await api('/api/crm/pipelines/' + id + '/etapas');
  document.getElementById('etapasList').innerHTML = (data.etapas || []).map(e => `
    <div class="etapa-row">
      <input type="color" value="${e.cor}" disabled>
      <strong style="flex:1">${esc(e.nome)}</strong>
      <span style="font-size:11px;color:var(--text2)">${e.tipo} · ${e.probabilidade_padrao}%</span>
      <button class="btn btn-danger" onclick="deleteEtapa(${e.id})">✕</button>
    </div>`).join('') || '<div style="font-size:12px;color:var(--text2)">Sem etapas</div>';
}

async function createEtapa() {
  const nome = document.getElementById('newEtapaNome').value.trim();
  if (!nome || !state.currentId) return;
  await api('/api/crm/pipelines/' + state.currentId + '/etapas', {
    method: 'POST',
    body: JSON.stringify({
      nome,
      tipo: document.getElementById('newEtapaTipo').value,
      probabilidade_padrao: document.getElementById('newEtapaProb').value || 0,
      cor: document.getElementById('newEtapaCor').value,
    })
  });
  document.getElementById('newEtapaNome').value = '';
  document.getElementById('newEtapaProb').value = '';
  await loadEtapas(state.currentId);
}
async function deleteEtapa(id) {
  if (!confirm('Excluir esta etapa?')) return;
  try {
    await api('/api/crm/etapas/' + id, { method: 'DELETE' });
    await loadEtapas(state.currentId);
  } catch (err) { alert(err.message); }
}

async function loadVendedoresAll() {
  try {
    const data = await api('/api/leads/lookup/vendedores');
    state.vendedores = data.vendedores || [];
  } catch (_) { state.vendedores = []; }
}
async function loadVendedoresPipeline(id) {
  const data = await api('/api/crm/pipelines/' + id + '/vendedores');
  const selecionados = new Set((data.vendedores || []).map(v => v.id_usuario));
  document.getElementById('vendList').innerHTML = state.vendedores.map(v => `
    <label class="vend-check">
      <input type="checkbox" value="${v.id}" ${selecionados.has(v.id) ? 'checked' : ''}>
      ${esc(v.nome)}
    </label>`).join('') || '<div style="font-size:12px;color:var(--text2)">Nenhum vendedor cadastrado</div>';
}
async function saveVendedores() {
  const ids = Array.from(document.querySelectorAll('#vendList input:checked')).map(i => i.value);
  await api('/api/crm/pipelines/' + state.currentId + '/vendedores', { method: 'PUT', body: JSON.stringify({ ids_usuario: ids }) });
  alert('Vendedores atualizados.');
}

async function loadMotivos() {
  const data = await api('/api/crm/motivos-perda');
  document.getElementById('motivosList').innerHTML = (data.motivos || []).map(m => `
    <div class="pipe-item">
      <span>${esc(m.descricao)}</span>
      <button class="btn btn-danger" onclick="deleteMotivo(${m.id})">✕</button>
    </div>`).join('') || '<div style="font-size:12px;color:var(--text2)">Nenhum motivo cadastrado</div>';
}
async function createMotivo() {
  const descricao = document.getElementById('newMotivo').value.trim();
  if (!descricao) return;
  await api('/api/crm/motivos-perda', { method: 'POST', body: JSON.stringify({ descricao }) });
  document.getElementById('newMotivo').value = '';
  await loadMotivos();
}
async function deleteMotivo(id) {
  await api('/api/crm/motivos-perda/' + id, { method: 'DELETE' });
  await loadMotivos();
}

loadAll();
</script>
</body>
</html>
