<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inteligência Comercial</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:var(--content-bg);--card:var(--card-bg);--border:var(--card-border);
  --text:var(--content-text);--text2:var(--text2);--accent:var(--accent);
  --accent-hover:var(--accent-hover);--danger:#ef4444;--warn:#f59e0b;--success:#22c55e;
  --input-bg:var(--card-bg);
}
body{font-family:var(--font,'Inter',sans-serif);background:var(--bg);color:var(--text);min-height:100vh}

.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;
  box-shadow:0 4px 12px rgba(0,0,0,.04)}
.toolbar-title{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.sep{width:1px;height:28px;background:var(--border);flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:8px;
  font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border:1.5px solid var(--accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-outline{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn-outline:hover{filter:brightness(.95)}
.btn-danger{background:#ef4444;color:#fff;border:1.5px solid #ef4444}
.btn-success{background:#16a34a;color:#fff;border:1.5px solid #16a34a}
.btn-warn{background:#f59e0b;color:#fff;border:1.5px solid #f59e0b}
.btn-wa{background:#25d366;color:#fff;border:1.5px solid #25d366}
.btn-sm{padding:5px 10px;font-size:11px}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--input-bg);
  color:var(--text);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;
  width:100%;transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}

/* LAYOUT DOIS PAINÉIS */
.page-layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 57px)}
@media(max-width:1024px){.page-layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.left-panel{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:57px;height:calc(100vh - 57px);overflow:hidden}
.left-header{padding:16px;border-bottom:1px solid var(--border)}
.left-header h2{font-size:13px;font-weight:800;margin-bottom:10px}
.left-scroll{flex:1;overflow-y:auto;padding:12px}
.right-panel{padding:20px;overflow-y:auto}

/* BUSCA */
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text2)}
.search-wrap input{padding-left:32px}

/* CLIENTE ITEM na lista */
.cli-item{padding:12px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.cli-item:hover,.cli-item.active{border-color:var(--accent);background:var(--accent-soft,rgba(14,165,233,.06))}
.cli-item-name{font-size:13px;font-weight:700}
.cli-item-meta{font-size:11px;color:var(--text2);margin-top:3px}
.cli-item-score{display:flex;align-items:center;gap:6px;margin-top:6px}
.score-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
.score-bar{height:100%;border-radius:4px;transition:.4s}
.score-val{font-size:12px;font-weight:800;min-width:30px;text-align:right}

/* ABAS NA LISTA */
.list-tabs{display:flex;gap:3px;margin-bottom:12px}
.list-tab{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;
  background:var(--bg);color:var(--text2);transition:.15s;font-family:inherit;border:1px solid var(--border)}
.list-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* CARD PRINCIPAL */
.client-hero{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;
  display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.score-gauge{width:100px;height:100px;flex-shrink:0}
.score-gauge svg{display:block}
.client-hero{align-items:flex-start!important}
.client-info{flex:1;min-width:200px}
.client-info h2{font-size:17px;font-weight:800;margin-bottom:2px;line-height:1.3}
.client-info .sub{font-size:12px;color:var(--text2);margin-bottom:8px}
.client-info .tags{display:flex;gap:6px;flex-wrap:wrap}
.hero-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

/* KPI CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi-card .label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.kpi-card .value{font-size:22px;font-weight:800;margin-top:4px;line-height:1.1}
.kpi-card .sub{font-size:11px;color:var(--text2);margin-top:4px}
.kpi-card .delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-block;margin-top:4px}
.delta-up{background:#dcfce7;color:#15803d}
.delta-down{background:#fee2e2;color:#b91c1c}
.delta-neutral{background:#f1f5f9;color:#64748b}

/* RISCO */
.risco-alto{background:#fee2e2;color:#b91c1c}
.risco-medio{background:#fef3c7;color:#92400e}
.risco-baixo{background:#dcfce7;color:#15803d}

/* ALERTAS */
.alert{padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.alert svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.alert-danger{background:#fee2e2;color:#b91c1c}
.alert-warning{background:#fef3c7;color:#92400e}
.alert-info{background:#dbeafe;color:#1e40af}
.alert-success{background:#dcfce7;color:#15803d}

/* SECTION */
.section{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:20px;overflow:hidden}
.section-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.section-header h3{font-size:13px;font-weight:800;flex:1}
.section-body{padding:16px 20px}

/* TABELA RECOMENDADOS */
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;
  padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
td{font-size:12px;padding:10px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-soft,rgba(14,165,233,.04))}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-recompra{background:#dbeafe;color:#1e40af}
.badge-complementar{background:#f0fdf4;color:#15803d}
.badge-alta{background:#fee2e2;color:#b91c1c}
.badge-media{background:#fef3c7;color:#92400e}
.badge-baixa{background:#f1f5f9;color:#64748b}

/* ABAS */
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:16px}
.tab{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;
  background:transparent;color:var(--text2);transition:.15s;font-family:inherit}
.tab.active{background:var(--accent);color:#fff}

/* MENSAGEM */
.mensagem-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;
  font-size:12px;line-height:1.7;white-space:pre-wrap;font-family:inherit;min-height:80px;margin-bottom:10px}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.charts-grid{grid-template-columns:1fr}}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.chart-wrap h4{font-size:12px;font-weight:700;margin-bottom:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}

/* PEDIDOS TABLE */
.pedido-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.pedido-row:last-child{border-bottom:none}
.pedido-num{font-size:11px;font-weight:800;color:var(--accent)}
.pedido-data{font-size:11px;color:var(--text2)}
.pedido-val{font-size:13px;font-weight:800;margin-left:auto}
.pedido-fab{font-size:11px;color:var(--text2);flex:1;text-align:center}

/* VISTA RANKING */
.ranking-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:20px}

/* LOADER / EMPTY */
.loader{display:flex;align-items:center;justify-content:center;padding:40px}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--text2)}
.empty p{font-size:13px}

/* PLACEHOLDER */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text2)}
.placeholder svg{width:64px;height:64px;opacity:.2;margin-bottom:16px}
.placeholder h3{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text)}
.placeholder p{font-size:13px;max-width:340px;text-align:center}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <span class="toolbar-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;vertical-align:-3px;margin-right:4px">
      <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
    </svg>
    Inteligência Comercial
  </span>
  <div class="sep"></div>
  <button class="btn btn-outline btn-sm" id="btnRanking" onclick="verRanking()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
    Ranking
  </button>
  <button class="btn btn-outline btn-sm" id="btnAlertas" onclick="verAlertas()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
    Alertas
  </button>
  <div style="flex:1"></div>
  <select id="selVendedorFiltro" style="width:auto;min-width:150px;font-size:12px;padding:6px 10px" onchange="carregar()">
    <option value="">Minha carteira</option>
  </select>
</div>

<!-- LAYOUT -->
<div class="page-layout">

  <!-- PAINEL ESQUERDO: lista de clientes -->
  <div class="left-panel">
    <div class="left-header">
      <h2>Selecionar Cliente</h2>
      <div class="list-tabs">
        <button class="list-tab active" onclick="setListaTab('ranking',this)">Ranking</button>
        <button class="list-tab" onclick="setListaTab('risco',this)">Em Risco</button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="inpBuscaCliente" placeholder="Buscar cliente..." oninput="filtrarLista()" autocomplete="off">
      </div>
    </div>
    <div class="left-scroll" id="listaClientes">
      <div class="loader"><div class="spin"></div></div>
    </div>
  </div>

  <!-- PAINEL DIREITO: dashboard do cliente -->
  <div class="right-panel" id="rightPanel">
    <div class="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
      </svg>
      <h3>Selecione um cliente</h3>
      <p>Escolha um cliente na lista ao lado para ver a análise comercial completa com score, recomendações e sugestões de abordagem.</p>
    </div>
  </div>
</div>

<!-- MODAL MENSAGEM -->
<div id="modalMsg" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)this.style.display='none'">
  <div style="background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:600px;border:1px solid var(--border);max-height:90vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h2 id="modalMsgTitulo" style="font-size:15px;font-weight:800"></h2>
      <button class="btn btn-sm btn-outline" onclick="document.getElementById('modalMsg').style.display='none'">Fechar</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setMsgTab('whatsapp',this)">WhatsApp</button>
      <button class="tab" onclick="setMsgTab('chamada',this)">Ligação</button>
      <button class="tab" onclick="setMsgTab('email',this)">E-mail</button>
    </div>
    <div id="msgConteudo" class="mensagem-box"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm btn-outline" onclick="copiarMensagem()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
        Copiar
      </button>
      <button id="btnEnviarWa" class="btn btn-sm btn-wa" onclick="enviarWhatsapp()" style="display:none">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.115.549 4.1 1.509 5.826L.057 23.25l5.563-1.455A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.713 9.713 0 01-4.951-1.352l-.355-.211-3.303.865.882-3.216-.233-.37A9.682 9.682 0 012.25 12c0-5.375 4.375-9.75 9.75-9.75s9.75 4.375 9.75 9.75-4.375 9.75-9.75 9.75z"/></svg>
        Abrir no WhatsApp
      </button>
    </div>
  </div>
</div>

<script>
function token(){ return localStorage.getItem('token')||sessionStorage.getItem('token')||''; }
async function api(url,opts={}){
  const r=await fetch(url,{headers:{Authorization:'Bearer '+token(),...(opts.headers||{})}, ...opts});
  if(!r.ok){const t=await r.text();throw new Error(t);}
  return r.json();
}
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>Number(v||0).toLocaleString('pt-BR');
const pct=v=>(Number(v||0)>0?'+':'')+Number(v||0).toFixed(1)+'%';
const dataBR=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';

let listaTab='ranking', todosClientes=[], clienteAtual=null, dadosAtual=null;
let graficos={}, mensagens={}, tabMsgAtual='whatsapp';

// ─── LISTA LATERAL ────────────────────────────────────────────────────────────
function setListaTab(t,btn){
  listaTab=t;
  document.querySelectorAll('.list-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  carregar();
}

function filtrarLista(){
  const q=(document.getElementById('inpBuscaCliente').value||'').toLowerCase();
  const filtrado=q?todosClientes.filter(c=>(c.nome||'').toLowerCase().includes(q)):todosClientes;
  renderLista(filtrado);
}

function scoreColor(s){ return s>=70?'#22c55e':s>=50?'#f59e0b':'#ef4444'; }

function svgGauge(rawScore){
  const s=Math.min(100,Math.max(0,rawScore));
  const cor=scoreColor(s);
  const r=40, cx=50, cy=50;
  const circ=2*Math.PI*r;
  const offset=circ-(s/100)*circ;
  const label=s>=70?'Ótimo':s>=50?'Regular':'Baixo';
  return `<svg viewBox="0 0 100 100" width="100" height="100">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="9"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cor}" stroke-width="9"
      stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
      stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="47" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="${cor}">${s}</text>
    <text x="${cx}" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#94a3b8">${label}</text>
  </svg>`;
}

function renderLista(lista){
  if(!lista.length){
    document.getElementById('listaClientes').innerHTML='<div class="empty"><p>Nenhum cliente.</p></div>';
    return;
  }
  document.getElementById('listaClientes').innerHTML=lista.map(c=>{
    const s=c.score||0;
    const cor=scoreColor(s);
    return `<div class="cli-item ${clienteAtual===c.id?'active':''}" onclick="analisarCliente(${c.id},'${escHtml(c.nome)}')" data-id="${c.id}">
      <div class="cli-item-name">${c.nome}</div>
      <div class="cli-item-meta">${c.cidade||''}${c.uf?'/'+c.uf:''} · ${c.recencia_dias!=null?c.recencia_dias+'d sem compra':'—'}</div>
      <div class="cli-item-score">
        <div class="score-bar-wrap"><div class="score-bar" style="width:${s}%;background:${cor}"></div></div>
        <span class="score-val" style="color:${cor}">${s}</span>
      </div>
    </div>`;
  }).join('');
}

async function carregar(){
  document.getElementById('listaClientes').innerHTML='<div class="loader"><div class="spin"></div></div>';
  const id_usuario=document.getElementById('selVendedorFiltro').value;
  const params=new URLSearchParams({limit:200});
  if(id_usuario) params.set('id_usuario',id_usuario);
  try{
    const url=listaTab==='risco'?'/api/inteligencia/alertas':'/api/inteligencia/ranking';
    const d=await api(url+'?'+params);
    if(listaTab==='risco'){
      todosClientes=(d.alertas||[]).map(a=>({...a,score:nivelToScore(a.nivel)}));
    } else {
      todosClientes=d.clientes||[];
    }
    renderLista(todosClientes);
  }catch(e){
    document.getElementById('listaClientes').innerHTML=`<div class="empty"><p>${e.message}</p></div>`;
  }
}

function nivelToScore(nivel){ return nivel==='ALTO'?15:nivel==='MÉDIO'?40:65; }

// ─── ANÁLISE DO CLIENTE ───────────────────────────────────────────────────────
async function analisarCliente(id, nome){
  clienteAtual=id;
  document.querySelectorAll('.cli-item').forEach(e=>e.classList.toggle('active',+e.dataset.id===id));
  document.getElementById('rightPanel').innerHTML='<div class="loader" style="height:200px"><div class="spin"></div></div>';
  try{
    const d=await api(`/api/inteligencia/cliente/${id}`);
    dadosAtual=d;
    mensagens=d.mensagens||{};
    renderDashboard(d);
  }catch(e){
    document.getElementById('rightPanel').innerHTML=`<div class="empty"><p>${e.message}</p></div>`;
  }
}

function renderDashboard(d){
  const {cliente:c,score,risco,kpis,alertas,recomendados,produtos_mais_comprados,produtos_parou,produtos_complementares,evolucao_mensal,pedidos_recentes,orcamento_sugerido} = d;

  // Destroi gráficos antigos
  Object.values(graficos).forEach(g=>g?.destroy());
  graficos={};

  const ricoClass={'ALTO':'risco-alto','MÉDIO':'risco-medio','BAIXO':'risco-baixo'}[risco]||'risco-baixo';
  const deltaClass=kpis.variacao_6m_pct>0?'delta-up':kpis.variacao_6m_pct<0?'delta-down':'delta-neutral';

  const html=`
    <!-- ALERTAS -->
    ${alertas.length?`<div style="margin-bottom:16px">${alertas.map(a=>`
      <div class="alert alert-${a.tipo}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>

    <!-- HERO DO CLIENTE -->
    <div class="client-hero">
      <div class="score-gauge">${svgGauge(score)}</div>
      <div class="client-info">
        <h2>${c.nome}</h2>
        <div class="sub">${c.cidade||''}${c.uf?'/'+c.uf:''} · ${c.nome_regiao||''} · Vendedor: ${c.nome_vendedor||'—'}</div>
        <div class="tags">
          <span class="badge ${ricoClass}">Risco ${risco}</span>
          ${c.venda_suspensa==='S'?'<span class="badge" style="background:#fee2e2;color:#b91c1c">Venda Suspensa</span>':''}

        </div>
        <div class="hero-actions">
          <button class="btn btn-sm btn-wa" onclick="abrirMensagem('WhatsApp','${c.foneprincipal||''}')">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
            WhatsApp
          </button>
          <button class="btn btn-sm btn-outline" onclick="abrirMensagem('Ligação')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            Ligação
          </button>
          <button class="btn btn-sm btn-outline" onclick="abrirMensagem('E-mail')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            E-mail
          </button>
          <button class="btn btn-sm btn-primary" onclick="gerarOrcamento()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Orçamento
          </button>
        </div>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="label">Ticket Médio</div>
        <div class="value" style="font-size:16px">${money(kpis.ticket_medio)}</div>
        <div class="sub">vs. carteira: ${money(kpis.ticket_carteira)}</div>
      </div>
      <div class="kpi-card">
        <div class="label">Última Compra</div>
        <div class="value" style="font-size:18px">${kpis.recencia_dias}d</div>
        <div class="sub">${dataBR(c.dtultimacompra)}</div>
      </div>
      <div class="kpi-card">
        <div class="label">Frequência</div>
        <div class="value">${kpis.pedidos_por_mes.toFixed(1)}/mês</div>
        <div class="sub">${kpis.total_pedidos_12m} pedidos em 12m</div>
      </div>
      <div class="kpi-card">
        <div class="label">Total 12 meses</div>
        <div class="value" style="font-size:16px">${money(kpis.total_comprado_12m)}</div>
        <div class="sub">em ${kpis.total_pedidos_12m} pedidos</div>
      </div>
      <div class="kpi-card">
        <div class="label">Tendência 6m</div>
        <div class="value" style="font-size:18px">${kpis.variacao_6m_pct>0?'+':''}${kpis.variacao_6m_pct.toFixed(1)}%</div>
        <span class="delta ${deltaClass}">${pct(kpis.variacao_6m_pct)}</span>

    <div class="section">

        <h3>Produtos Recomendados</h3>
        <span style="font-size:11px;color:var(--text2)">${recomendados.length} recomendação(ões) baseadas em dados reais</span>
      </div>
      <div class="section-body" style="padding:0">
        ${recomendados.length?`<table>
          <thead><tr>
            <th>Produto</th><th>Tipo</th><th>Prioridade</th><th>Motivo</th><th>Ação</th>
          </tr></thead>
          <tbody>${recomendados.map(p=>`<tr>
            <td><strong>${p.descricao}</strong></td>
            <td><span class="badge badge-${p.tipo.toLowerCase()}">${p.tipo}</span></td>
            <td><span class="badge badge-${p.prioridade.toLowerCase()}">${p.prioridade}</span></td>
            <td style="max-width:200px;font-size:11px;color:var(--text2)">${p.motivo}</td>
            <td>
              <button class="btn btn-sm btn-outline" onclick="addAoOrcamento('${escHtml(p.codproduto)}','${escHtml(p.descricao)}')">+ Orç.</button>
            </td>
          </tr>`).join('')}</tbody>
        </table>`:'<div class="empty"><p>Sem recomendações no momento.</p></div>'}
      </div>
    </div>

    <!-- GRÁFICOS -->
    <div class="charts-grid">
      <div class="chart-wrap">
        <h4>Evolução de Compras (12m)</h4>
        <canvas id="chartEvolucao" height="200"></canvas>
      </div>
      <div class="chart-wrap">
        <h4>Top Produtos</h4>
        <canvas id="chartProdutos" height="200"></canvas>
      </div>
    </div>

    <!-- PRODUTOS QUE PAROU -->
    ${produtos_parou.length?`
    <div class="section" style="margin-top:20px">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:#f59e0b"><path d="M12 9v2m0 4h.01M5 20h14a2 2 0 001.94-1.515L21 9.485A2 2 0 0019 7H5a2 2 0 00-1.94 2.485l.94 9A2 2 0 005 20z"/></svg>
        <h3>Produtos que o Cliente Parou de Comprar</h3>
        <span style="font-size:11px;color:var(--warn);font-weight:700">${produtos_parou.length} produto(s)</span>

      <div class="section-body" style="padding:0">
        <table>
          <thead><tr>
            <th>Produto</th><th>Última Compra</th><th>Dias Parado</th><th>Histórico</th>
          </tr></thead>
          <tbody>${produtos_parou.map(p=>`<tr>
            <td><strong>${p.descricao}</strong></td>
            <td>${dataBR(p.ultima_compra)}</td>

    <!-- PEDIDOS RECENTES -->
    <div class="section" style="margin-top:20px">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <h3>Histórico de Pedidos (últimos 24m)</h3>
      </div>
      <div class="section-body">
        ${pedidos_recentes.length?pedidos_recentes.map(p=>`
          <div class="pedido-row">
            <div><div class="pedido-num">#${p.numero||p.id}</div><div class="pedido-data">${dataBR(p.data_abertura)}</div></div>

      </div>
    </div>
  `;
  document.getElementById('rightPanel').innerHTML=html;

  // Evolução mensal
  const eCtx=document.getElementById('chartEvolucao')?.getContext('2d');
  if(eCtx && evolucao_mensal.length){
    graficos.evolucao=new Chart(eCtx,{type:'bar',data:{
      labels:evolucao_mensal.map(m=>m.mes.slice(5)+'/'+m.mes.slice(0,4)),
      datasets:[{label:'R$',data:evolucao_mensal.map(m=>m.valor||0),backgroundColor:'rgba(14,165,233,.7)',borderRadius:6}]
    },options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>money(v)},grid:{color:'rgba(0,0,0,.05)'}},x:{grid:{display:false}}}}});
  }

  // Top produtos
  const pCtx=document.getElementById('chartProdutos')?.getContext('2d');
  if(pCtx && produtos_mais_comprados.length){
    const top=produtos_mais_comprados.slice(0,6);
    graficos.produtos=new Chart(pCtx,{type:'bar',data:{
      labels:top.map(p=>p.descricao.length>20?p.descricao.slice(0,18)+'…':p.descricao),
      datasets:[{label:'R$',data:top.map(p=>p.valor_total||0),backgroundColor:'rgba(20,184,166,.7)',borderRadius:6}]
    },options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>money(v)},grid:{color:'rgba(0,0,0,.05)'}},y:{grid:{display:false}}}}});
  }
}

// ─── MENSAGENS ────────────────────────────────────────────────────────────────
function abrirMensagem(tipo, fone){
  if(!dadosAtual) return;
  document.getElementById('modalMsgTitulo').textContent='Sugestão de '+tipo;
  tabMsgAtual=tipo==='WhatsApp'?'whatsapp':tipo==='Ligação'?'chamada':'email';
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab')[['whatsapp','chamada','email'].indexOf(tabMsgAtual)].classList.add('active');
  document.getElementById('msgConteudo').textContent=mensagens[tabMsgAtual]||'';
  const btnWa=document.getElementById('btnEnviarWa');
  if(tabMsgAtual==='whatsapp' && fone){
    btnWa.style.display='inline-flex';
    btnWa.onclick=()=>{
      const tel=String(fone).replace(/\D/g,'');
      const msg=encodeURIComponent(mensagens.whatsapp||'');
      window.open(`https://wa.me/55${tel}?text=${msg}`,'_blank');
    };
  } else btnWa.style.display='none';
  document.getElementById('modalMsg').style.display='flex';
}

function setMsgTab(t,btn){
  tabMsgAtual=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('msgConteudo').textContent=mensagens[t]||'';
  const btnWa=document.getElementById('btnEnviarWa');
  btnWa.style.display=t==='whatsapp'&&dadosAtual?.cliente?.foneprincipal?'inline-flex':'none';
}

function copiarMensagem(){
  const txt=document.getElementById('msgConteudo').textContent;
  navigator.clipboard.writeText(txt).then(()=>{alert('Mensagem copiada!');}).catch(()=>{});
}

// ─── ORÇAMENTO ────────────────────────────────────────────────────────────────
function gerarOrcamento(){
  if(!dadosAtual) return;
  const itens=dadosAtual.orcamento_sugerido||[];
  if(!itens.length){ alert('Sem itens sugeridos para orçamento.'); return; }
  alert(`Orçamento sugerido com ${itens.length} produto(s):\n\n${itens.map(i=>`• ${i.descricao} (qtd: ${i.quantidade})`).join('\n')}\n\nImplemente a integração com o módulo de pedidos para criar automaticamente.`);
}

function addAoOrcamento(cod, desc){
  alert(`Produto "${desc}" adicionado à fila de orçamento.`);
}

// ─── RANKING/ALERTAS ──────────────────────────────────────────────────────────
function verRanking(){ setListaTab('ranking',document.querySelectorAll('.list-tab')[0]); }
function verAlertas(){ setListaTab('risco',document.querySelectorAll('.list-tab')[1]); }

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function escHtml(s){ return String(s||'').replace(/'/g,"\\'"); }

async function carregarVendedores(){
  try{
    const d=await api('/api/vendedores');
    const sel=document.getElementById('selVendedorFiltro');
    (d.vendedores||[]).forEach(v=>{
      const o=document.createElement('option');
      o.value=v.id; o.textContent=v.nome;
      sel.appendChild(o);
    });
  }catch(e){}
}

// Init
carregarVendedores();
carregar();
</script>
