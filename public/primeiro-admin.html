<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração Inicial — SysRepWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .icon-wrap {
      width: 52px; height: 52px; border-radius: 14px;
      background: #0ea5e922;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    h1 { font-size: 18px; font-weight: 700; color: #fff; text-align: center; }
    .subtitle { font-size: 13px; color: #64748b; text-align: center; margin-top: 6px; margin-bottom: 28px; line-height: 1.5; }
    .step-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #0ea5e915; border: 1px solid #0ea5e930;
      color: #38bdf8; font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: 20px; margin-bottom: 20px;
    }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 13px; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px;
      color: #e2e8f0; font-size: 14px; font-family: inherit;
      transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #0ea5e9; }
    .field { margin-bottom: 16px; }
    .btn {
      width: 100%; padding: 11px; border-radius: 9px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 8px;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: #0ea5e9; color: #fff; }
    .btn-primary:hover { background: #38bdf8; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .alert { padding: 10px 13px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    .alert-err { background: #ef444420; border: 1px solid #ef444440; color: #fca5a5; }
    .alert-ok  { background: #22c55e20; border: 1px solid #22c55e40; color: #86efac; }
    .divider { border: none; border-top: 1px solid #334155; margin: 20px 0; }
    .hint { font-size: 11px; color: #475569; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="#38bdf8" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1>Criar Administrador</h1>
    <p class="subtitle">Primeira configuração do sistema.<br>Crie a conta de administrador para começar.</p>

    <div class="step-badge">
      <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Banco de dados conectado
    </div>

    <div id="alert-err" class="alert alert-err"></div>
    <div id="alert-ok"  class="alert alert-ok"></div>

    <div id="form-area">
      <div class="field">
        <label>Nome completo *</label>
        <input id="nome" type="text" placeholder="Ex: João Silva" autocomplete="name">
      </div>
      <div class="field">
        <label>E-mail *</label>
        <input id="email" type="email" placeholder="admin@empresa.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Senha *</label>
        <input id="senha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        <p class="hint">Guarde bem — não há recuperação automática</p>
      </div>
      <div class="field">
        <label>Confirmar senha *</label>
        <input id="confirmar" type="password" placeholder="Repita a senha" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')criar()">
      </div>
      <button class="btn btn-primary" id="btn-criar" onclick="criar()">Criar Administrador</button>
    </div>
  </div>

  <script>
    // Verifica se realmente precisa de setup (segurança extra)
    fetch('/api/primeiro-admin/check')
      .then(r => r.json())
      .then(d => {
        if (!d.needsSetup) window.location.href = '/login.html';
      })
      .catch(() => {});

    async function criar() {
      const btn  = document.getElementById('btn-criar');
      const errEl = document.getElementById('alert-err');
      const okEl  = document.getElementById('alert-ok');
      errEl.style.display = 'none';
      okEl.style.display  = 'none';

      const nome     = document.getElementById('nome').value.trim();
      const email    = document.getElementById('email').value.trim();
      const senha    = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar').value;

      if (!nome || !email || !senha) {
        errEl.textContent = 'Preencha todos os campos obrigatórios.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Criando...';

      try {
        const r = await fetch('/api/primeiro-admin/criar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha, confirmar }),
        });
        const d = await r.json();
        if (!r.ok || d.error) {
          errEl.textContent = d.error || 'Erro desconhecido';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Criar Administrador';
          return;
        }
        okEl.textContent = 'Administrador criado com sucesso! Redirecionando para o login…';
        okEl.style.display = 'block';
        document.getElementById('form-area').style.opacity = '.4';
        setTimeout(() => window.location.href = '/login.html', 2000);
      } catch (e) {
        errEl.textContent = 'Erro de conexão: ' + e.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Criar Administrador';
      }
    }
  </script>
</body>
</html>
