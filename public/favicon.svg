<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#0f1c35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60c8ff"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60c8ff"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  <!-- Outer ring arc -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ring)" stroke-width="12" stroke-dasharray="980 330" stroke-dashoffset="-80" opacity="0.7"/>
  <!-- PW letters -->
  <text x="256" y="330" font-family="Arial Black, sans-serif" font-weight="900" font-size="240" text-anchor="middle" fill="url(#blue)" filter="url(#shadow)" letter-spacing="-10">PW</text>
  <!-- Small dot accent (top) -->
  <circle cx="256" cy="62" r="22" fill="url(#blue)" opacity="0.9"/>
</svg>
