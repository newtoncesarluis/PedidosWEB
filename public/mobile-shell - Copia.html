<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<script src="/assets/sw-kill.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#19324d">
<title>PedidosWeb</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PedidosWeb">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<link rel="stylesheet" href="/assets/themes.css">
<script src="/assets/themes.js"></script>
<script src="/assets/mobile-client-log.js"></script>
<script src="/assets/pedidos-offline-pack.js"></script>
<script src="/assets/offline-db.js"></script>
<script src="/assets/offline-sync.js"></script>
<style>
  :root {
    --ms-nav-h: 74px;
    --ms-top-h: 64px;
    --ms-shell-max: 820px;
    --ms-shell-pad: clamp(12px, 3vw, 22px);
    --ms-bg: #f3f5f8;
    --ms-surface: oklch(100% 0 0);
    --ms-fg: #19324d;
    --ms-muted: #6f7f90;
    --ms-border: #dfe5ec;
    --ms-accent: #2563eb;
    --ms-accent-strong: #1d4ed8;
    --ms-accent-soft: #eff6ff;
    --ms-surface-soft: #f7f8fa;
    --ms-surface-strong: #ecf0f4;
    --ms-text-strong: color-mix(in oklab, var(--ms-fg) 92%, black 8%);
    --ms-focus: color-mix(in oklab, var(--ms-accent) 28%, white 72%);
    --ms-shadow: 0 10px 24px rgba(25, 50, 77, .08);
  }
  html[data-theme="dark"] {
    --ms-bg: #0f1722;
    --ms-surface: #172230;
    --ms-fg: #f4f7fb;
    --ms-muted: #aeb9c7;
    --ms-border: #263547;
    --ms-accent: #3b82f6;
    --ms-accent-strong: #60a5fa;
    --ms-accent-soft: #1e3a5f;
    --ms-surface-soft: #1e2a39;
    --ms-surface-strong: #223041;
    --ms-text-strong: #f8fafc;
    --ms-focus: color-mix(in oklab, var(--ms-accent) 34%, white 66%);
    --ms-shadow: 0 16px 36px rgba(3, 8, 15, .32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--font-body, 'Open Sans', system-ui, sans-serif);
    background: var(--ms-bg);
    color: var(--ms-fg);
    -webkit-font-smoothing: antialiased;
  }
  body { color-scheme: light; }
  html[data-theme="dark"] body { color-scheme: dark; }

  /* Top Bar — neutro (Opção 2) */
  #ms-top {
    height: var(--ms-top-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 var(--ms-shell-pad);
    background: var(--ms-surface);
    color: var(--ms-fg);
    flex-shrink: 0;
    border-bottom: 1px solid var(--ms-border);
    box-shadow: 0 1px 3px rgba(25, 50, 77, .05);
    position: relative;
    z-index: 51;
    transition: transform .22s ease, opacity .22s ease;
  }
  .ms-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .ms-brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
  }
  .ms-brand-mark::before {
    content: '';
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: #fff;
    box-shadow: 8px 0 0 rgba(255,255,255,.46), 0 8px 0 rgba(255,255,255,.46);
  }
  #ms-top strong {
    font-family: var(--font-display, 'Montserrat', system-ui, sans-serif);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.02em;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #ms-top .ms-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-inline-start: auto;
    flex-shrink: 0;
  }
  .ms-btn {
    min-height: 42px;
    border: 1px solid var(--ms-border);
    background: var(--ms-surface-soft);
    color: var(--ms-fg);
    font-size: 12px;
    font-weight: 700;
    padding: 0 15px;
    border-radius: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .ms-btn:hover {
    background: var(--ms-surface-strong);
    border-color: color-mix(in oklab, var(--ms-border) 70%, var(--ms-accent) 30%);
  }
  .ms-btn:active { transform: scale(.97); }
  .ms-btn:focus-visible,
  .ms-nav-item:focus-visible,
  .ms-sheet-link:focus-visible {
    outline: 2px solid var(--ms-focus);
    outline-offset: 2px;
  }
  .ms-btn-ghost {
    background: transparent;
    color: var(--ms-muted);
    border: 1px solid var(--ms-border);
  }
  .ms-btn-primary {
    min-height: 38px;
    padding-inline: 13px;
    background: var(--ms-accent);
    color: #fff;
    border-color: transparent;
    border-radius: 9px;
    box-shadow: 0 2px 8px rgba(37, 99, 235, .22);
    font-family: var(--font-display, 'Montserrat', system-ui, sans-serif);
    font-weight: 700;
    font-size: 11.5px;
  }
  html[data-theme="dark"] .ms-btn-primary {
    box-shadow: 0 4px 14px rgba(0, 0, 0, .28);
  }
  html[data-theme="dark"] #ms-top {
    background: var(--ms-surface);
    border-bottom-color: var(--ms-border);
    box-shadow: 0 1px 0 rgba(255,255,255,.04);
  }
  html[data-theme="dark"] #ms-nav {
    background: var(--ms-surface);
  }
  html[data-theme="dark"] #ms-frame {
    background: var(--ms-surface);
  }
  .ms-btn-primary:active { filter: brightness(0.92); }
  .ms-btn-icon {
    width: 40px;
    min-width: 40px;
    padding: 0;
    justify-content: center;
  }

  /* FAB — Novo Pedido */
  #ms-btn-novo-pedido {
    position: fixed;
    right: 18px;
    bottom: calc(var(--ms-nav-h) + 14px);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: var(--ms-accent);
    color: #fff;
    box-shadow: 0 4px 16px rgba(37, 99, 235, .32);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 49;
    transition: transform .15s, background .2s, box-shadow .2s, bottom .22s ease, opacity .18s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  #ms-btn-novo-pedido.ms-fab-hidden { display: none !important; }
  body.ms-chrome-hidden #ms-btn-novo-pedido:not(.ms-fab-hidden) {
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  #ms-btn-novo-pedido:active { transform: scale(.91); }
  #ms-btn-novo-pedido.fab-back {
    background: var(--ms-surface);
    color: var(--ms-fg);
    border: 1.5px solid var(--ms-border);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
  }
  html[data-theme="dark"] #ms-btn-novo-pedido {
    box-shadow: 0 4px 18px rgba(0, 0, 0, .42);
  }

  /* Banner */
  #ms-banner {
    display: none;
    padding: 9px var(--ms-shell-pad);
    font-size: 12px;
    font-weight: 600;
    background: color-mix(in oklab, var(--ms-accent) 12%, white 88%);
    color: var(--ms-fg);
    border-bottom: 1px solid color-mix(in oklab, var(--ms-accent) 18%, white 82%);
    text-align: center;
  }
  #ms-banner.show { display: block; }

  /* Barra de resumo do dia — KPI cards (card branco) */
  #ms-summary {
    height: 0;
    overflow: hidden;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--ms-surface);
    border-bottom: 1px solid var(--ms-border);
    padding: 0 var(--ms-shell-pad);
    transition: height .25s, padding .25s, opacity .22s ease;
    flex-shrink: 0;
  }
  #ms-summary.show {
    height: 78px;
    padding: 10px var(--ms-shell-pad);
  }
  body.has-summary { --summary-h: 78px; }
  .sum-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--ms-muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .sum-card + .sum-card {
    border-left: 1px solid var(--ms-border);
  }
  .sum-card-ico {
    font-size: 14px;
    line-height: 1;
    margin-bottom: 1px;
    opacity: .85;
  }
  .sum-card-val {
    font-size: 15px;
    font-weight: 800;
    color: var(--ms-fg);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  #ms-sum-pedidos .sum-card-val { color: var(--ms-accent); }
  #ms-sum-valor .sum-card-val   { color: #059669; }
  #ms-sum-visitas .sum-card-val { color: #7c3aed; }
  @keyframes ms-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  #ms-summary:not(.loaded) .sum-card-val {
    color: transparent;
    background: linear-gradient(90deg, rgba(148,163,184,.12) 25%, rgba(148,163,184,.28) 50%, rgba(148,163,184,.12) 75%);
    background-size: 200% 100%;
    animation: ms-shimmer 1.4s ease-in-out infinite;
    border-radius: 4px;
    min-width: 32px;
  }
  #ms-summary:not(.loaded) .sum-card-ico { opacity: .35; }
  #ms-summary .sum-loading {
    display: inline-block;
    width: 10px; height: 10px;
    border: 1.5px solid rgba(148,163,184,.35);
    border-top-color: var(--ms-accent);
    border-radius: 50%;
    animation: ms-spin .7s linear infinite;
    vertical-align: middle;
  }

  /* Banner offline */
  #ms-offline-banner {
    display: none;
    padding: 8px var(--ms-shell-pad);
    font-size: 11px;
    font-weight: 700;
    background: #24384d;
    color: var(--ms-surface);
    border-bottom: 1px solid rgba(255,255,255,.08);
    text-align: center;
    letter-spacing: 0.02em;
  }
  #ms-offline-banner.show { display: block; }
  body.has-offline-banner { --offline-h: 30px; }

  /* Pull-to-refresh spinner */
  #ms-ptr {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 0;
    overflow: hidden;
    background: var(--ms-bg);
    transition: height .2s;
    z-index: 60;
  }
  #ms-ptr.active { height: 52px; }
  #ms-ptr-spinner {
    width: 24px; height: 24px;
    border: 3px solid color-mix(in oklab, var(--ms-accent) 16%, transparent);
    border-top-color: var(--ms-accent);
    border-radius: 50%;
    animation: ms-spin .7s linear infinite;
  }
  @keyframes ms-spin { to { transform: rotate(360deg); } }

  /* Frame */
  #ms-frame-wrap {
    position: absolute;
    top: calc(var(--ms-top-h) + var(--summary-h, 0px) + var(--banner-h, 0px) + var(--offline-h, 0px));
    left: 0; right: 0;
    bottom: var(--ms-nav-h);
    padding: 0;
    transition: top .22s ease, bottom .22s ease;
  }
  body.ms-chrome-hidden {
    --ms-top-h: 0px;
    --ms-nav-h: 0px;
    --summary-h: 0px;
  }
  body.ms-chrome-hidden.has-summary { --summary-h: 0px; }
  body.ms-chrome-hidden #ms-top,
  body.ms-chrome-hidden #ms-summary {
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
    height: 0 !important;
    padding: 0 !important;
    border: none !important;
  }
  body.ms-chrome-hidden #ms-nav {
    transform: translateX(-50%) translateY(110%);
    opacity: 0;
    pointer-events: none;
  }
  body.has-banner { --banner-h: 34px; }
  #ms-frame {
    width: 100%; height: 100%;
    border: none;
    background: var(--ms-surface);
    display: block;
  }

  /* Bottom Nav */
  #ms-nav {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: min(100%, var(--ms-shell-max));
    height: var(--ms-nav-h);
    display: flex;
    align-items: stretch;
    background: var(--ms-surface);
    border: 1px solid var(--ms-border);
    border-bottom: 0;
    border-radius: 18px 18px 0 0;
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom, 0);
    box-shadow: 0 -8px 20px rgba(25, 50, 77, .08);
    transition: transform .24s cubic-bezier(.22,1,.36,1), opacity .22s ease;
  }
  .ms-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    color: var(--ms-muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0;
    border: none;
    background: none;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: color .18s;
    position: relative;
  }
  .ms-nav-item.active { color: var(--ms-accent); font-weight: 800; }
  .ms-nav-item.active .ms-nav-ico { transform: scale(1.08); }
  .ms-nav-ico {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 28px;
    border-radius: 14px;
    transition: transform .15s, background .18s, color .18s;
  }
  .ms-nav-ico svg {
    width: 22px;
    height: 22px;
  }
  .ms-nav-item.active .ms-nav-ico {
    background: color-mix(in oklab, var(--ms-accent) 16%, transparent);
    color: var(--ms-accent);
    box-shadow: none;
  }
  .ms-nav-item:active .ms-nav-ico { transform: scale(.9); }

  /* Bottom Sheet */
  #ms-sheet-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 29, 43, .34);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  #ms-sheet-overlay.open { display: flex; }
  #ms-sheet {
    width: 100%;
    max-width: 480px;
    background: var(--ms-surface);
    border: 1px solid var(--ms-border);
    border-radius: 20px 20px 0 0;
    padding: 10px 14px calc(18px + env(safe-area-inset-bottom));
    animation: msUp .25s cubic-bezier(.22,1,.36,1);
    box-shadow: var(--ms-shadow);
  }
  #ms-sheet::before {
    content: '';
    display: block;
    width: 42px;
    height: 4px;
    border-radius: 4px;
    background: color-mix(in oklab, var(--ms-border) 60%, var(--ms-muted) 40%);
    margin: 4px auto 12px;
  }
  @keyframes msUp { from { transform: translateY(100%); } to { transform: none; } }
  .ms-sheet-title {
    font-family: var(--font-display, 'Montserrat', system-ui, sans-serif);
    font-size: 11px;
    font-weight: 700;
    color: var(--ms-muted);
    margin-bottom: 12px;
    padding: 4px 4px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .ms-sheet-link {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 56px;
    padding: 12px 14px;
    border: 1px solid var(--ms-border);
    border-radius: 10px;
    background: var(--ms-surface);
    color: var(--ms-fg);
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: background .12s, transform .1s, border-color .12s, color .12s;
    -webkit-tap-highlight-color: transparent;
  }
  #ms-sheet-close {
    justify-content: center;
    color: var(--ms-text-strong);
    background: var(--ms-surface-soft);
    border-color: var(--ms-border);
    font-size: 14px;
    margin-top: 4px;
  }
  #ms-sheet-close:hover,
  #ms-sheet-close:active {
    background: var(--ms-surface);
    border-color: color-mix(in oklab, var(--ms-border) 70%, var(--ms-accent) 30%);
  }
  html[data-theme="dark"] #ms-sheet-close {
    background: var(--ms-surface);
    color: var(--ms-fg);
    border-color: var(--ms-border);
  }
  html[data-theme="dark"] #ms-sheet-close:hover,
  html[data-theme="dark"] #ms-sheet-close:active {
    background: color-mix(in oklab, var(--ms-surface) 82%, var(--ms-bg) 18%);
  }
  .ms-sheet-link:active { transform: scale(.98); background: var(--ms-accent-soft); }
  .ms-sheet-link:hover { border-color: color-mix(in oklab, var(--ms-border) 70%, var(--ms-accent) 30%); }
  .ms-danger { color: #dc2626 !important; }
  .ms-sheet-group-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ms-muted);
    padding: 4px 4px 6px;
    margin-top: 4px;
  }
  .ms-sheet-sep {
    height: 1px;
    background: var(--ms-border);
    margin: 8px 0 10px;
  }

  /* Seletor de tema mobile */
  #ms-theme-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 210;
    background: rgba(17, 29, 43, .34);
    align-items: flex-end;
    justify-content: center;
  }
  #ms-theme-overlay.open { display: flex; }
  #ms-theme-panel {
    width: 100%;
    max-width: 480px;
    background: var(--ms-surface);
    border: 1px solid var(--ms-border);
    border-radius: 20px 20px 0 0;
    padding: 10px 14px calc(18px + env(safe-area-inset-bottom));
    animation: msUp .25s cubic-bezier(.22,1,.36,1);
    box-shadow: var(--ms-shadow);
  }
  #ms-theme-panel::before {
    content: '';
    display: block;
    width: 42px;
    height: 4px;
    border-radius: 4px;
    background: color-mix(in oklab, var(--ms-border) 60%, var(--ms-muted) 40%);
    margin: 4px auto 12px;
  }
  .ms-theme-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--ms-fg);
    margin: 0 4px 4px;
    letter-spacing: -0.02em;
  }
  .ms-theme-sub {
    font-size: 12px;
    color: var(--ms-muted);
    margin: 0 4px 14px;
    line-height: 1.4;
  }
  .ms-theme-option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 52px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1.5px solid var(--ms-border);
    border-radius: 12px;
    background: var(--ms-surface);
    color: var(--ms-fg);
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    transition: background .12s, border-color .12s, transform .1s;
  }
  .ms-theme-option:active { transform: scale(.98); }
  .ms-theme-option.active {
    border-color: var(--ms-accent);
    background: var(--ms-accent-soft);
    color: var(--ms-accent-strong);
  }
  .ms-theme-option-ico {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    background: var(--ms-surface-soft);
  }
  .ms-theme-option.active .ms-theme-option-ico {
    background: color-mix(in oklab, var(--ms-accent) 18%, white 82%);
  }
  .ms-theme-more {
    width: 100%;
    min-height: 44px;
    margin-top: 4px;
    border: none;
    background: transparent;
    color: var(--ms-accent);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    padding: 8px;
  }
  .ms-theme-close {
    width: 100%;
    min-height: 44px;
    margin-top: 2px;
    border-radius: 10px;
    border: 1px solid var(--ms-border);
    background: var(--ms-surface);
    color: var(--ms-muted);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .ms-sheet-ico {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .ms-sheet-ico svg { width: 18px; height: 18px; }

  /* Perfil no topo do sheet */
  #ms-sheet-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 4px 14px;
    border-bottom: 1px solid var(--ms-border);
    margin-bottom: 10px;
  }
  .ms-sheet-profile-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--ms-accent);
    color: #fff;
    font-size: 14px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    letter-spacing: .02em;
    box-shadow: 0 2px 8px rgba(14,165,233,.30);
  }
  .ms-sheet-profile-name {

(function () {

    try {
      var path = (frame.contentWindow.location.pathname || '').toLowerCase();
      if (path.indexOf('home.html') < 0) return false;
      var doc = frame.contentDocument;
      if (!doc) return true;
      var ic = doc.getElementById('iframe-container');

      var ds = doc.getElementById('dash_scroll');

    try {
      var saved = localStorage.getItem('sysrep_theme') || 'sistema';

  function getEmbeddedFieldNode(input) {
    if (!input) return null;
    return input.closest('.form-group, .filter, [class*="col-"]') || input.parentElement;
  }

  function markEmbeddedFieldOrder(doc, id, order) {
    var input = doc.getElementById(id);
    if (!input) return;
    var block = getEmbeddedFieldNode(input);
    if (!block) return;

  }

  function setEmbeddedFieldFull(doc, id) {
    var input = doc.getElementById(id);
    if (!input) return;
    var block = getEmbeddedFieldNode(input);
    if (!block) return;
    block.classList.add('filter-full');
    block.style.gridColumn = '1 / -1';
  }

  function enhanceContasPagar(doc) {

    hideEmbeddedButtonByText(doc, ['incluir conta']);
    hideEmbeddedButtonByText(doc, ['colunas']);
    hideEmbeddedButtonByText(doc, ['exportar csv']);
    renameEmbeddedButtonByText(doc, ['relatórios', 'relatorios'], 'PDF / Imprimir');
    arrangeEmbeddedButtonPair(doc, ['lancar conta paga', 'lançar conta paga'], ['pdf / imprimir', 'relatórios', 'relatorios'], 'msEmbeddedPagarActions');
  }

  function normalizeEmbeddedLabel(value) {
    return (value || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/\s+/g, ' ')

  function findEmbeddedButtonByText(doc, labels) {
    var expected = (labels || []).map(normalizeEmbeddedLabel);
    var nodes = doc.querySelectorAll('button, input[type="button"], input[type="submit"], a.btn, .btn, [role="button"]');
    for (var i = 0; i < nodes.length; i += 1) {

    return node;

    if (!common) return;

    var leftNode = getEmbeddedActionNode(leftBtn, common);
    var rightNode = getEmbeddedActionNode(rightBtn, common);
    if (!leftNode || !rightNode || leftNode === rightNode) return;
    if (leftNode.parentElement !== common || rightNode.parentElement !== common) return;

      common.insertBefore(wrapper, leftNode);

    var nodeB = getEmbeddedActionNode(btnB, common);
    var nodeC = getEmbeddedActionNode(btnC, common);
    if (!nodeA || !nodeB || !nodeC) return;

    if (nodeA.parentElement !== common || nodeB.parentElement !== common || nodeC.parentElement !== common) return;

  function arrangeEmbeddedFieldPair(doc, leftId, rightId, wrapperId) {

    var leftNode = getEmbeddedFieldNode(left);
    var rightNode = getEmbeddedFieldNode(right);
    if (!leftNode || !rightNode || leftNode === rightNode) return;

    var common = findEmbeddedCommonParent(leftNode, rightNode);
    if (!common || leftNode.parentElement !== common || rightNode.parentElement !== common) return;

    leftNode.classList.remove('filter-full');
    rightNode.classList.remove('filter-full');
    leftNode.style.gridColumn = 'auto';
    rightNode.style.gridColumn = 'auto';

    var wrapper = doc.getElementById(wrapperId);
    if (!wrapper) {
      wrapper = doc.createElement('div');
      wrapper.id = wrapperId;
      wrapper.className = 'ms-embedded-inline-pair';
      common.insertBefore(wrapper, leftNode);
    }

    if (!wrapper.contains(leftNode)) wrapper.appendChild(leftNode);
    if (!wrapper.contains(rightNode)) wrapper.appendChild(rightNode);
  }

  function _atualizarStatusOfflinePack() {
    var span = document.getElementById('ms-offline-pack-status');
    if (!span || !window.SysRepPedidosOfflinePack) return;
    var tkn = localStorage.getItem('token') || sessionStorage.getItem('token') || '';
    var uid = SysRepPedidosOfflinePack.userIdFromToken(tkn);
    var until = uid ? SysRepPedidosOfflinePack.getOfflineUntil(uid) : 0;
    if (until > Date.now()) {
      var vencDia = new Date(until).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      span.textContent = 'OK até ' + vencDia;
      span.style.cssText = 'margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#d1fae5;color:#065f46;display:inline-block';
    } else if (until > 0) {
      span.textContent = 'Expirado';
      span.style.cssText = 'margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#fee2e2;color:#991b1b;display:inline-block';
    } else {
      span.style.display = 'none';
    }
  }
  _atualizarStatusOfflinePack();

  document.getElementById('ms-sheet').addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== this) {
      if (el.id === 'ms-btn-preparar-offline') {
        _msPrepararOfflineClick(el);
        return;
      }
      el = el.parentElement;
    }
  });

  function _msPrepararOfflineClick(btn) {
    console.log('[SysRep] preparar-offline: click, online=' + navigator.onLine + ', pack=' + !!window.SysRepPedidosOfflinePack);
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    btn.disabled = true;
    if (!navigator.onLine) {
      window.msToast('Sem internet — conecte-se para preparar o offline', 'warn');
      btn.disabled = false;
      return;
    }
    if (!window.SysRepPedidosOfflinePack) {
      window.msToast('Módulo offline não carregado — recarregue o app', 'err');
      btn.disabled = false;
      return;
    }
    window.msToast('Baixando dados para uso offline…', 'info');
    var tkn = localStorage.getItem('token') || sessionStorage.getItem('token') || '';
    SysRepPedidosOfflinePack.preparePack(function (url) {
      return fetch(url, { headers: { 'Authorization': 'Bearer ' + tkn } });
    }).then(function () {
      window.msToast('App pronto para uso offline por 7 dias ✓', 'ok');
      _atualizarStatusOfflinePack();
      SysRepPedidosOfflinePack.updatePackBadge();
    }).catch(function (e) {
      console.error('[SysRep] preparePack erro:', e);
      window.msToast(e.message || 'Erro ao preparar offline', 'err');
    }).finally(function () {
      btn.disabled = false;
    });
  }

  window.addEventListener('message', function (event) {
    var data = event.data || {};
    // Item 5: subtítulo dinâmico postado pelas páginas
    if (data.type === 'ms-subtitle' && typeof data.text === 'string') {
      var subtitleEl = document.getElementById('ms-subtitle');
      if (subtitleEl) subtitleEl.textContent = data.text;
      return;
    }
    if (data.type === 'mobile-pedidos-home-confirmed') {
      shellGoHome(true);
      return;
    }
    if (data.type === 'ms-chrome-state') {
      if (data.root === true) {
        document.body.classList.remove('ms-chrome-hidden');
        updateFabVisibility(true);
        if (typeof window._reloadSummary === 'function') window._reloadSummary();
      } else if (data.root === false) {
        document.body.classList.add('ms-chrome-hidden');
        updateFabVisibility(false);
      } else {
        updateShellChrome();
      }
      return;
    }
    if (data.type === 'foto-carrossel-abrir') {
      _abrirCarrosselShell(data.url, data.desc);
      return;
    }
    if (data.type === 'foto-carrossel-atualizar') {
      _atualizarCarrosselShell(data.urls, data.idx);
      return;
    }
    if (data.type === 'sysrep-pedidos-salvar-sair') {
      openUrl('/home.html', 'Início');
      return;
    }
    if (data.type === 'navigate' && data.url) {
      var label = 'SysRep';
      if (data.url.indexOf('pedidos') >= 0) label = 'Pedidos';
      else if (data.url.indexOf('visitas') >= 0) label = 'Visitas';
      else if (data.url.indexOf('clientes') >= 0) label = 'Clientes';
      openUrl(data.url, label);
      return;
    }
    if (data.type === 'ms-open-url' && data.url) {
      if (typeof window._fecharModalVitrineShell === 'function') window._fecharModalVitrineShell();
      var url = String(data.url);
      if (url.indexOf('https://wa.me') === 0 || (url.indexOf('http') === 0 && url.indexOf(location.origin) !== 0)) {
        window.location.href = url;
        return;
      }
      var path = url;
      if (url.indexOf('http') === 0) {
        try {
          var parsed = new URL(url);
          if (parsed.origin === location.origin) {
            path = parsed.pathname + parsed.search + parsed.hash;
          } else {
            window.location.href = url;
            return;
          }
        } catch (_) {}
      }
      if (path.charAt(0) !== '/') path = '/' + path;
      openUrl(path, path.indexOf('/vitrine') === 0 ? 'Vitrine' : 'SysRep');
      return;
    }
    if (data.type !== 'mobile-pedidos-form-state') return;
    pedidosFormOpen = !!data.open;
    window._msPedidosFormOpen = pedidosFormOpen;

    var badge = document.getElementById('ms-badge-filtros');
    if (badge && !pedidosFormOpen) {
      if (data.filtersCount && data.filtersCount > 0) {
        badge.textContent = data.filtersCount;

      } else {
        badge.style.display = 'none';
      }
    }

    updatePedidosTopAction();
    updateShellChrome();
    if (pedidosFormOpen) {
      var shellTitle = (typeof data.shellTitle === 'string' && data.shellTitle.trim()) ? data.shellTitle.trim() : (data.mode === 'edit' ? 'Editar pedido' : 'Novo pedido');

        try { frame.contentWindow.postMessage({ type: 'mobile-pedidos-scroll-top' }, '*'); } catch (_) {}
        try { frame.contentWindow.scrollTo(0, 0); } catch (_) {}

    var activePedidos = document.querySelector('.ms-nav-item.active[data-ms-href="/pages/pedidos.html"]');

<script>
(function () {
  var summaryEl = document.getElementById('ms-summary');
  var _sumTimer = null;

  function fmtBRL(v) {
    var n = parseFloat(v) || 0;
    if (n >= 1e6) return 'R$ ' + (n / 1e6).toFixed(1).replace('.', ',') + ' M';
    if (n >= 1e3) return 'R$ ' + (n / 1e3).toFixed(0) + ' k';
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  var _summaryData    = {};
  var _summaryRotas   = {};

  function renderSummary(data, rotas) {
    if (!summaryEl) return;
    var d = Object.assign({}, _summaryData, data || {});
    var r = Object.assign({}, _summaryRotas, rotas || {});
    _summaryData  = d;
    _summaryRotas = r;

    var badgeRotas = document.getElementById('ms-badge-rotas');
    if (badgeRotas) {
      var n = parseInt(r.rotas_pendentes) || 0;
      if (n > 0) { badgeRotas.textContent = n > 9 ? '9+' : n; badgeRotas.style.display = 'flex'; }
      else { badgeRotas.style.display = 'none'; }
    }

    var elPedidos = document.getElementById('ms-sum-pedidos-val');
    var elValor   = document.getElementById('ms-sum-valor-val');
    var elVisitas = document.getElementById('ms-sum-visitas-val');
    if (elPedidos) elPedidos.textContent = d.pedidos || 0;
    if (elValor)   elValor.textContent   = fmtBRL(d.valor);
    if (elVisitas) {
      if (r.total_rotas > 0) {
        elVisitas.textContent = (r.visitados || 0) + '/' + (r.total_clientes || 0);
        var cardVisitas = document.getElementById('ms-sum-visitas');
        if (cardVisitas) {
          var icoEl = cardVisitas.querySelector('.sum-card-ico');
          var lblEl = cardVisitas.querySelector('span:last-child');
          if (icoEl) icoEl.textContent = '🗺️';
          if (lblEl) lblEl.textContent = 'Rota';
        }
      } else {
        elVisitas.textContent = d.visitas || 0;
      }
    }
    summaryEl.classList.add('show', 'loaded');
    document.body.classList.add('has-summary');
  }

  function loadSummary() {
    if (window._msSummaryAuthFailed) return;
    var token = sessionStorage.getItem('token') || localStorage.getItem('token');
    if (!token || !navigator.onLine) return;
    var onHome = typeof window._msIsHomeDashboardRoot === 'function'
      ? window._msIsHomeDashboardRoot()
      : !document.body.classList.contains('ms-chrome-hidden');
    if (!onHome) {
      if (summaryEl) summaryEl.classList.remove('show', 'loaded');
      document.body.classList.remove('has-summary');
      return;
    }
    if (summaryEl) {
      summaryEl.classList.add('show');
      document.body.classList.add('has-summary');
    }
    fetch('/api/mobile/resumo-dia', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(function (r) {
      if (r && (r.status === 401 || r.status === 403)) {
        window._msSummaryAuthFailed = true;
        return null;
      }
      return r && r.ok ? r.json() : null;
    })
    .then(function (d) { if (d) renderSummary(d, null); })
    .catch(function () {});

    fetch('/api/regiao-rota/rotas-vendedor/resumo-dia', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d) renderSummary(null, d); })
    .catch(function () {});
  }

  // Carrega ao iniciar
  loadSummary();

  // Atualiza ao navegar para pedidos ou visitas (frame load)
  var frame = document.getElementById('ms-frame');
  if (frame) {
    frame.addEventListener('load', function () {
      clearTimeout(_sumTimer);
      _sumTimer = setTimeout(loadSummary, 800);
    });
  }

  // Atualiza a cada 3 min enquanto visível
  setInterval(function () {
    if (document.visibilityState === 'visible') loadSummary();
  }, 180000);

  window._reloadSummary = loadSummary;
})();
</script>
<script>
// ── Item 6: Pull-to-refresh ──────────────────────────────────────────────────
(function () {
  var ptr       = document.getElementById('ms-ptr');
  var frameWrap = document.getElementById('ms-frame-wrap');
  var msFrame   = document.getElementById('ms-frame');
  if (!ptr || !frameWrap || !msFrame) return;

  var _startY     = 0;
  var _tracking   = false;
  var _refreshing = false;
  var THRESHOLD   = 72;
  var MAX_PULL    = 54;

  function _iframeScrollY() {
    try { return msFrame.contentWindow.scrollY || msFrame.contentWindow.pageYOffset || 0; } catch (_) { return 0; }
  }

  frameWrap.addEventListener('touchstart', function (e) {
    if (_refreshing || window._msPedidosFormOpen) return;
    if (_iframeScrollY() > 4) return;
    _startY   = e.changedTouches[0].clientY;
    _tracking = true;
  }, { passive: true });

  frameWrap.addEventListener('touchmove', function (e) {
    if (!_tracking || _refreshing) return;
    var dy = e.changedTouches[0].clientY - _startY;
    if (dy <= 0) { _tracking = false; return; }
    var h = Math.min(dy * 0.45, MAX_PULL);
    ptr.style.height  = h + 'px';
    ptr.style.opacity = String(Math.min(dy / THRESHOLD, 1));
  }, { passive: true });

  frameWrap.addEventListener('touchend', function (e) {
    if (!_tracking || _refreshing) return;
    _tracking = false;
    var dy = e.changedTouches[0].clientY - _startY;

    if (dy >= THRESHOLD) {
      _refreshing = true;
      ptr.classList.add('active');
      ptr.style.height  = '';
      ptr.style.opacity = '';
      try {
        msFrame.contentWindow.postMessage({ type: 'mobile-refresh' }, '*');
      } catch (_) {
        msFrame.src = msFrame.src;
      }
      setTimeout(function () {
        ptr.classList.remove('active');
        _refreshing = false;
      }, 1400);
    } else {
      ptr.style.height  = '';
      ptr.style.opacity = '';
    }
  }, { passive: true });

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'ms-pull-refresh-done') return;
    _refreshing = false;
    if (ptr) {
      ptr.classList.remove('active');
      ptr.style.height = '';
      ptr.style.opacity = '';
    }
  });
})();
</script>

<script>
  function safeReload() {
    if (window._msPedidosFormOpen) return;
    window.location.reload();
  }

  sysrepInitServiceWorker().catch(function () {});
  sysrepAttachSwReload(safeReload);

  // Polling: detecta novo deploy mesmo com tab aberta há muito tempo
  (function () {
    var _ver = null;
    fetch('/api/version', { cache: 'no-store' }).then(r => r.json()).then(d => { _ver = d.v; }).catch(() => {});
    setInterval(function () {
      if (!_ver) return;
      fetch('/api/version', { cache: 'no-store' })
        .then(r => r.json())
        .then(d => { if (d.v !== _ver) safeReload(); })
        .catch(() => {});
    }, 5 * 60 * 1000);

  var frame = document.getElementById('ms-frame');
  var ptr = document.getElementById('ms-ptr');
  var ptrActive = false;
  function ptrDone() {
    if (ptr) ptr.classList.remove('active');
    ptrActive = false;
  }
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'ms-pull-refresh' || ptrActive) return;
    ptrActive = true;
    if (ptr) ptr.classList.add('active');
    var safety = setTimeout(ptrDone, 6000);
    function onLoaded() {
      frame.removeEventListener('load', onLoaded);
      clearTimeout(safety);
      setTimeout(ptrDone, 300);
    }
    frame.addEventListener('load', onLoaded);
    setTimeout(function () {
      try { frame.contentWindow.location.reload(); } catch(_) { frame.src = frame.src; }

  var offlineBanner = document.getElementById('ms-offline-banner');

  async function syncOffline() {
    var off = !navigator.onLine;

    document.body.classList.toggle('has-offline-banner', off);
    // Dot de conexão — criado via JS para não ser removido pelo formatter
    var dot = document.getElementById('ms-conn-dot');
    if (!dot) {
      dot = document.createElement('span');
      dot.id = 'ms-conn-dot';
      dot.setAttribute('aria-hidden', 'true');
      dot.style.cssText = 'display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;align-self:center;transition:background .4s;margin-right:2px';
      var actionsEl = document.querySelector('.ms-actions');
      if (actionsEl) actionsEl.insertBefore(dot, actionsEl.firstChild);

    dot.style.background = off ? '#ef4444' : '#22c55e';
    dot.title = off ? 'Offline' : 'Online';
    atualizarBotaoSync();
  }

  async function atualizarBotaoSync() {
    if (!window.OfflineSync) return;
    try {
      var st = await window.OfflineSync.getStatus();
      var lsCount = window.SysRepPedidosOffline ? window.SysRepPedidosOffline.count() : 0;
      var totalPend = (st.pendentes || 0) + (lsCount || 0);
      var badge = document.getElementById('ms-sync-badge');
      if (badge) {
        if (totalPend > 0) {
          badge.style.display = 'inline-flex';
          badge.textContent   = totalPend > 9 ? '9+' : totalPend;
        } else {
          badge.style.display = 'none';
        }
      }
      // Atualiza texto do banner offline com info de dados locais
      if (offlineBanner && !navigator.onLine && st.clientes > 0) {
        var pend = totalPend > 0 ? ' · ' + totalPend + ' pedido(s) pendente(s)' : '';
        offlineBanner.textContent = '📵 Offline · ' + st.clientes + ' clientes · ' + st.produtos + ' produtos' + pend;
      }
    } catch (_) {}
  }

  async function msSyncManual() {
    if (_syncSpinning) return;
    var icon = document.getElementById('ms-sync-icon');
    _syncSpinning = true;
    if (icon) icon.style.transform = 'rotate(360deg)';
    setTimeout(function() { if (icon) icon.style.transform = ''; _syncSpinning = false; }, 700);

    if (!navigator.onLine) {
      window.msToast('Sem conexão para sincronizar', 'warn');
      return;
    }
    try {
      var msg = [];

      // Fila localStorage (pedidos criados offline)
      if (window.SysRepPedidosOffline && typeof window.SysRepPedidosOffline.syncAll === 'function') {
        var token = localStorage.getItem('token') || sessionStorage.getItem('token') || '';
        var lsRes = await window.SysRepPedidosOffline.syncAll(function(url, method, body) {
          return fetch(url, {
            method: method || 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined
          });
        }).catch(() => ({ synced: 0 }));
        if (lsRes.synced > 0) msg.push(lsRes.synced + ' pedido(s) enviado(s)');
        if (lsRes.failed > 0) window.msToast(lsRes.failed + ' pedido(s) offline com erro', 'err');
      }

      var res = await window.OfflineSync.sincronizarTudo();
      if (res.dados && res.dados.clientes !== undefined)
        msg.push(res.dados.clientes + ' clientes · ' + res.dados.produtos + ' produtos');
      if (res.fila && res.fila.synced > 0)
        msg.push(res.fila.synced + ' item(ns) de fila enviado(s)');
      if (msg.length) window.msToast('✓ ' + msg.join(' · '), 'ok');
      atualizarBotaoSync();

      window.msToast('Erro ao sincronizar: ' + e.message, 'err');

  // ── Resumo do dia ────────────────────────────────────────────────────────
  function carregarResumoDia() {
    var tkn = sessionStorage.getItem('token') || localStorage.getItem('token') || '';
    if (!tkn) return;
    var summary = document.getElementById('ms-summary');
    if (!summary) return;
    var offCount = window.SysRepPedidosOffline ? window.SysRepPedidosOffline.count() : 0;

    function _renderSummary(pedidos, valor, visitas) {
      var pedVal = document.getElementById('ms-sum-pedidos-val');
      var valVal = document.getElementById('ms-sum-valor-val');
      var visVal = document.getElementById('ms-sum-visitas-val');
      if (pedVal) pedVal.textContent = pedidos;
      if (valVal) valVal.textContent = valor > 0
        ? (valor >= 1000 ? 'R$ ' + (valor / 1000).toFixed(1) + 'k' : 'R$ ' + Math.round(valor))
        : (pedidos > 0 ? 'R$ 0' : '—');
      if (visVal) visVal.textContent = visitas >= 0 ? visitas : '—';
      summary.classList.add('show', 'loaded');
      document.body.classList.add('has-summary');
    }

    if (!navigator.onLine) {
      if (offCount > 0) _renderSummary(offCount, 0, -1);
      return;
    }
    fetch('/api/mobile/resumo-dia', { headers: { 'Authorization': 'Bearer ' + tkn } })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) {
        if (!d) return;
        _renderSummary((d.pedidos || 0) + offCount, parseFloat(d.valor || 0), d.visitas || 0);
      })
      .catch(function() { if (offCount > 0) _renderSummary(offCount, 0, -1); });
  }

  // ── Pack automático (atualiza se > 1 dia sem atualizar) ──────────────────
  function _autoAtualizarPack() {
    if (!navigator.onLine || !window.SysRepPedidosOfflinePack) return;
    var tkn = localStorage.getItem('token') || sessionStorage.getItem('token') || '';
    var uid = SysRepPedidosOfflinePack.userIdFromToken(tkn);
    if (!uid) return;
    var until = SysRepPedidosOfflinePack.getOfflineUntil(uid);
    if (!until) return; // nenhum pack — usuário deve preparar manualmente a primeira vez
    var umDia = 86400000;
    // until = savedAt + 7 dias → pack tem > 1 dia se until < now + 6 dias
    if (until >= Date.now() + 6 * umDia) return;
    SysRepPedidosOfflinePack.preparePack(function(url) {
      return fetch(url, { headers: { 'Authorization': 'Bearer ' + tkn } });
    }).then(function() {
      window.msToast('Pacote offline atualizado automaticamente', 'ok');
      if (typeof _atualizarStatusOfflinePack === 'function') _atualizarStatusOfflinePack();
    }).catch(function() {});
  }

  window.addEventListener('online',  syncOffline);
  window.addEventListener('offline', syncOffline);
  syncOffline();
  window.addEventListener('online', carregarResumoDia);
  window.addEventListener('online', function() { setTimeout(_autoAtualizarPack, 3000); });

  // Liga auto-sync: baixa dados ao abrir com internet (se velhos) + envia fila ao voltar online
  if (window.OfflineSync) {
    window.OfflineSync.bindAutoSync(function(res) {
      if (res.tipo === 'fila' && res.synced > 0 && !res.silencioso) {
        if (typeof toast === 'function') toast('✓ ' + res.synced + ' pedido(s) sincronizado(s)', 'ok');
      }
      atualizarBotaoSync();
    });
    // Atualiza badge ao carregar e a cada 10s
    setTimeout(atualizarBotaoSync, 800);
    setInterval(atualizarBotaoSync, 10000);
  }

  setTimeout(carregarResumoDia, 1200);
  setTimeout(_autoAtualizarPack, 5000);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (!sessionStorage.getItem('token') && localStorage.getItem('token')) {
      try {
        sessionStorage.setItem('token', localStorage.getItem('token'));
        var _u = localStorage.getItem('user'); if (_u) sessionStorage.setItem('user', _u);
        var _e = localStorage.getItem('empresa'); if (_e) sessionStorage.setItem('empresa', _e);
        var _p = localStorage.getItem('parametros_locais'); if (_p) sessionStorage.setItem('parametros_locais', _p);
      } catch(_) {}
    }
    carregarResumoDia();
  });
</script>

  transform: translateX(-50%); background: #16a34a; color: #fff; padding: 10px 18px;

  opacity: 0; transition: opacity .25s; pointer-events: none;

</style>
<script>
(function () {
  var legacy = document.getElementById('modalVitrine');
  if (legacy) legacy.remove();

  var modal = document.getElementById('modalVitrineShell');
  var bodyEl = document.getElementById('mv-shell-body');
  if (!modal || !bodyEl) return;

  var _blockClose = false;
  var _vitrinePath = '';
  var _vitrineWa = '';

  function toast(msg) {
    var el = document.getElementById('ms-vitrine-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ms-vitrine-toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.style.opacity = '0'; }, 2200);
  }

  function fechar() {
    if (_blockClose) return;
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    bodyEl.innerHTML = '';
    _vitrinePath = '';
    _vitrineWa = '';
  }
  window._fecharModalVitrineShell = fechar;

  function abrirUrl(path) {
    fechar();
    if (!path) return;
    window.dispatchEvent(new MessageEvent('message', {
      data: { type: 'ms-open-url', url: path }
    }));
  }

  function renderLoading() {
    bodyEl.innerHTML = '<div class="vitrine-spin" role="status" aria-label="Gerando link"></div>';
  }

  function renderContent(data) {
    var link = String(data.link || '');
    var expira = String(data.expira || '');
    _vitrinePath = String(data.path || link.replace(location.origin, '') || '');
    _vitrineWa = String(data.waUrl || '');
    var esc = function (s) {
      return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    };
    bodyEl.innerHTML =
      '<div class="vitrine-body">' +
        '<p class="vitrine-desc">Link válido até <strong>' + esc(expira) + '</strong>. Compartilhe com o cliente para que ele consulte produtos e faça pedidos.</p>' +
        '<div class="vitrine-link-row">' +
          '<input class="vitrine-link-input" id="mv-shell-link" readonly value="' + esc(link) + '">' +
          '<button type="button" class="btn btn-primary" id="btnVitrineShellCopy">Copiar</button>' +
        '</div>' +
        '<div class="vitrine-actions">' +
          '<button type="button" class="btn btn-ghost" id="btnVitrineShellOpen">Abrir vitrine</button>' +
          '<button type="button" class="btn btn-ghost" id="btnVitrineShellWa">Enviar WhatsApp</button>' +
        '</div>' +
      '</div>';

    document.getElementById('btnVitrineShellCopy').addEventListener('click', function (e) {
      e.preventDefault();
      var inp = document.getElementById('mv-shell-link');
      if (!inp) return;
      var txt = inp.value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { toast('Link copiado!'); });
      } else {
        inp.select();
        try { document.execCommand('copy'); toast('Link copiado!'); } catch (_) {}
      }
    });
    document.getElementById('btnVitrineShellOpen').addEventListener('click', function (e) {
      e.preventDefault();
      abrirUrl(_vitrinePath);
    });
    document.getElementById('btnVitrineShellWa').addEventListener('click', function (e) {
      e.preventDefault();
      abrirUrl(_vitrineWa);
    });
  }

  function abrir() {
    _blockClose = true;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(function () { _blockClose = false; }, 450);
  }

  modal.addEventListener('click', function (e) {
    if (e.target === modal && !_blockClose) fechar();
  });
  modal.querySelector('.vitrine-panel').addEventListener('click', function (e) {
    e.stopPropagation();
  });
  document.getElementById('btnVitrineShellClose').addEventListener('click', function (e) {
    e.preventDefault();
    fechar();
  });

  window.addEventListener('message', function (ev) {
    var data = ev.data || {};
    if (data.type === 'ms-vitrine-loading') {
      abrir();
      renderLoading();
      return;
    }
    if (data.type === 'ms-vitrine-show') {
      abrir();
      renderContent(data);
      return;
    }
    if (data.type === 'ms-vitrine-error') {
      abrir();
      bodyEl.innerHTML = '<div class="vitrine-err">' + String(data.message || 'Erro ao gerar link') + '</div>';
    }
  });
})();
</script>
